# =============================================================================
# Brújula Salvaje — entorno LOCAL dev/test (TKT-F6-001, Skill_devops F6)
# Solo local: sin despliegue, sin costes, sin secretos reales (CLAUDE.md §0.5, DEC-AUTO-002).
#
#   bash scripts/ops/init-env.sh                 # crea .env local (una vez)
#   docker compose up -d --wait db                # solo PostgreSQL (INFRA-DB-000)
#   docker compose up -d --build --wait           # stack completo (requiere backend/ y frontend/)
#   docker compose --profile ops up -d --build    # + scheduler (comandos programados) + backup
#   docker compose -f compose.yaml -f compose.debug.yaml up -d db   # BD en 127.0.0.1:55432
#
# Topología (Skill_devops §8):  navegador -> proxy(127.0.0.1:8080) -> frontend SSR / backend -> db
#   red "publica": solo proxy (única red con puertos publicados)
#   red "app"   (internal): proxy, frontend, backend
#   red "datos" (internal): backend, migrate, scheduler, backup, db
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-brujula}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: ../infra/docker/backend.Dockerfile
  additional_contexts:
    infra: ./infra
  args:
    APP_VERSION: ${APP_VERSION:-0.0.0-dev}

# Variables comunes del backend (web, migrate, scheduler). DB_USER/DB_PASSWORD por servicio.
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?definir en .env (scripts/ops/init-env.sh)}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  THROTTLE_HMAC_KEY: ${THROTTLE_HMAC_KEY:?definir en .env}
  MFA_FERNET_KEY: ${MFA_FERNET_KEY:?definir en .env}
  MEDIA_ROOT: /var/lib/brujula/media
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-/media/publico/}
  LIBRO_ANONIMIZACIONES_PATH: /var/lib/brujula/ops/libro_anonimizaciones.log
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-brujula}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  TZ: UTC

services:
  # ---------------------------------------------------------------------------
  # Preparación de volúmenes (one-shot, idempotente): propietarios y permisos independientes
  # del orden en que Docker cree los volúmenes (DEC-AUTO-149). Reutiliza la imagen fijada de la BD.
  # ---------------------------------------------------------------------------
  init-volumes:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /vol/media/publico /vol/media/privado
        chmod 0755 /vol/media /vol/media/publico
        chmod 0750 /vol/media/privado
        chmod 0750 /vol/ops
        chmod 0700 /vol/backups
        chown 10001:10001 /vol/media /vol/media/publico /vol/media/privado /vol/ops
        chown 999:999 /vol/backups
        echo "volúmenes preparados"
    volumes:
      - media:/vol/media
      - ops_libro:/vol/ops
      - backups:/vol/backups

  # ---------------------------------------------------------------------------
  # PostgreSQL 18.6 — INFRA-DB-000 (infra/db/init), ADR-DB-001
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    <<: *hardening
    user: "999:999"                     # postgres de la imagen; sin fase root ni gosu
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?definir en .env (scripts/ops/init-env.sh)}
      POSTGRES_DB: postgres             # la BD de la aplicación la crea 10-bootstrap.sh
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --auth-local=trust --auth-host=scram-sha-256"
      DB_NAME: ${DB_NAME:-brujula}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?definir en .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?definir en .env}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?definir en .env}
      APP_BACKUP_PASSWORD: ${APP_BACKUP_PASSWORD:?definir en .env}
      DB_BOOTSTRAP_TEST_TEMPLATE: ${DB_BOOTSTRAP_TEST_TEMPLATE:-false}
      TZ: UTC
    # Parámetros orientativos de ADR-DB-001 §8 + privacidad de logs (DEC-AUTO-145)
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - log_timezone=UTC
      - -c
      - timezone=UTC
    volumes:
      - db_data:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775
      - /tmp:uid=999,gid=999,mode=1777
    networks: [datos]
    # Sin "ports": la BD no se publica (usar compose.debug.yaml para 127.0.0.1)
    healthcheck:
      # TCP en 127.0.0.1: el servidor temporal del init solo escucha en el socket unix,
      # así que "healthy" implica que INFRA-DB-000 terminó.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "${DB_NAME:-brujula}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  # ---------------------------------------------------------------------------
  # Job de migración (app_migrator) antes de la web (DB_HANDOFF plan_migraciones, §23.4)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      <<: *backend-build
      target: runtime
    image: brujula/backend:${APP_VERSION:-0.0.0-dev}
    <<: *hardening
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *backend-env
      DB_USER: app_migrator
      DB_PASSWORD: ${APP_MIGRATOR_PASSWORD:?definir en .env}
    tmpfs: ["/tmp"]
    networks: [datos]
    depends_on:
      db: {condition: service_healthy}
    healthcheck: {disable: true}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m}

  # ---------------------------------------------------------------------------
  # Backend Django (gunicorn) — rol app_rw
  # ---------------------------------------------------------------------------
  backend:
    build:
      <<: *backend-build
      target: runtime
    image: brujula/backend:${APP_VERSION:-0.0.0-dev}
    <<: *hardening
    environment:
      <<: *backend-env
      DB_USER: app_rw
      DB_PASSWORD: ${APP_RW_PASSWORD:?definir en .env}
      OTEL_SERVICE_NAME: brujula-backend
    volumes:
      - media:/var/lib/brujula/media
      - ops_libro:/var/lib/brujula/ops
    tmpfs: ["/tmp"]
    networks: [app, datos]
    depends_on:
      init-volumes: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      # Readiness (SELECT 1 con app_rw, ADR-DB-005 §4)
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1g}

  # ---------------------------------------------------------------------------
  # Frontend Angular 22 SSR (Node) — sin acceso a la red de datos
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        ANGULAR_PROJECT: brujula-salvaje
    image: brujula/frontend:${APP_VERSION:-0.0.0-dev}
    <<: *hardening
    environment:
      NODE_ENV: production
      PORT: "4000"
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: brujula-frontend
      TZ: UTC
    tmpfs: ["/tmp"]
    networks: [app]
    depends_on:
      backend: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m}

  # ---------------------------------------------------------------------------
  # Reverse proxy de mismo origen (nginx sin privilegios) — único servicio publicado
  # ---------------------------------------------------------------------------
  proxy:
    build:
      context: ./infra/proxy
      dockerfile: Dockerfile
    image: brujula/proxy:${APP_VERSION:-0.0.0-dev}
    <<: *hardening
    ports:
      - "127.0.0.1:${PROXY_HOST_PORT:-8080}:8080"
    volumes:
      - media:/srv/media:ro
    tmpfs: ["/tmp:uid=101,gid=101,mode=0755"]
    networks: [publica, app]
    depends_on:
      init-volumes: {condition: service_completed_successfully}
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

  # ---------------------------------------------------------------------------
  # Perfil "ops": comandos de gestión programados (sin Celery ni broker, DEC-AUTO-122)
  # ---------------------------------------------------------------------------
  scheduler:
    profiles: ["ops"]
    build:
      <<: *backend-build
      target: scheduler
    image: brujula/scheduler:${APP_VERSION:-0.0.0-dev}
    <<: *hardening
    environment:
      <<: *backend-env
      DB_USER: app_rw
      DB_PASSWORD: ${APP_RW_PASSWORD:?definir en .env}
      OTEL_SERVICE_NAME: brujula-scheduler
    volumes:
      - media:/var/lib/brujula/media
      - ops_libro:/var/lib/brujula/ops
    tmpfs: ["/tmp"]
    networks: [datos]
    depends_on:
      init-volumes: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512m}

  # Copias diarias cifradas (ADR-DB-004 §3) — rol app_backup, medios y libro en solo lectura
  backup:
    profiles: ["ops"]
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
      additional_contexts:
        ops: ./scripts/ops
    image: brujula/backup:${APP_VERSION:-0.0.0-dev}
    <<: *hardening
    group_add: ["10001"]                # lee medios privados y el libro (dirs 0750, archivos 0640 del grupo app)
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-brujula}
      PGUSER: app_backup
      PGPASSWORD: ${APP_BACKUP_PASSWORD:?definir en .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /backups
      MEDIA_DIR: /srv/media
      OPS_DIR: /srv/ops
      TZ: UTC
    volumes:
      - backups:/backups
      - media:/srv/media:ro
      - ops_libro:/srv/ops:ro
    tmpfs: ["/tmp:uid=999,gid=999,mode=0700"]
    networks: [datos]
    depends_on:
      init-volumes: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512m}

networks:
  publica: {}
  app:
    internal: true
  datos:
    internal: true

volumes:
  db_data: {}
  media: {}
  ops_libro: {}
  backups: {}
