# ---------------------------------------------------------------------------
# REQUISITOS
# Todos: version "1.0", creado_por Skill_Requerimientos, fecha 2026-09-24, estado PROPOSED
# ---------------------------------------------------------------------------
requisitos:

  # ---- Business / Constraints ----
  - id: REQ-001
    nivel: Business
    tipo: BR
    titulo: "Portal editorial de aventura en español"
    descripcion: "El producto SHALL ser un portal web editorial de viajes de aventura, en español, cuyo propósito es inspirar a los visitantes a explorar destinos, itinerarios y guías expertas."
    moscow: Must
    criticidad: CRITICAL
    origen: "USUARIO (P1, P2, P3, P8)"
    satisface: [PRB-001, OBJ-001, STN-001]
    estado: PROPOSED
    ac:
      - {id: AC-001, criterio: "El sitio publicado en local presenta destinos, itinerarios y guías de aventura navegables desde la página de inicio.", metodo: Demonstration}
    health: *hc_usuario

  - id: REQ-002
    nivel: System
    tipo: CR
    titulo: "Sin cuentas públicas"
    descripcion: "El sitio público SHALL NOT ofrecer registro, inicio de sesión ni perfiles para visitantes. Toda función pública SHALL estar disponible de forma anónima."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P6)"
    satisface: [STN-004, OBJ-003]
    estado: PROPOSED
    ac:
      - {id: AC-002, criterio: "Ninguna ruta pública muestra formulario de registro o login; todas las rutas públicas responden 200 sin sesión.", metodo: Test}
    health: *hc_usuario

  - id: REQ-003
    nivel: System
    tipo: CR
    titulo: "Sin datos personales de visitantes"
    descripcion: "El sistema SHALL NOT recopilar, almacenar ni transmitir datos personales de visitantes (formularios, identificadores persistentes, analítica o huella digital)."
    moscow: Must
    criticidad: CRITICAL
    origen: "USUARIO (P10)"
    satisface: [STN-004]
    derivados: [REQ-057, REQ-059]
    estado: PROPOSED
    ac:
      - {id: AC-003, criterio: "La inspección del modelo de datos no contiene entidades de visitante; no existe ningún formulario público que envíe datos al servidor.", metodo: Inspection}
    health: *hc_usuario

  - id: REQ-004
    nivel: System
    tipo: CR
    titulo: "Sin integraciones externas"
    descripcion: "El sistema SHALL NOT depender en tiempo de ejecución de servicios, APIs, CDNs, fuentes tipográficas o mapas de terceros."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P12)"
    satisface: [STN-004]
    estado: PROPOSED
    ac:
      - {id: AC-004, criterio: "Con el sistema levantado y la red externa bloqueada, todas las plantillas públicas se renderizan completas (imágenes, fuentes, mapa).", metodo: Test}
    health: *hc_usuario

  - id: REQ-005
    nivel: System
    tipo: CR
    titulo: "Solo español"
    descripcion: "El sistema SHALL ofrecer la interfaz y el contenido únicamente en español; no se requiere multi-idioma."
    moscow: Must
    criticidad: MEDIUM
    origen: "USUARIO (P9)"
    satisface: [STN-005]
    derivados: [REQ-058]
    estado: PROPOSED
    ac:
      - {id: AC-005, criterio: "Revisión de todas las plantillas: 0 textos de interfaz en otro idioma.", metodo: Review}
    health: *hc_usuario

  - id: REQ-006
    nivel: System
    tipo: CR
    titulo: "Entrega local sin costes"
    descripcion: "La entrega SHALL consistir en construcción y pruebas locales ejecutables con Docker Compose, sin contraer costes recurrentes ni desplegar a entornos compartidos o de producción."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-002); SRC-003"
    satisface: [PRB-001]
    estado: PROPOSED
    ac:
      - {id: AC-006, criterio: "Un único comando de Compose levanta el sistema completo en local sin credenciales reales ni servicios de pago.", metodo: Demonstration}
    health: *hc_expansion

  # ---- Functional ----
  - id: REQ-010
    nivel: Software
    tipo: FR
    titulo: "Inicio inspiracional"
    descripcion: "La página de inicio SHALL mostrar un bloque principal inspiracional, al menos 6 destinos destacados, los tipos de aventura, al menos 3 itinerarios destacados, al menos 3 guías destacadas y accesos a explorar/buscar."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P3); formato EXPANSIÓN_AUTÓNOMA (DEC-AUTO-008)"
    dec_auto: [DEC-AUTO-008]
    satisface: [STN-001, OBJ-001]
    estado: PROPOSED
    ac:
      - {id: AC-010, criterio: "La página de inicio contiene >=6 destinos, todos los tipos de aventura publicados, >=3 itinerarios y >=3 guías destacadas, cada uno enlazado a su página.", metodo: Test}
      - {id: AC-011, criterio: "Los destacados son configurables desde el panel editorial sin cambiar código.", metodo: Demonstration}
    health: *hc_expansion

  - id: REQ-011
    nivel: Software
    tipo: FR
    titulo: "Catálogo de destinos"
    descripcion: "El sistema SHALL listar todos los destinos publicados con imagen, nombre, país, tipos de aventura y dificultad, con paginación (<=24 por página) y orden alfabético o por dificultad."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P1, P13)"
    satisface: [STN-002, STN-006]
    estado: PROPOSED
    ac:
      - {id: AC-012, criterio: "Con el dataset semilla, el listado muestra los >=20 destinos publicados y ninguno en borrador o retirado.", metodo: Test}
      - {id: AC-013, criterio: "Cambiar el orden reordena los resultados según el criterio elegido.", metodo: Test}
    health: *hc_usuario

  - id: REQ-012
    nivel: Software
    tipo: FR
    titulo: "Ficha de destino"
    descripcion: "El sistema SHALL mostrar para cada destino todos los campos del modelo mínimo (PRD §6.2) y enlaces a sus tipos de aventura, itinerarios y guías relacionadas."
    moscow: Must
    criticidad: CRITICAL
    origen: "USUARIO (P1); campos EXPANSIÓN_AUTÓNOMA (DEC-AUTO-008)"
    dec_auto: [DEC-AUTO-008]
    satisface: [STN-001, STN-003, OBJ-002]
    estado: PROPOSED
    ac:
      - {id: AC-014, criterio: "Para cada destino semilla, la ficha renderiza todos los campos obligatorios de PRD §6.2.", metodo: Test}
      - {id: AC-015, criterio: "Un slug inexistente devuelve la página 404 del sitio con enlaces de navegación.", metodo: Test}
    health: *hc_expansion

  - id: REQ-013
    nivel: Software
    tipo: FR
    titulo: "Tipos de aventura"
    descripcion: "El sistema SHALL ofrecer una taxonomía de al menos 10 tipos de aventura; cada tipo SHALL tener una página con descripción, nivel de exigencia y destinos asociados."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-006)"
    dec_auto: [DEC-AUTO-006]
    satisface: [STN-002]
    estado: PROPOSED
    ac:
      - {id: AC-016, criterio: ">=10 tipos publicados; cada página de tipo lista >=1 destino asociado.", metodo: Test}
    health: *hc_expansion

  - id: REQ-014
    nivel: Software
    tipo: FR
    titulo: "Filtros facetados"
    descripcion: "El catálogo SHALL permitir combinar filtros por tipo de aventura, continente/región, país, dificultad, mes de mejor época, duración y nivel de presupuesto; el estado de filtros SHALL reflejarse en la URL."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-012)"
    dec_auto: [DEC-AUTO-012]
    satisface: [STN-002]
    estado: PROPOSED
    ac:
      - {id: AC-017, criterio: "Aplicar tipo=Trekking y dificultad<=3 devuelve exactamente los destinos del dataset que cumplen ambas condiciones.", metodo: Test}
      - {id: AC-018, criterio: "Recargar o compartir la URL filtrada reproduce el mismo resultado; sin resultados se muestra un estado vacío con sugerencias.", metodo: Test}
    health: *hc_expansion

  - id: REQ-015
    nivel: Software
    tipo: FR
    titulo: "Búsqueda interna"
    descripcion: "El sistema SHALL ofrecer búsqueda de texto sobre destinos, itinerarios, guías y tipos, insensible a tildes y mayúsculas, sin servicios externos."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-011)"
    dec_auto: [DEC-AUTO-011]
    satisface: [STN-002]
    estado: PROPOSED
    ac:
      - {id: AC-019, criterio: "Buscar 'patagonia', 'Patagonía' y 'PATAGONIA' devuelve los mismos resultados.", metodo: Test}
      - {id: AC-020, criterio: "Una consulta sin coincidencias muestra estado vacío con enlaces a explorar; la entrada se valida (longitud máxima 100) y no permite inyección.", metodo: Test}
    health: *hc_expansion

  - id: REQ-016
    nivel: Software
    tipo: FR
    titulo: "Itinerarios día a día"
    descripcion: "El sistema SHALL publicar itinerarios vinculados a un destino, con duración total, dificultad, resumen y una sección por día (actividades, distancia/desnivel cuando aplique, alojamiento orientativo, consejos)."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P1 opción A 'itinerarios'); formato EXPANSIÓN_AUTÓNOMA (DEC-AUTO-009)"
    dec_auto: [DEC-AUTO-009]
    satisface: [STN-003]
    estado: PROPOSED
    ac:
      - {id: AC-021, criterio: "Cada itinerario muestra N secciones de día coherentes con su duración y enlaza a su destino; el destino enlaza de vuelta al itinerario.", metodo: Test}
    health: *hc_usuario

  - id: REQ-017
    nivel: Software
    tipo: FR
    titulo: "Guías expertas"
    descripcion: "El sistema SHALL publicar guías/artículos expertos clasificados por categoría (PRD §6.5), con índice por categoría y enlaces a destinos y tipos relacionados."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P1 'contenido experto'); categorías EXPANSIÓN_AUTÓNOMA (DEC-AUTO-010)"
    dec_auto: [DEC-AUTO-010]
    satisface: [STN-003, OBJ-002]
    estado: PROPOSED
    ac:
      - {id: AC-022, criterio: ">=10 guías publicadas repartidas en >=5 categorías; cada categoría tiene página índice.", metodo: Test}
    health: *hc_usuario

  - id: REQ-018
    nivel: Software
    tipo: FR
    titulo: "Mapa de destinos local"
    descripcion: "El sistema SHOULD mostrar un mapa interactivo del mundo con un marcador por destino publicado, usando cartografía servida por el propio sistema, sin teselas ni API de terceros; SHALL existir alternativa accesible en forma de lista."
    moscow: Should
    criticidad: MEDIUM
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-013)"
    dec_auto: [DEC-AUTO-013]
    satisface: [STN-002]
    estado: PROPOSED
    ac:
      - {id: AC-023, criterio: "El mapa muestra un marcador por destino con coordenadas; al activarlo (ratón o teclado) navega a la ficha; 0 solicitudes a dominios externos.", metodo: Test}
    health: *hc_expansion

  - id: REQ-019
    nivel: Software
    tipo: FR
    titulo: "Galería de imágenes"
    descripcion: "Cada destino SHALL tener una galería de al menos 3 imágenes con texto alternativo, pie de foto y créditos; la ampliación SHALL ser operable por teclado."
    moscow: Must
    criticidad: MEDIUM
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-014)"
    dec_auto: [DEC-AUTO-014]
    satisface: [STN-001]
    estado: PROPOSED
    ac:
      - {id: AC-024, criterio: "Cada ficha muestra >=3 imágenes con alt no vacío y crédito visible; la vista ampliada se abre, navega y cierra con teclado (Esc).", metodo: Test}
    health: *hc_expansion

  - id: REQ-020
    nivel: Software
    tipo: FR
    titulo: "Sigue explorando (contenido relacionado)"
    descripcion: "Cada página de destino, itinerario, guía y tipo de aventura SHALL enlazar al menos 3 contenidos relacionados publicados; ninguna página pública SHALL quedar huérfana."
    moscow: Must
    criticidad: HIGH
    origen: "USUARIO (P3 'explorar, descubrimientos'); regla EXPANSIÓN_AUTÓNOMA (DEC-AUTO-032)"
    dec_auto: [DEC-AUTO-032]
    satisface: [STN-002, OBJ-001]
    estado: PROPOSED
    ac:
      - {id: AC-025, criterio: "Un rastreo desde la página de inicio alcanza el 100% de las páginas publicadas (0 huérfanas) y 0 enlaces internos rotos.", metodo: Test}
      - {id: AC-026, criterio: "Cada página de contenido muestra >=3 enlaces relacionados.", metodo: Test}
    health: *hc_expansion

  - id: REQ-021
    nivel: Software
    tipo: FR
    titulo: "Navegación global y errores"
    descripcion: "El sitio SHALL tener cabecera con navegación principal, pie con enlaces institucionales/legales, migas de pan en páginas de detalle, mapa del sitio HTML y páginas 404/500 propias con rutas de salida."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-018)"
    dec_auto: [DEC-AUTO-018]
    satisface: [STN-002]
    estado: PROPOSED
    ac:
      - {id: AC-027, criterio: "Todas las plantillas incluyen cabecera y pie; las páginas de detalle muestran migas de pan correctas; /ruta-inexistente devuelve HTTP 404 con la página propia.", metodo: Test}
    health: *hc_expansion

  - id: REQ-022
    nivel: Software
    tipo: FR
    titulo: "Panel editorial"
    descripcion: "El sistema SHALL ofrecer un panel interno autenticado, solo para staff, para crear, editar, previsualizar, publicar y retirar destinos, tipos, itinerarios, guías, colecciones, glosario, páginas institucionales y medios, con estados borrador/publicado/retirado. Solo el contenido publicado SHALL ser visible al público."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-005)"
    dec_auto: [DEC-AUTO-005, DEC-AUTO-034]
    satisface: [STN-007]
    estado: PROPOSED
    ac:
      - {id: AC-028, criterio: "Un editor crea un destino en borrador (no visible públicamente), lo publica (visible) y lo retira (404/410 público) sin tocar código.", metodo: Demonstration}
      - {id: AC-029, criterio: "Un usuario no autenticado que accede al panel es redirigido al login; no existe enlace al panel en el sitio público.", metodo: Test}
      - {id: AC-030, criterio: "Cada alta/edición/publicación queda registrada con usuario, acción, entidad y fecha.", metodo: Test}
    health: *hc_expansion

  - id: REQ-023
    nivel: Software
    tipo: FR
    titulo: "Autoría, revisión y fuentes"
    descripcion: "Todo destino, itinerario y guía publicado SHALL mostrar autoría (equipo editorial), fecha de última revisión y una sección de fuentes o enlace a la metodología editorial."
    moscow: Must
    criticidad: HIGH
    origen: "EXPANSIÓN_AUTÓNOMA (DEC-AUTO-023)"
    dec_auto: [DEC-AUTO-023, DEC-AUTO-033]
    satisface: [STN-003, OBJ-002]
    estado: PROPOSED
    ac:
      - {id: AC-031, criterio: "100% de contenidos publicados muestran autoría y fecha de última revisión; el panel impide publicar sin fecha de revisión.", metodo: Test}
    health: *hc_expansion

  - id: REQ-024
    nivel: Software
    tipo: FR
    titulo: "Advertencias de seguridad y descargo"
