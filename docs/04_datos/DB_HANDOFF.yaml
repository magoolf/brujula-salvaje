    - {id: DEC-AUTO-097, decision: "CHECK char_length <= 100000 en los text de texto enriquecido", alternativas: ["Sin límite"], motivo: "Defensa ante abuso de almacenamiento (THREAT-009) [SUPUESTO sobre el tamaño]", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: DEC-AUTO-098, decision: "UNIQUE(tipo, titulo_norm) para todos los tipos", alternativas: ["Solo Destino, Tipo y Término"], motivo: "[INFERIDO] de §18.3 'Único: Por tipo'; SEO y claridad editorial", riesgo: "Rechazo de títulos homónimos legítimos (p. ej., dos guías con el mismo título)", reversibilidad: "Alta (DROP CONSTRAINT)"}
    - {id: DEC-AUTO-124, decision: "Idempotencia en la MISMA transacción que el efecto: INSERT ... ON CONFLICT DO NOTHING al inicio, UPDATE de la respuesta antes del commit y constraint trigger diferido que exige la respuesta completa; solo se guardan respuestas 2xx confirmadas", alternativas: ["Fila EN_CURSO en una transacción separada + limpieza de filas abandonadas", "Insertar al final y deshacer el duplicado"], motivo: "Atomicidad efecto-registro; el índice único serializa los duplicados concurrentes; un error no deja filas colgadas", riesgo: "Espera bajo lock_timeout (RSK-DB-012)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-125, decision: "Las respuestas con secretos no se persisten: en panelCrearCuenta, cuerpo_respuesta NULL + cuerpo_omitido=true + recurso_id (lo impone un CHECK)", alternativas: ["Guardar la contraseña temporal cifrada 24 h", "Excluir la operación de la idempotencia"], motivo: "AC-106 ('se muestra una sola vez y nunca se registra'); THREAT-027", riesgo: "La repetición no reproduce la contraseña (RSK-DB-011, CHG a Backend)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-126, decision: "La clave es única por cuenta en todas las operaciones (UNIQUE(cuenta_id, clave) según DEC-AUTO-123); se guardan operacion y huella, y cualquier diferencia → 422 idempotencia_conflicto", alternativas: ["UNIQUE(cuenta_id, operacion, clave) como sugería ADR-API-002 §5"], motivo: "Aplica la decisión del Orquestador; más estricto y sin ambigüedad (un UUID por intento)", riesgo: "Un cliente que reutilice el mismo UUID en dos operaciones recibe 422 (comportamiento correcto)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-127, decision: "Purga física en el comando diario existente purgar_ops (tarea PURGA_OPS); las filas vencidas se ignoran y se reemplazan en línea; también se borran al anonimizar la cuenta", alternativas: ["Purga horaria (sugerencia de ADR-API-002)", "Nuevo comando"], motivo: "Instrucción del Orquestador; el reemplazo en línea hace irrelevante la frecuencia para la semántica de 24 h", riesgo: "Permanencia física de hasta ~48 h (volumen irrelevante)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-128, decision: "cuerpo_respuesta jsonb limitado a 64 KB, clasificado PII y sin acceso para readonly; tabla persistente incluida en las copias", alternativas: ["Guardar solo el código y el recurso_id y regenerar la respuesta", "Tabla UNLOGGED"], motivo: "Reproducir la respuesta original como exige el contrato; la ventana de 24 h no debe perderse si el servidor se cae (una tabla UNLOGGED se vacía tras una caída)", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: DEC-AUTO-200, origen: "EXPANSIÓN_AUTÓNOMA (concreta DEC-AUTO-190 del Orquestador; CHG-DB-002, OBS-QA003-01)", decision: "cuenta_staff: REVOKE DELETE, TRUNCATE a app_rw + trigger de fila trg_cuenta_sin_borrado BEFORE DELETE que rechaza siempre (también al propietario y al Collector de Django), en la migración nueva cuentas.0002_sin_borrado; sin trigger de TRUNCATE", alternativas: ["Extender trg_cuenta_admin_minimo a AFTER DELETE (solo protegería al último administrador, no la regla 'nunca se borra')", "Solo REVOKE (no protege frente a app_migrator)", "Añadir también BEFORE TRUNCATE (obligaría a tocar apps/ops/bd_pruebas, fuera de TKT-004)"], motivo: "Defensa en profundidad de la regla 'nunca se borra físicamente; se anonimiza' (BLUEPRINT §39.2) y, por consecuencia, de RULE-015/AC-108 (>=1 administrador operativo). El TRUNCATE ya está cerrado: app_rw no tiene el privilegio y TRUNCATE de cuenta_staff arrastra a evento_auditoria, cuyo trigger de TRUNCATE lo rechaza siempre", riesgo: "Bajo: ningún flujo legítimo borra cuentas (el contrato no tiene DELETE de cuentas; la anonimización es UPDATE). Las pruebas que borren cuentas por ORM fallarán y deben reescribirse", reversibilidad: "Alta (reverse_sql: DROP TRIGGER/FUNCTION + GRANT DELETE)"}
    - {id: DEC-AUTO-201, origen: "EXPANSIÓN_AUTÓNOMA (concreta DEC-AUTO-190; OBS-QA003-05)", decision: "SET search_path = pg_catalog, app, pg_temp en fn_auditoria_purgar y fn_auditoria_seudonimizar mediante ALTER FUNCTION en la migración nueva auditoria.0003_endurecimiento (sin CREATE OR REPLACE), y el mismo search_path en todas las funciones de trigger nuevas de CHG-DB-002; prueba genérica de introspección para toda función SECURITY DEFINER del esquema app", alternativas: ["Editar auditoria.0002 (prohibido: ya aplicada en TKT-003)", "CREATE OR REPLACE de las funciones (repite el cuerpo y arriesga divergencias)", "Omitir pg_temp (si no se lista, pg_temp se busca PRIMERO para relaciones)"], motivo: "Práctica recomendada de la documentación de PostgreSQL para SECURITY DEFINER ('Writing SECURITY DEFINER Functions Safely'): pg_temp al final evita que objetos temporales del llamante suplanten a los de confianza. ALTER FUNCTION conserva propietario, SECURITY DEFINER y GRANT", riesgo: "Muy bajo (los cuerpos ya cualifican app.*)", reversibilidad: "Alta (ALTER FUNCTION ... SET search_path = pg_catalog, app)"}
    - {id: DEC-AUTO-202, origen: EXPANSIÓN_AUTÓNOMA, decision: "revision_contenido: trigger de fila trg_revision_inmutable BEFORE UPDATE OR DELETE que rechaza siempre, en auditoria.0003_endurecimiento; sin trigger de TRUNCATE", alternativas: ["Solo privilegios (estado v1.1)", "Añadir BEFORE TRUNCATE (exigiría ampliar apps/ops/bd_pruebas para el vaciado de pruebas)"], motivo: "Misma carencia que cuenta_staff frente al propietario: la regla es 'inmutable, retención indefinida' (DATA-026) y evento_auditoria ya tiene trigger. Ningún flujo actualiza ni borra revisiones (la anonimización no las toca: la instantánea solo guarda ids)", riesgo: "Bajo. El propietario conserva TRUNCATE/DROP (amenaza de nivel DDL, fuera del alcance de un trigger)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-203, origen: EXPANSIÓN_AUTÓNOMA, decision: "medio: REVOKE DELETE, TRUNCATE a app_rw + trigger trg_medio_sin_borrado (siempre rechaza) en medios.0002_sin_borrado. Subtipos 1:1 de contenido: trigger trg_subtipo_guarda_borrado (rechaza si el contenido padre existe y se publicó alguna vez o es PAGINA) en contenido.0003_guardas_subtipos; app_rw conserva DELETE en los subtipos para el borrado de borradores", alternativas: ["Dejar la regla solo en el servicio", "Revocar DELETE en los subtipos (rompería el borrado de borradores por ORM, FEAT-038)"], motivo: "BLUEPRINT §39.2: borrado físico solo de borradores nunca publicados y de medios RECHAZADOS (nunca persistidos); 'todo lo demás se retira o se anonimiza'. El contrato no expone DELETE de medios. trg_contenido_guardas protegía el supertipo pero no impedía borrar directamente la fila de subtipo", riesgo: "[SUPUESTO] La subida de medios es síncrona y deshace con ROLLBACK, nunca con DELETE; si el diseño del ticket de medios necesitara borrar filas, se reabre esta decisión (Botón de Pánico)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-204, origen: EXPANSIÓN_AUTÓNOMA, decision: "Catálogos (region, pais, categoria_guia, licencia, nivel_escala) y singletons (config_inicio, config_sitio): solo REVOKE DELETE, TRUNCATE a app_rw (catalogos.0003_sin_borrado, inicio.0002_sin_borrado), sin trigger", alternativas: ["Trigger de prohibición como en cuentas (rompería el reverse_code de las migraciones de semilla catalogos.0002 e inicio.0001, que borran con app_migrator, y por tanto migrate zero)", "No hacer nada (app_rw podría borrar filas no referenciadas)"], motivo: "Se retiran con activo=false o se editan; el contrato solo expone GET/POST/PUT. Cierra la superficie de la aplicación sin perder la reversibilidad de las migraciones de datos", riesgo: "Bajo: el propietario puede borrarlos (solo lo hace el reverso de la semilla)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-260, origen: "EXPANSIÓN_AUTÓNOMA (concreta DEC-AUTO-913 del Orquestador; CHG-DB-003, QA-TKT005-03)", decision: "Libro v2: nuevo evento REACTIVADA con el mismo formato de línea (compatible con la v1); el último evento de una cuenta es su última línea válida en el ORDEN DEL FICHERO (la fecha solo sirve para los plazos); desactivación vigente = última DESACTIVADA posterior a la última REACTIVADA; tabla de reglas de ADR-DB-004 §4.3 (el sistema nunca reactiva y nunca toca una cuenta con último evento REACTIVADA); desactivado_en se alinea con la fecha vigente; reaplicar_anonimizaciones nunca escribe en el libro; comparte el advisory lock con anonimizar_cuentas", alternativas: ["Ordenar por fecha_utc (frágil ante ajustes del reloj)", "Reactivar automáticamente en la BD las cuentas con último evento REACTIVADA (concede un estado operativo sin intervención humana y sin credencial conocida)", "Aplicar solo los eventos posteriores a la fecha de la copia (exige metadatos fiables de la copia)"], motivo: "Cierra QA-TKT005-03 con la regla más simple que es correcta bajo el lock de fila: el orden del fichero es el orden real por cuenta (DEC-AUTO-261)", riesgo: "Una cuenta desactivada antes de la copia y reactivada después queda DESACTIVADA y sin anonimizar hasta que el Administrador actúe (RSK-DB-015, residual LOW)", reversibilidad: "Alta (lógica de comandos; sin esquema)"}
    - {id: DEC-AUTO-261, origen: EXPANSIÓN_AUTÓNOMA, decision: "Escritura del libro DENTRO de la transacción como último paso antes del commit, tras SET CONSTRAINTS app.trg_cuenta_admin_minimo IMMEDIATE; os.open con O_WRONLY|O_APPEND|O_CREAT|O_NOFOLLOW|O_CLOEXEC y modo 0640, flock LOCK_EX, reparación '\\n#REPARACION;<fecha>' si falta el '\\n' final, un solo write() y fsync (y fsync del directorio al crear el fichero); un OSError provoca rollback y un 503 genérico", alternativas: ["transaction.on_commit + solo log (implementación inicial de TKT-005: un REACTIVADA perdido en silencio acaba en una anonimización irreversible tras restaurar)", "Libro dentro de la BD (se restauraría con la copia, lo que anula su propósito)", "Outbox con reintentos (más complejo; seguiría necesitando un almacenamiento externo a la BD)"], motivo: "Un fallo del libro se vuelve visible y reversible (la operación no ocurre) en lugar de silencioso e irreversible; con el FOR UPDATE de la fila de cuenta, el orden del fichero por cuenta queda garantizado", riesgo: "Línea espuria si la transacción cae entre el fsync y el commit (RSK-DB-016, LOW); un disco lleno en ops_libro bloquea desactivar, reactivar y anonimizar", reversibilidad: "Alta"}
    - {id: DEC-AUTO-262, origen: "EXPANSIÓN_AUTÓNOMA (concreta DEC-AUTO-913: RULE-015 en las acciones del sistema)", decision: "Antes de desactivar o anonimizar desde la relectura una cuenta ADMINISTRADOR operativa, se comprueba bajo pg_advisory_xact_lock(hashtext('cuentas_admin')) que exista OTRA cuenta ADMINISTRADOR en estado ACTIVA (el mismo criterio estricto que el servicio). Si no existe, la cuenta no se toca (OMITIDA_ULTIMO_ADMIN) y el comando termina con exit 0, aviso y detalle; lo mismo con INCONSISTENTE y REACTIVADA_NO_REPRODUCIDA", alternativas: ["Confiar solo en trg_cuenta_admin_minimo (acepta 0 ACTIVAS si hay una PENDIENTE sin credencial conocida tras restaurar, y abortaría con una excepción)", "Detener el post-restore (exit != 0): el panel no podría abrirse para crear otro administrador (bloqueo circular)"], motivo: "RULE-015/AC-108: nunca dejar el sistema sin un administrador capaz de entrar; los avisos se muestran sin bloquear la recuperación", riesgo: "El último administrador conserva su PII hasta que un humano actúe (queda registrado en la evidencia)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-263, origen: EXPANSIÓN_AUTÓNOMA, decision: "Casos límite de lectura (ADR-DB-004 §4.4): en la relectura post-restore, libro ausente, ilegible o corrupto ⇒ exit != 0 sin ningún cambio (fail-closed), y se continúa solo con una decisión humana (--libro-vacio-confirmado o depositar la copia); en anonimizar_cuentas diaria, libro ausente ⇒ solo la BD + WARNING, e ilegible o corrupto ⇒ FALLO sin anonimizar; se toleran la última línea sin '\\n' y la línea mal formada seguida de #REPARACION; duplicados sin efecto; manda el orden del fichero y no el reloj; las fechas futuras se usan tal cual; los plazos se calculan con now() de PostgreSQL", alternativas: ["Saltar las líneas mal formadas y aplicar el resto (una línea ilegible podría ser el REACTIVADA protector: anonimización irreversible)", "Tratar el libro ausente como vacío también en el post-restore (reproduce QA-TKT005-03 cuando se pierde el volumen)"], motivo: "Ante la duda, no se hace nada irreversible; fuera de una restauración, la BD es la fuente de verdad", riesgo: "Una corrupción bloquea la anonimización diaria hasta repararla (visible por el SLI de ops_ejecucion_tarea al 100 %)", reversibilidad: "Alta"}
    - {id: DEC-AUTO-264, origen: EXPANSIÓN_AUTÓNOMA, decision: "Protección del fichero: 0640 (uid 10001, grupo app), directorio 0750; escritura solo desde backend y scheduler; backup en solo lectura; el lector rechaza enlaces simbólicos, lo que no sea un fichero regular y un fichero escribible por otros; SIN firma ni HMAC por línea; retención indefinida sin rotación", alternativas: ["HMAC por línea con clave derivada de SECRET_KEY (al rotarla se invalida el libro; no protege frente a quien ya controla el proceso, que tiene app_rw)", "Cadena de hashes sin clave (solo detecta errores accidentales, que la validación estricta ya cubre)", "Rotar el libro a 30 días (podría borrar un REACTIVADA vigente)"], motivo: "El atacante capaz de falsificar líneas controla ya la aplicación y la BD; lo proporcional es mínimo privilegio en el sistema de archivos más validación fail-closed", riesgo: "Una manipulación del volumen por un atacante con acceso al host no se detecta criptográficamente (fuera del modelo de amenazas local)", reversibilidad: "Alta (se puede añadir HMAC con un formato v3 compatible)"}
    - {id: DEC-AUTO-099, decision: "Esquemas app y ext; roles app_migrator, app_rw, readonly y app_backup con timeouts por rol", alternativas: ["Esquema public", "Un solo rol"], motivo: "Mínimo privilegio (§7.4) y THREAT-009", riesgo: "Configuración inicial más larga (DevOps)", reversibilidad: "Alta"}

  riesgos:
    - {id: RSK-DB-001, descripcion: "La instancia única es un SPOF", severidad: MEDIUM, mitigacion: "RTO de 4 h con restauración probada; HA revaluada en la Puerta Humana de producción", estado: ACEPTADO_ALCANCE_LOCAL}
    - {id: RSK-DB-002, descripcion: "Índice de búsqueda desincronizado si una ruta de escritura no usa el servicio de publicación", severidad: MEDIUM, mitigacion: "Un único servicio; prueba de invariante; comandos reindexar_busqueda y verificar_busqueda", estado: MITIGADO}
    - {id: RSK-DB-003, descripcion: "Las FK compuestas, triggers y funciones creados con RunSQL no están en el estado de Django (un cambio de modelo podría romperlos sin aviso)", severidad: MEDIUM, mitigacion: "Pruebas de introspección del esquema en CI; reverse_sql obligatorio", estado: MITIGADO}
    - {id: RSK-DB-004, descripcion: "Cambio de versión de ICU al actualizar la imagen (orden y collation es-x-icu)", severidad: LOW, mitigacion: "Imagen fijada por digest; runbook: ALTER COLLATION REFRESH VERSION + REINDEX", estado: MITIGADO}
    - {id: RSK-DB-005, descripcion: "unaccent convierte ñ en n (año ≈ ano) en la búsqueda y en la unicidad normalizada", severidad: LOW, mitigacion: "Ranking por título; aceptable según RULE-018", estado: ACEPTADO}
    - {id: RSK-DB-006, descripcion: "Pérdida del libro de anonimizaciones → una restauración podría reactivar datos de una cuenta anonimizada tras la copia", severidad: LOW, mitigacion: "Volumen ops_libro independiente del de datos, con copia propia; desde CHG-DB-003 la relectura post-restore FALLA (LIBRO_AUSENTE) en lugar de continuar en silencio, y continuar exige una decisión humana (DEC-AUTO-263); escritura fail-closed con fsync (DEC-AUTO-261). Severidad reducida de MEDIUM a LOW: la pérdida ya no puede producir un efecto silencioso", estado: MITIGADO}
    - {id: RSK-DB-015, descripcion: "(QA-TKT005-03) El libro no registraba las reactivaciones: tras restaurar, la relectura volvía a desactivar una cuenta reactivada (también en PENDIENTE_ACTIVACION) y anonimizar_cuentas podía anonimizarla de forma irreversible (>30 días desde la desactivación original); la desactivación del sistema no comprobaba RULE-015", severidad: MEDIUM, mitigacion: "CHG-DB-003: evento REACTIVADA, 'el último evento por cuenta gana', plazo desde la desactivación vigente y exclusión de REACTIVADA en anonimizar_cuentas (DEC-AUTO-260), guarda RULE-015 (DEC-AUTO-262). Residual LOW: una cuenta desactivada antes de la copia y reactivada después queda DESACTIVADA sin anonimizar hasta que el Administrador actúe (aviso REACTIVADA_NO_REPRODUCIDA). Pasa a MITIGADO cuando QA verifique las pruebas 'Libro v2' de pruebas_obligatorias", estado: ABIERTO}
    - {id: RSK-DB-016, descripcion: "Línea espuria en el libro si la transacción cae (proceso o conexión) entre el fsync de la línea y el commit; tras una restauración se aplicaría una transición que el actor pidió pero que no se confirmó", severidad: LOW, mitigacion: "La ventana es de milisegundos; la RULE-015 diferida se comprueba antes de escribir (SET CONSTRAINTS ... IMMEDIATE); el actor recibe un error y normalmente reintenta; una línea espuria reproduce la intención del actor (a diferencia de una línea perdida)", estado: ACEPTADO}
    - {id: RSK-DB-007, descripcion: "Contradicción potencial con Skill_Backend si impone Celery y broker", severidad: LOW, mitigacion: "CONFLICT-001 resuelto por el Orquestador: sin Celery ni broker (DEC-AUTO-122), coherente con ADR-DB-005", estado: CERRADO}
    - {id: RSK-DB-011, descripcion: "Reproducir panelCrearCuenta con la misma Idempotency-Key no puede devolver la contraseña temporal original, porque no se persiste (DEC-AUTO-125); el contrato dice 'devuelve la respuesta original' y el esquema CuentaConCredencialTemporal exige contrasena_temporal", severidad: LOW, mitigacion: "Se requiere un CHG a Backend-contrato para fijar la respuesta de repetición de esa operación (propuesta: 409 con code idempotencia_respuesta_no_reproducible + Location de la cuenta; el Admin usa 'Restablecer contraseña'). Mientras tanto la BD impide persistir el secreto", estado: ABIERTO}
    - {id: RSK-DB-012, descripcion: "Un duplicado concurrente espera en el índice único hasta el commit de la primera transacción; una subida de medios larga puede agotar lock_timeout=3s", severidad: LOW, mitigacion: "La segunda petición recibe 409 reintentable, sin efecto duplicado; se verifica en las pruebas de concurrencia", estado: MITIGADO}
    - {id: RSK-DB-008, descripcion: "Throttling en la BD (cache_limites) añade escrituras a peticiones públicas y podría afectar al p95", severidad: LOW, mitigacion: "Verificación en AC-051; alternativa: limitar la tasa en el proxy (DevOps)", estado: ABIERTO}
    - {id: RSK-DB-009, descripcion: "El rendimiento se ha estimado sin benchmark ([INFERIDO] por volumen)", severidad: LOW, mitigacion: "La evidencia real la aporta QA con EXPLAIN y prueba de carga (AC-051/053)", estado: ABIERTO}
    - {id: RSK-DB-010, descripcion: "Las copias contienen PII del staff (usuario, nombre, auditoría)", severidad: MEDIUM, mitigacion: "Cifrado en reposo, rotación <=30 días, re-aplicación de anonimizaciones", estado: MITIGADO}
    - {id: RSK-DB-013, descripcion: "(OBS-QA003-01) Un DELETE SQL del único ADMINISTRADOR sin referencias con app_rw confirmaba y dejaba 0 administradores; en general, app_rw podía borrar cuentas, medios, catálogos y singletons que la regla de negocio prohíbe borrar, y el propietario podía borrar revisiones y filas de subtipo de contenido publicado", severidad: LOW, mitigacion: "CHG-DB-002: REVOKE DELETE + triggers de prohibición (DEC-AUTO-200, 202, 203, 204). Pasa a MITIGADO cuando QA verifique n 14..19 con sus pruebas; mientras tanto la regla la cumple el servicio (no existe endpoint DELETE)", estado: ABIERTO}
    - {id: RSK-DB-014, descripcion: "El propietario app_migrator puede sortear cualquier trigger con DDL (DISABLE/DROP TRIGGER, DROP TABLE, TRUNCATE de revision_contenido o medio con CASCADE), igual que en evento_auditoria (ADR-DB-004)", severidad: LOW, mitigacion: "app_migrator solo lo usa el job de migración; migraciones revisadas por QA; prohibido DISABLE TRIGGER en migraciones de avance y en código; toda migración que borre estas filas = Puerta Humana; copias diarias", estado: ACEPTADO}

