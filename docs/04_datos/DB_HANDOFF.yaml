    - {id: DEC-AUTO-082, decision: "Polimorfismo con FK compuesta (contenido_id, tipo_contenido) → contenido(id, tipo) vía RunSQL", alternativas: ["contenttypes GenericForeignKey", "Triggers de validación"], motivo: "Integridad en la BD (§2) sin triggers", riesgo: "Django no las conoce; se mitiga con pruebas de introspección", reversibilidad: "Alta"}
