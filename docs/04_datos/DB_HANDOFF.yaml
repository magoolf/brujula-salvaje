  roles:
    - nombre: app_migrator
      login: true
      atributos: "NOSUPERUSER NOCREATEDB NOCREATEROLE; propietario del esquema app y de sus objetos; CREATE en la base de datos brujula (extensiones trusted)"
      uso: "Solo el job 'manage.py migrate' (F6/F7). lock_timeout=5s"
    - nombre: app_rw
      login: true
      atributos: "NOSUPERUSER; sin DDL; USAGE en app y ext"
      privilegios: "SELECT, INSERT, UPDATE, DELETE en las tablas de negocio (ALTER DEFAULT PRIVILEGES FOR ROLE app_migrator IN SCHEMA app). REVOKE UPDATE, DELETE, TRUNCATE en evento_auditoria y revision_contenido. [CHG-DB-002] REVOKE DELETE, TRUNCATE en cuenta_staff (DEC-AUTO-200) y en medio (DEC-AUTO-203): app_rw queda con SELECT, INSERT, UPDATE. [CHG-DB-002] REVOKE DELETE, TRUNCATE en region, pais, categoria_guia, licencia, nivel_escala, config_inicio y config_sitio (DEC-AUTO-204): SELECT, INSERT, UPDATE. app_rw CONSERVA DELETE en: contenido y subtipos (borradores nunca publicados, FEAT-038; los triggers de guardas impiden el resto), relaciones y tablas hijas editables (destino_tipo_aventura, itinerario_tipo_aventura, dia_itinerario, checklist_item, guia_destino, guia_tipo_aventura, elemento_coleccion, contenido_termino, contenido_medio, fuente, relacion_contenido, destacado_inicio), medio_derivado, busqueda_documento, cuenta_codigo_recuperacion, sesion_panel, idempotencia_peticion, ops_ejecucion_tarea y cache_limites. django_migrations: solo SELECT. EXECUTE en app.fn_auditoria_purgar y app.fn_auditoria_seudonimizar. SELECT en v_medio_uso. idempotencia_peticion: SELECT, INSERT, UPDATE, DELETE (DELETE solo para las filas vencidas y la purga; sin TRUNCATE)"
      uso: "Procesos web y scheduler. statement_timeout=5s, idle_in_transaction_session_timeout=30s, lock_timeout=3s"
    - nombre: readonly
      login: true
      privilegios: "SELECT en las tablas de negocio salvo sesion_panel, cuenta_codigo_recuperacion, cache_limites e idempotencia_peticion (se revoca explícitamente tras el ALTER DEFAULT PRIVILEGES; cuerpo_respuesta es PII). cuenta_staff: SELECT (id, rol, estado, mfa_activo, creado_en, desactivado_en, anonimizado_en). evento_auditoria: SELECT de todas las columnas salvo actor_etiqueta e ip_truncada"
      uso: "Diagnóstico e informes. statement_timeout=30s"
    - nombre: app_backup
      login: true
      privilegios: "GRANT pg_read_all_data"
      uso: "Solo pg_dump (ADR-DB-004)"
    - nombre: PUBLIC
      privilegios: "REVOKE ALL ON DATABASE brujula FROM PUBLIC; REVOKE ALL ON SCHEMA public FROM PUBLIC"
  roles_notas: "Los roles, la BD y los esquemas los crea el script de infraestructura de DevOps (infra/db/init/*.sql), no Django. Las contraseñas reales son una Puerta Humana (CLAUDE.md §0.5); en local se usan valores no reales de .env. password_encryption=scram-sha-256. Las pruebas de Django en CI usan un contenedor efímero con un rol con CREATEDB, nunca estos roles. [CHG-DB-002] Los triggers de prohibición de borrado (trg_cuenta_sin_borrado, trg_revision_inmutable, trg_medio_sin_borrado, trg_subtipo_guarda_borrado) se aplican también a app_migrator: el propietario solo puede sortearlos con DDL (DROP/DISABLE TRIGGER), cosa que únicamente hace el reverse_sql de su propia migración. Cualquier migración futura que necesite borrar filas de esas tablas es destructiva sobre datos reales y requiere Puerta Humana (CLAUDE.md §0.5); no se admite 'ALTER TABLE ... DISABLE TRIGGER' en migraciones de avance ni en código de aplicación"

  plan_migraciones_principios:
      - "Greenfield: todas las migraciones iniciales son EXPAND sobre una BD vacía y REVERSIBLES (reverse_sql en todo RunSQL; reverse_code en todo RunPython)."
      - "Revertirlas sobre datos reales implica borrado de datos: se considera destructivo y requiere Puerta Humana (CLAUDE.md §0.5, Skill_Base_datos §7.3)."
      - "A futuro: expand → backfill por lotes → contract en releases distintas; AddIndexConcurrently (migración atomic=False) en tablas en uso; prohibido ADD COLUMN NOT NULL sin default en tablas grandes; lock_timeout del migrador a 5s."
      - "El job de migración se ejecuta con app_migrator antes de arrancar la aplicación (DevOps F6)."
      - "[CHG-DB-002] Las migraciones ya aplicadas (cuentas.0001, auditoria.0002, etc.) NO se editan: los cambios de la v1.2 van en migraciones nuevas (n 14..19), todas EXPAND y reversibles, sin cambios de columnas ni datos (solo GRANT/REVOKE, triggers, funciones y ALTER FUNCTION). Toman locks breves (CREATE TRIGGER: SHARE ROW EXCLUSIVE; REVOKE/ALTER FUNCTION: catálogo) sobre tablas de <=10.000 filas: sin ventana de parada."
