        - "contenido_id bigint NOT NULL FK contenido ON DELETE CASCADE"
        - "tipo_contenido varchar(10) NOT NULL CHECK IN ('DESTINO','ITINERARIO')"
        - "orden smallint NOT NULL DEFAULT 0"
        - "nota_editorial varchar(300) NULL"
