        - "contenido_id bigint PK FK contenido ON DELETE CASCADE"
        - "tipo_contenido varchar(10) NOT NULL DEFAULT 'GUIA' CHECK (= 'GUIA')"
        - "categoria_id bigint NULL FK categoria_guia ON DELETE RESTRICT"
        - "resumen varchar(300) NULL"
        - "cuerpo text NULL CHECK longitud"
        - "remite_a_metodologia boolean NOT NULL DEFAULT false"
        - "palabras integer NOT NULL DEFAULT 0 CHECK (>= 0) (derivado al guardar; EXP-004)"
      constraints: ["FK compuesta (contenido_id, tipo_contenido) → contenido(id, tipo)"]
