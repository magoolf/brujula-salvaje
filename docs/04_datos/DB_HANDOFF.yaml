    - {id: DEC-AUTO-094, decision: "Libro de anonimizaciones (solo ids) fuera del ciclo de copias de la BD, re-aplicado tras restaurar", alternativas: ["Solo la regla de 30 días tras restaurar"], motivo: "Cubre 'Anonimizar ahora' y desactivaciones posteriores a la copia (DEC-AUTO-052)", riesgo: "Artefacto adicional que proteger", reversibilidad: "Alta"}
