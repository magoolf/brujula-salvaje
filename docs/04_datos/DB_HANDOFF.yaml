  pruebas_obligatorias:
      - "Schema tests: una prueba por cada CHECK, UNIQUE, FK compuesta y trigger (el caso válido pasa, el inválido falla con IntegrityError o el error del trigger); introspección en pg_constraint de las FK compuestas"
      - "Migration tests: migrate desde cero; migrate app zero en orden inverso sobre la BD vacía; makemigrations --check sin cambios"
      - "Privilegios: con app_rw, UPDATE/DELETE en evento_auditoria fallan; CREATE TABLE falla; con readonly, SELECT de cuenta_staff.usuario falla"
      - "Concurrencia: dos guardados con la misma version → uno 409 (AC-110); dos publicaciones simultáneas → numero_revision sin huecos ni duplicados"
      - "Búsqueda: 'Patagonia' = 'patagonia' = 'PATAGONÍA'; prefijo de 2 caracteres; invariante publicados = índice; EXPLAIN de AP-10 con uso del GIN o lectura secuencial justificada"
      - "Carga (AC-051/053): EXPLAIN (ANALYZE, BUFFERS) de AP-01, 02, 03 y 10 adjuntos como evidencia"
      - "Restauración (AC-054): simulacro según ADR-DB-004 §4 con tiempos"
      - "Idempotencia (CHG-DB-001): misma clave y huella → misma respuesta, 1 solo efecto y 1 sola revisión o evento de auditoría; misma clave con otra huella u otra operación → 422 idempotencia_conflicto; dos peticiones concurrentes con la misma clave → 1 efecto (la segunda espera y reproduce, o 409 si vence lock_timeout); commit con codigo_http NULL → falla por el trigger diferido; INSERT de panelCrearCuenta con cuerpo_respuesta → falla por el CHECK; fila vencida → la clave se reutiliza como nueva; purgar_ops borra las filas con expira_en <= now(); anonimizar_cuentas borra las filas de la cuenta; readonly no puede leer la tabla"
      - "Sin borrado de cuentas (CHG-DB-002, OBS-QA003-01): (a) con app_rw (psql o conexión con ese rol), DELETE FROM app.cuenta_staff WHERE id = <único ADMINISTRADOR sin referencias> → ERROR 42501 permission denied y sigue habiendo 1 administrador operativo; (b) con el rol propietario/de pruebas, el mismo DELETE → error del trigger (SQLSTATE 23001, constraint trg_cuenta_sin_borrado) y la cuenta sigue existiendo; (c) CuentaStaff.delete() por ORM sobre una cuenta con sesiones y códigos de recuperación → IntegrityError y, tras el rollback, las sesiones y los códigos siguen existiendo; (d) TRUNCATE app.cuenta_staff CASCADE con el propietario y los triggers activos → falla (trg_auditoria_inmutable_truncate de evento_auditoria); (e) has_table_privilege('app_rw', 'app.cuenta_staff', 'DELETE') = false y 'UPDATE' = true"
      - "Anonimización sin regresión (CHG-DB-002): anonimizar_cuentas y 'Anonimizar ahora' siguen funcionando (UPDATE a ANONIMIZADA, DELETE de cuenta_codigo_recuperacion, sesion_panel e idempotencia_peticion de la cuenta, fn_auditoria_seudonimizar y evento CUENTA_ANONIMIZAR); la fila de cuenta_staff persiste con el mismo id; reaplicar_anonimizaciones no ejecuta DELETE sobre cuenta_staff"
      - "search_path de SECURITY DEFINER (CHG-DB-002, OBS-QA003-05): introspección en pg_proc: para toda función del esquema app con prosecdef = true, proconfig contiene exactamente 'search_path=pg_catalog, app, pg_temp' (prueba genérica, que falla si aparece otra SECURITY DEFINER sin pg_temp al final); prosecdef sigue siendo true, el propietario sigue siendo app_migrator y EXECUTE sigue concedido solo a app_rw (has_function_privilege). fn_auditoria_purgar y fn_auditoria_seudonimizar siguen pasando sus pruebas funcionales"
      - "Revisiones inmutables (CHG-DB-002): con el rol propietario/de pruebas, UPDATE y DELETE de revision_contenido → error del trigger trg_revision_inmutable (23514 / 23001); con app_rw → 42501"
      - "Medios sin borrado (CHG-DB-002; en el ticket de medios): DELETE de un medio PENDIENTE_METADATOS sin usos con el propietario → error trg_medio_sin_borrado; con app_rw → 42501; DELETE de medio_derivado con app_rw sigue permitido"
      - "Guardas de subtipo (CHG-DB-002; en el ticket de contenido): DELETE directo de la fila de destino (y de cada uno de los 7 subtipos) de un contenido publicado alguna vez → error trg_subtipo_guarda_borrado; DELETE directo de pagina_institucional (incluso en BORRADOR) → error; el borrado de un borrador nunca publicado por el servicio (ORM, con subtipo, N:M, días, galería y fuentes) sigue funcionando de principio a fin; DELETE FROM app.contenido de un borrador por SQL (cascada ON DELETE CASCADE) también funciona"
      - "Catálogos y configuración (CHG-DB-002; en el ticket de catálogos/inicio): has_table_privilege('app_rw', t, 'DELETE') = false para region, pais, categoria_guia, licencia, nivel_escala, config_inicio y config_sitio; = true para destacado_inicio; cargar_semilla sigue siendo idempotente"
      - "Migraciones (CHG-DB-002): migrate cuentas 0001 y migrate auditoria 0002 (reversión de n 14 y 15) → triggers y funciones eliminados, DELETE de app_rw en cuenta_staff restaurado y search_path de las SECURITY DEFINER = 'pg_catalog, app'; migrate de nuevo → estado v1.2; migrate zero completo sobre BD vacía y makemigrations --check sin cambios; las pruebas transaccionales (sql_flush) siguen pasando sin modificar apps/ops/bd_pruebas; la prueba de introspección de triggers de TKT-003 (test_ac_tkt003_esquema) se amplía con los triggers nuevos en el ticket que posea cada app"
      - "Libro v2, escenario de QA-TKT005-03 (CHG-DB-003, obligatorio): desactivar → reactivar → copia → restaurar → reaplicar_anonimizaciones → reloj de PostgreSQL +31 días (o desactivado_en/fechas del libro retrasadas 31 días) → anonimizar_cuentas ⇒ la cuenta sigue en el estado que tenía en la copia (ACTIVA o PENDIENTE_ACTIVACION), con usuario y nombre_visible intactos, desactivado_en NULL, sin evento CUENTA_ANONIMIZAR y sin línea nueva en el libro. Variante: la cuenta está en PENDIENTE_ACTIVACION en la copia ⇒ mismo resultado"
      - "Libro v2, escritura (CHG-DB-003): desactivar, reactivar, 'Anonimizar ahora' y anonimizar_cuentas añaden exactamente una línea DESACTIVADA, REACTIVADA o ANONIMIZADA que cumple la regex de ADR-DB-004 §4.1 (en DESACTIVADA, fecha = desactivado_en truncado a segundos); con el directorio del libro sin permiso de escritura, desactivar, reactivar y anonimizar fallan (503 genérico) y, tras el rollback, el estado, la auditoría y las sesiones no cambian; si la desactivación del último ADMINISTRADOR falla, no se escribe ninguna línea (SET CONSTRAINTS trg_cuenta_admin_minimo IMMEDIATE antes de escribir); el fichero se crea con modo 0640 y un enlace simbólico en la ruta se rechaza (O_NOFOLLOW); dos procesos que escriben 200 líneas cada uno en paralelo dejan 400 líneas válidas; un fichero terminado sin '\\n' recibe '\\n#REPARACION;<fecha>' antes de la línea nueva; reaplicar_anonimizaciones no modifica el tamaño del libro"
      - "Libro v2, relectura (CHG-DB-003): (a) copia → desactivar → restaurar ⇒ DESACTIVADA con desactivado_en = fecha del libro; anonimizar_cuentas a +29 días no la anonimiza y a +31 días sí (el plazo cuenta desde la fecha del libro, no desde la restauración); (b) desactivar(t0) → copia → reactivar → desactivar(t1) → restaurar ⇒ desactivado_en = t1; a t0+31 días (< t1+30) no se anonimiza; (c) desactivar → copia → reactivar → restaurar ⇒ sigue DESACTIVADA, aviso REACTIVADA_NO_REPRODUCIDA, y anonimizar_cuentas a +31 días la omite (OMITIDA_REACTIVADA en detalle); (d) copia → desactivar → 'Anonimizar ahora' → restaurar ⇒ ANONIMIZADA, eventos seudonimizados; (e) copia con A como único ADMINISTRADOR ACTIVA → crear B → desactivar A → restaurar ⇒ A sigue ACTIVA, aviso OMITIDA_ULTIMO_ADMIN, exit 0 y 1 administrador operativo; tras crear otro administrador ACTIVO, una segunda ejecución desactiva A; (f) la misma situación con una línea ANONIMIZADA de A ⇒ A no se toca; (g) id del libro que no existe en la BD ⇒ se ignora; (h) segunda ejecución ⇒ 0 cambios; (i) cuenta DESACTIVADA en la BD con desactivado_en posterior a la fecha de su última línea ⇒ INCONSISTENTE, sin cambios"
      - "Libro v2, casos límite (CHG-DB-003): libro ausente ⇒ reaplicar_anonimizaciones exit != 0 (LIBRO_AUSENTE), FALLO en ops_ejecucion_tarea, 0 cambios, y post-restore-local.sh se detiene antes de anonimizar_cuentas; con --libro-vacio-confirmado ⇒ continúa; anonimizar_cuentas diaria sin libro ⇒ solo la BD + WARNING. Línea mal formada en medio del fichero ⇒ LIBRO_CORRUPTO, 0 cambios (en ambos comandos) y números de línea en detalle; última línea sin '\\n' o línea mal formada seguida de '#REPARACION' ⇒ se ignora con WARNING y se aplica el resto; líneas duplicadas ⇒ mismo resultado que sin duplicar; fechas no monótonas ⇒ manda el orden del fichero; fecha futura ⇒ la anonimización no ocurre antes de esa fecha + 30 días; fichero escribible por otros (0666) o enlace simbólico ⇒ LIBRO_ILEGIBLE"

  retencion:
    contenido_publicado_retirado: "Indefinida; retiro sin borrado físico + instantánea (el trigger impide borrar lo que se publicó alguna vez)"
    borrador_nunca_publicado: "Hasta que se elimina (DELETE en cascada a subtipo y relaciones propias)"
    revision_contenido: "Indefinida (inmutable)"
    medios: "Indefinida; los RETIRADOS se conservan. Sin borrado físico de filas persistidas: privilegio + trg_medio_sin_borrado (CHG-DB-002)"
    cuentas_staff: "Anonimización <=30 días tras la desactivación VIGENTE (diaria; desactivado_en alineado con el libro tras restaurar; se excluyen las cuentas cuyo último evento del libro es REACTIVADA, CHG-DB-003) o inmediata; la fila se conserva seudonimizada. Sin borrado físico: privilegio + trg_cuenta_sin_borrado (CHG-DB-002)"
    catalogos_y_configuracion: "Indefinida; se desactivan (activo=false) o se editan, no se borran: app_rw sin DELETE (CHG-DB-002, DEC-AUTO-204)"
    evento_auditoria: "365 días; purga diaria con app.fn_auditoria_purgar()"
    idempotencia_peticion: "24 h lógicas (expira_en; una fila vencida se ignora y se reemplaza al reutilizar la clave); borrado físico en la purga diaria del comando purgar_ops (existencia física máxima ~48 h). Se borra también al anonimizar la cuenta (DEC-AUTO-127)"
    sesion_panel: "Hasta expire_date (<=12 h absolutas); purga horaria"
    cuenta_codigo_recuperacion: "Hasta regenerar o anonimizar"
    ops_ejecucion_tarea: "<=30 días"
    cache_limites: "TTL <=1 h; UNLOGGED, no se respalda"
    busqueda_documento: "Derivado; vive mientras el contenido está PUBLICADO"
    registros_tecnicos: "Fuera de la BD; <=30 días (DevOps, FEAT-048). Logs del motor sin parámetros ni IP de conexión"
    copias_seguridad: "30 diarias rotativas (<=30 días, DEC-AUTO-052), cifradas"
    libro_anonimizaciones: "Fuera del ciclo de copias de la BD (volumen ops_libro), solo ids (sin PII); eventos DESACTIVADA, REACTIVADA y ANONIMIZADA (v2, CHG-DB-003). Retención INDEFINIDA, sin rotación ni compactación (unos pocos KB con <=10 cuentas): truncarlo podría borrar un REACTIVADA que protege una cuenta (DEC-AUTO-264). Copia diaria del volumen de operación con sha256; la relectura usa siempre el libro vivo (ADR-DB-004 §4.1-§4.5)"

  rpo_rto: {rpo: "<=24 h (pg_dump diario + copia diaria de medios)", rto: "<=4 h (restauración de <1 GB + ~5 GB de medios + re-aplicación de anonimizaciones + reindexación; ADR-DB-004 §4)"}

  backup: |
    Estrategia (ADR-DB-004 §3): pg_dump --format=custom --no-unlogged-table-data diario con app_backup + sha256 del dump;
    después, copia del volumen de medios + manifiesto sha256 generado desde medio.sha256_saneado y medio_derivado.sha256.
    Retención: 30 copias diarias rotativas, cifradas en reposo, en un volumen distinto del de datos (la clave real es una Puerta Humana).
    Sin WAL ni PITR (RPO de 24 h). Prueba de restauración: el simulacro de AC-054 en F8 y después mensual. Pasos: BD limpia 18.6 → pg_restore
    → restauración y verificación sha256sum -c de los medios → panel cerrado → migrate → reaplicar_anonimizaciones (libro VIVO; exit != 0
    si el libro falta, es ilegible o está corrupto, y entonces se detiene) → anonimizar_cuentas (30 días desde la desactivación vigente;
    excluye las cuentas con último evento REACTIVADA) → purgar_auditoria → purgar_sesiones → reindexar_busqueda → conteos por tipo y estado
    + verificar_busqueda + /health/ready. Los avisos de la relectura (OMITIDA_ULTIMO_ADMIN, INCONSISTENTE, REACTIVADA_NO_REPRODUCIDA) forman parte de la evidencia (ADR-DB-004 §4.4).
    La evidencia es el registro con los tiempos de cada paso. Un backup que no se ha restaurado no se da por válido.

  operacion:
    ownership: {business_owner: "Usuario (vía Orquestador, Autoridad Delegada)", data_steward: "Rol ADMINISTRADOR del panel", technical_owner: "Skill_Developer (esquema) / Skill_devops (instancia, copias)", dba_on_call: "N/A en el alcance local; en producción, a definir en la Puerta Humana de despliegue"}
    escalamiento: "Fallo de una tarea programada (resultado FALLO en ops_ejecucion_tarea) → alerta en los logs → DevOps → Developer; corrupción de datos o fallo de restauración → Orquestador → usuario (Puerta Humana si hay que restaurar sobre datos reales)"
    sli_slo:
      - "Disponibilidad de /health/ready (SELECT 1) >=99,5 % mensual en producción futura (REQ-050)"
      - "Latencia de BD por consulta p95 <=50 ms (log_min_duration_statement=250ms como alerta)"
      - "Éxito diario de purgar_auditoria y anonimizar_cuentas = 100 % (ops_ejecucion_tarea)"
      - "Frescura de la copia: la última copia válida tiene <=26 h"
    observabilidad: "pg_stat_statements [SUPUESTO: se activa si DevOps lo incluye en shared_preload_libraries; sin coste externo]; autovacuum por defecto; alertas por tamaño de cache_limites y de revision_contenido"
    capacidad_coste: "[INFERIDO] <1 GB de BD y ~5 GB de medios a 3 años; 1 vCPU / 1-2 GB de RAM bastan; coste 0 en local. En producción (Puerta Humana) el coste lo dominan el almacenamiento de medios y las copias (~6 GB × 30 copias con deduplicación del volumen de medios, a decidir por DevOps)"

