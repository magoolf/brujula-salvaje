        - "CHECK (origen_id <> relacionado_id)"
        - "FK compuesta (origen_id, origen_tipo) → contenido(id, tipo)"
        - "FK compuesta (relacionado_id, relacionado_tipo) → contenido(id, tipo)"
      indices: ["UNIQUE (origen_id, ...): curados de un origen (AP-03)", "relacionado_id (automático por FK): impacto del retiro"]
      notas: "El complemento automático (DEC-AUTO-042) se calcula en la consulta y no se persiste"
    - nombre: destacado_inicio
      data: DATA-022
      columnas:
        - "id bigint PK identity"
        - "seccion varchar(12) NOT NULL CHECK IN ('DESTINOS','ITINERARIOS','GUIAS')"
        - "contenido_id bigint NOT NULL FK contenido ON DELETE CASCADE"
        - "tipo_contenido varchar(10) NOT NULL"
        - "orden smallint NOT NULL DEFAULT 0"
      constraints:
        - "UNIQUE (seccion, contenido_id)"
        - "CHECK ((seccion='DESTINOS' AND tipo_contenido='DESTINO') OR (seccion='ITINERARIOS' AND tipo_contenido='ITINERARIO') OR (seccion='GUIAS' AND tipo_contenido='GUIA'))"
        - "FK compuesta (contenido_id, tipo_contenido) → contenido(id, tipo)"
      indices: []
      notas: "<=24 filas. Los límites 6-12/3-6/3-6 y el relleno (RULE-016) los aplica el servicio. Sin FK a config_inicio (singleton implícito)"

    # ---------------- Configuración ----------------
    - nombre: config_inicio
      data: DATA-021
      columnas:
        - "id smallint PK CHECK (id = 1)"
        - "hero_titular varchar(80) NOT NULL"
        - "hero_subtitulo varchar(160) NOT NULL"
        - "hero_medio_id bigint NOT NULL FK medio ON DELETE RESTRICT"
        - "actualizado_por_id bigint NULL FK cuenta_staff ON DELETE RESTRICT"
        - "actualizado_en timestamptz NOT NULL DEFAULT now()"
      constraints: []
      indices: []
      notas: "Singleton. La fila se crea con la carga semilla (necesita un medio), no en una migración. Si no existe, la aplicación usa textos por defecto sin hero"
    - nombre: config_sitio
      data: DATA-023
      columnas:
        - "id smallint PK CHECK (id = 1)"
        - "nombre_marca varchar(60) NOT NULL DEFAULT 'Brújula Salvaje'"
        - "lema varchar(120) NULL"
        - "texto_descargo text NOT NULL CHECK (char_length(texto_descargo) BETWEEN 1 AND 100000)"
        - "responsable_nombre varchar(150) NULL"
        - "responsable_identificacion varchar(40) NULL"
        - "responsable_domicilio varchar(200) NULL"
        - "responsable_canal_atencion varchar(200) NULL"
        - "actualizado_por_id bigint NULL FK cuenta_staff ON DELETE RESTRICT"
        - "actualizado_en timestamptz NOT NULL DEFAULT now()"
      constraints: []
      indices: []
      notas: "Singleton sembrado en una migración de datos, con un descargo provisional y el Responsable vacío (GAP-004 → marcador en la UI)"

    # ---------------- Auditoría y revisiones ----------------
    - nombre: evento_auditoria
      data: DATA-025
      columnas:
        - "id bigint PK identity"
        - "ocurrido_en timestamptz NOT NULL DEFAULT now()"
        - "actor_id bigint NULL FK cuenta_staff ON DELETE RESTRICT"
        - "actor_etiqueta varchar(60) NOT NULL ('desconocido' si el usuario no existe; 'sistema' en tareas y semilla)"
        - "accion varchar(30) NOT NULL CHECK IN (las 28 acciones de §18.4 DATA-025)"
        - "resultado varchar(5) NOT NULL CHECK IN ('EXITO','FALLO')"
        - "tipo_entidad varchar(20) NULL"
        - "entidad_id bigint NULL (sin FK: el borrador puede eliminarse y la auditoría debe sobrevivir)"
        - "entidad_titulo varchar(150) NULL"
        - "campos_cambiados varchar(60)[] NULL (solo nombres de campos)"
        - "ip_truncada cidr NULL"
      constraints:
        - "CHECK (ip_truncada IS NULL OR (family(ip_truncada)=4 AND masklen(ip_truncada)=24) OR (family(ip_truncada)=6 AND masklen(ip_truncada)=48)) (DEC-AUTO-092)"
        - "CHECK (ip_truncada IS NULL OR accion IN ('LOGIN_OK','LOGIN_FALLIDO','BLOQUEO','LOGOUT'))"
        - "TRIGGER trg_auditoria_inmutable (BEFORE UPDATE OR DELETE por fila; BEFORE TRUNCATE por sentencia), ver ADR-DB-004 §1"
        - "Privilegios: app_rw solo SELECT, INSERT"
        - "Funciones SECURITY DEFINER app.fn_auditoria_purgar() y app.fn_auditoria_seudonimizar(bigint): SET search_path = pg_catalog, app, pg_temp (pg_temp explícito y al final; CHG-DB-002, DEC-AUTO-201, cierra OBS-QA003-05). Se aplica con ALTER FUNCTION ... SET search_path en auditoria.0003, sin recrear las funciones ni tocar sus GRANT"
      indices:
        - "(ocurrido_en DESC) btree: consulta por rango paginada (AP-23) y purga >365 d (AP-24)"
        - "(actor_id, ocurrido_en DESC) btree: filtro por actor (AP-23) y seudonimización (fn_auditoria_seudonimizar). Sustituye al índice automático de la FK (db_index=False en actor)"
      notas: "<=20.000 filas vivas: sin particionado (sería un coste sin beneficio [INFERIDO]). Se inserta en la misma transacción que la acción auditada. Tipo cidr en Django: campo personalizado mínimo con db_type='cidr' (Django no trae CidrField)"
    - nombre: revision_contenido
      data: DATA-026
      columnas:
        - "id bigint PK identity"
        - "contenido_id bigint NOT NULL FK contenido ON DELETE RESTRICT"
        - "tipo_contenido varchar(10) NOT NULL"
        - "numero_revision integer NOT NULL CHECK (>= 1)"
        - "motivo varchar(14) NOT NULL CHECK IN ('PUBLICACION','ACTUALIZACION','RETIRO','RESTAURACION')"
        - "instantanea jsonb NOT NULL (todos los campos y relaciones del contenido; ids de medios/cuentas, nunca PII del staff)"
        - "creado_por_id bigint NULL FK cuenta_staff ON DELETE RESTRICT (NULL = semilla)"
        - "creado_en timestamptz NOT NULL DEFAULT now()"
      constraints:
        - "UNIQUE (contenido_id, numero_revision)"
        - "FK compuesta (contenido_id, tipo_contenido) → contenido(id, tipo)"
        - "Privilegios: app_rw solo SELECT, INSERT (inmutable)"
        - "TRIGGER trg_revision_inmutable BEFORE UPDATE OR DELETE ON app.revision_contenido FOR EACH ROW EXECUTE FUNCTION app.fn_revision_inmutable() [CHG-DB-002, DEC-AUTO-202]: RAISE EXCEPTION siempre (UPDATE → ERRCODE 'check_violation'; DELETE → 'restrict_violation'; CONSTRAINT 'trg_revision_inmutable'). SECURITY INVOKER; SET search_path = pg_catalog, app, pg_temp. Paridad con trg_auditoria_inmutable frente al propietario. Sin trigger de TRUNCATE (ver DEC-AUTO-202: compatibilidad con el vaciado de pruebas y el propietario ya puede hacer DROP)"
      indices: ["El UNIQUE (contenido_id, numero_revision) sirve para listar por número desc (AP-26) y calcular el siguiente número"]
      notas: "numero_revision = max + 1 calculado bajo el FOR UPDATE de la fila de contenido (el UNIQUE es la red de seguridad). Se inserta en la misma transacción que el cambio de estado (AP-21). ON DELETE RESTRICT: un contenido publicado alguna vez no puede borrarse. Opcional: ALTER TABLE ... ALTER COLUMN instantanea SET COMPRESSION lz4 (disponible en la imagen oficial) [INFERIDO; se verifica en F6]"

    # ---------------- Derivadas y operación ----------------
    - nombre: busqueda_documento
      data: "Derivada (AP-10, RULE-018); no es una entidad de negocio"
      columnas:
        - "id bigint PK identity"
        - "contenido_id bigint NOT NULL UNIQUE FK contenido ON DELETE CASCADE"
        - "tipo_contenido varchar(10) NOT NULL CHECK IN ('DESTINO','ITINERARIO','GUIA','TIPO')"
        - "slug varchar(120) NOT NULL"
        - "titulo varchar(150) NOT NULL"
        - "titulo_norm varchar(150) NOT NULL"
        - "resumen varchar(300) NULL"
        - "pais_nombre varchar(80) NULL"
        - "documento tsvector NOT NULL (Django SearchVectorField; config app.es_unaccent; pesos A título, B resumen, C país y tipos, D cuerpo)"
        - "actualizado_en timestamptz NOT NULL DEFAULT now()"
      constraints: ["FK compuesta (contenido_id, tipo_contenido) → contenido(id, tipo)"]
      indices:
        - "GIN (documento): documento @@ tsquery (AP-10)"
        - "GIN (titulo_norm gin_trgm_ops): respaldo difuso por similitud cuando el FTS no devuelve filas"
      notas: "Solo contiene PUBLICADOS: el servicio de publicación hace upsert o delete en la misma transacción. Comandos reindexar_busqueda (idempotente) y verificar_busqueda (recuento de publicados en alcance = filas). Consulta y ranking: ADR-DB-003 §3"
    - nombre: ops_ejecucion_tarea
      data: "Operación (tareas programadas, ADR-DB-005)"
      columnas:
        - "id bigint PK identity"
        - "tarea varchar(40) NOT NULL CHECK IN ('PURGA_AUDITORIA','ANONIMIZACION_CUENTAS','PURGA_SESIONES','PURGA_OPS','REINDEX_BUSQUEDA','VERIFICACION_BUSQUEDA','REAPLICAR_ANONIMIZACIONES')"
        - "iniciado_en timestamptz NOT NULL DEFAULT now()"
        - "finalizado_en timestamptz NULL"
        - "resultado varchar(8) NOT NULL DEFAULT 'EN_CURSO' CHECK IN ('EN_CURSO','EXITO','FALLO')"
        - "filas_afectadas integer NULL"
        - "detalle varchar(500) NULL (sin PII)"
      constraints: []
      indices: ["(tarea, iniciado_en DESC): última ejecución por tarea (evidencia de AC-058/AC-107 y alertas)"]
      notas: "Retención <=30 días (purgar_ops)"
    - nombre: idempotencia_peticion
      data: "Operación (CHG-DB-001 / TKT-F4-004; contrato components.parameters.IdempotencyKey, ADR-API-002 §5, DEC-AUTO-107, DEC-AUTO-123)"
      columnas:
        - "id bigint PK identity"
        - "cuenta_id bigint NOT NULL FK cuenta_staff ON DELETE CASCADE (db_index=False: lo cubre el UNIQUE)"
        - "clave uuid NOT NULL (valor de la cabecera Idempotency-Key; Django UUIDField)"
        - "operacion varchar(40) NOT NULL CHECK IN ('panelCrearDestino','panelCrearItinerario','panelCrearGuia','panelCrearTipoAventura','panelCrearColeccion','panelCrearTerminoGlosario','panelPublicarContenido','panelRetirarContenido','panelReactivarContenido','panelSubirMedios','panelCrearCuenta') (las 11 operationId del contrato)"
        - "huella_peticion char(64) NOT NULL CHECK (huella_peticion ~ '^[0-9a-f]{64}$') (sha256 de: operacion + parámetros de ruta + cuerpo canónico (JSON con claves ordenadas); en multipart, huella_sha256 de cada archivo en orden + campos del formulario)"
        - "codigo_http smallint NULL CHECK (codigo_http BETWEEN 200 AND 299) (NULL solo dentro de la transacción en curso; el trigger diferido lo exige al hacer commit)"
        - "recurso_id bigint NULL (id del recurso creado o afectado, para Location o para reconstruir la respuesta)"
        - "cuerpo_respuesta jsonb NULL CHECK (cuerpo_respuesta IS NULL OR octet_length(cuerpo_respuesta::text) <= 65536) (respuesta resumida: el cuerpo 2xx serializado tal como se envió)"
        - "cuerpo_omitido boolean NOT NULL DEFAULT false (true cuando la respuesta contiene secretos y no se persiste)"
        - "creado_en timestamptz NOT NULL DEFAULT now()"
        - "expira_en timestamptz NOT NULL DEFAULT (now() + interval '24 hours')"
      constraints:
        - "UNIQUE (cuenta_id, clave) (DEC-AUTO-123). Reutilizar la misma clave en otra operación o con otra huella → 422 idempotencia_conflicto (DEC-AUTO-126)"
        - "CHECK (expira_en > creado_en AND expira_en <= creado_en + interval '24 hours')"
        - "CHECK (NOT (cuerpo_omitido AND cuerpo_respuesta IS NOT NULL))"
        - "CHECK (operacion <> 'panelCrearCuenta' OR (cuerpo_respuesta IS NULL AND cuerpo_omitido)) (la contraseña temporal nunca se persiste: AC-106, DEC-AUTO-125)"
        - "CONSTRAINT TRIGGER trg_idempotencia_completa AFTER INSERT OR UPDATE DEFERRABLE INITIALLY DEFERRED FOR EACH ROW: EXCEPTION si al hacer commit codigo_http IS NULL o (cuerpo_respuesta IS NULL AND NOT cuerpo_omitido) (DEC-AUTO-124)"
      indices:
        - "UNIQUE (cuenta_id, clave): búsqueda de la clave y serialización de duplicados concurrentes"
        - "Sin índice en expira_en: [INFERIDO] <=~100 escrituras/día x 24-48 h = cientos de filas; la purga diaria usa lectura secuencial"
      notas: "Protocolo (DEC-AUTO-124), todo dentro de la MISMA transacción del efecto de negocio. (1) DELETE FROM idempotencia_peticion WHERE cuenta_id=$c AND clave=$k AND expira_en <= now(). (2) INSERT (cuenta_id, clave, operacion, huella_peticion) ... ON CONFLICT (cuenta_id, clave) DO NOTHING RETURNING id. Si hay un duplicado concurrente sin confirmar, esta sentencia espera (sujeta a lock_timeout=3s de app_rw; si vence → 409, reintentable). (3) Si no se insertó: SELECT de la fila existente → si difieren operacion o huella_peticion → 422 idempotencia_conflicto; si coinciden → ROLLBACK del resto y se devuelve codigo_http + cuerpo_respuesta (si cuerpo_omitido, ver DEC-AUTO-125). (4) Si se insertó: se ejecuta el efecto y, antes del commit, UPDATE con codigo_http, recurso_id y cuerpo_respuesta. Cualquier error 4xx/5xx hace ROLLBACK y la fila desaparece con el efecto: solo se guardan respuestas 2xx confirmadas y el reintento con la misma clave vuelve a ejecutar la operación (sin efecto duplicado). Un reintento dentro de las 24 h con la fila vencida pero aún no purgada se trata como nuevo (paso 1). Los archivos de medios escritos antes de un ROLLBACK quedan huérfanos, igual que sin idempotencia: el servicio de medios los limpia. Persistente (NO UNLOGGED) y sí se incluye en las copias: tras restaurar, las claves son coherentes con los efectos restaurados, así que no hace falta ninguna acción específica."
    - nombre: cache_limites
      data: "Operación (condicional: solo si Backend usa DatabaseCache para el throttling de DRF)"
      columnas:
        - "cache_key varchar(255) PK (HMAC-SHA256 de la IP truncada + ámbito; nunca la IP en claro)"
        - "value text NOT NULL"
        - "expires timestamptz NOT NULL"
      constraints: ["Tabla UNLOGGED creada con RunSQL (esquema compatible con el de createcachetable de Django)"]
      indices: ["expires btree (limpieza de Django)"]
      notas: "Excluida de las copias (--no-unlogged-table-data) y del rol readonly. ADR-DB-005 §3"

