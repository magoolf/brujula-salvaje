    - {id: DEC-AUTO-090, decision: "Sin broker Celery desde la capa de datos; comandos programados con advisory lock; throttling en tabla UNLOGGED con clave HMAC (condicional)", alternativas: ["Celery + Redis", "Celery con broker PostgreSQL"], motivo: "§4.E no fragmentación; ningún proceso exige mensajería", riesgo: "Subidas síncronas lentas", reversibilidad: "Alta (Backend puede añadir un broker con su ADR)"}
    - {id: DEC-AUTO-091, decision: "Auditoría inmutable: privilegios + trigger + funciones SECURITY DEFINER para la purga y la seudonimización", alternativas: ["Solo privilegios", "Solo aplicación"], motivo: "THREAT-013 con defensa en profundidad", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: DEC-AUTO-092, decision: "ip_truncada como cidr con CHECK de máscara /24 o /48", alternativas: ["varchar(45)"], motivo: "La BD no puede almacenar una IP completa (REQ-057)", riesgo: "Campo Django personalizado", reversibilidad: "Alta"}
