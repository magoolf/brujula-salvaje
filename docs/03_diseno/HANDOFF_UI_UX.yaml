  DECISIONES:
    # ORIGEN: EXPANSIÓN_AUTÓNOMA · Estado: PROPOSED · Autoridad: Orquestador (Autoridad Delegada, CLAUDE.md §0.2)
    - {id: "DEC-AUTO-057", decision: "Design System propio sobre Angular CDK + Tailwind CSS con tema desde tokens.json", alternativas: ["Angular Material", "PrimeNG", "Bootstrap 5"], motivo: "Marca expresiva (DEC-AUTO-004), presupuesto JS ≤200 KB, patrones ARIA del CDK sin estética impuesta; §39A permite CDK y Tailwind", riesgo: "Más componentes a construir por Developer", reversibilidad: "Media"}
    - {id: "DEC-AUTO-058", decision: "Tipografías Bricolage Grotesque (titulares) + Source Sans 3 (texto), variables, WOFF2 autoalojadas, subconjunto latin, OFL", alternativas: ["Solo fuentes del sistema", "Inter", "Fraunces + Inter"], motivo: "Carácter editorial de aventura con buena legibilidad en español; licencia libre; cumple CON-003", riesgo: "Peso de fuentes (mitigado con presupuesto y fallback métrico)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-059", decision: "Solo tema claro en el MVP con soporte forced-colors; sin modo oscuro", alternativas: ["Modo oscuro automático por prefers-color-scheme"], motivo: "Fotografía protagonista sobre fondos arena; reduce superficie de pruebas de contraste a la mitad", riesgo: "Preferencia de algunos usuarios por modo oscuro", reversibilidad: "Alta (los tokens semánticos permiten añadirlo)"}
    - {id: "DEC-AUTO-060", decision: "Paleta Bosque (primario) · Atardecer (acento) · Laguna (secundario/foco) · Arena (fondos) · Tinta (texto)", alternativas: ["Azul océano como primario", "Paleta tierra monocroma"], motivo: "Evoca naturaleza y aventura; todos los pares de uso cumplen AA (calculado)", riesgo: "Marca provisional (DEC-003); el cambio de nombre no afecta a la paleta", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-061", decision: "Cartografía Natural Earth 1:110m (dominio público), proyección Equal Earth, SVG estático autoservido; marcadores como botones HTML; agrupación por proximidad y presets de región; sin librería de mapas ni teselas", alternativas: ["Leaflet con teselas locales", "Imagen raster del mundo", "Solo lista"], motivo: "Resuelve ASM-010; 0 terceros (CON-003); accesible por teclado; ligero", riesgo: "Sin zoom de detalle a nivel de calle (no requerido)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-062", decision: "Filtros: barra lateral ≥1024 px y hoja inferior <1024 px; aplicación inmediata con replaceUrl; paginación con nueva entrada de historial", alternativas: ["Botón Aplicar", "Filtros en la parte superior en todas las anchuras"], motivo: "Feedback inmediato (FLOW-002) sin llenar el historial; hoja inferior es el patrón móvil más alcanzable con el pulgar", riesgo: "Muchas peticiones al marcar varias casillas seguidas (mitigar con cancelación de la petición anterior)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-063", decision: "Dificultad (5) y presupuesto (4) como medidores de segmentos + número + etiqueta de la escala, sin símbolos de moneda", alternativas: ["Iconos de montaña / signos $", "Solo texto"], motivo: "Lectura rápida sin depender del color; RULE-020 prohíbe connotación de precio", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-064", decision: "Tuteo en sitio público y panel", alternativas: ["Usted (más formal en Colombia)", "Impersonal"], motivo: "Tono cercano de DEC-AUTO-004", riesgo: "Parte de la audiencia colombiana prefiere «usted»", reversibilidad: "Alta (textos centralizados)"}
    - {id: "DEC-AUTO-065", decision: "Motion solo con CSS y View Transitions API como mejora progresiva; sin librerías de animación", alternativas: ["@angular/animations", "GSAP"], motivo: "Presupuesto JS, INP y CSP", riesgo: "Navegadores sin View Transitions ven cortes instantáneos (aceptable)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-066", decision: "Iconos Lucide (ISC) vendorizados como SVG por icono", alternativas: ["Material Symbols (fuente)", "Iconos propios"], motivo: "Licencia permisiva, trazo coherente con la tipografía, tree-shaking, sin CDN", riesgo: "Algunos tipos de aventura sin icono específico (se representan con foto, no con icono)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-067", decision: "Rango de dificultad con dos select nativos Desde/Hasta", alternativas: ["Slider de doble pulgar", "Casillas 1-5"], motivo: "Accesibilidad y fiabilidad táctil superiores; conserva la semántica de rango de RULE-019", riesgo: "Menos vistoso", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-068", decision: "Resultados importantes como banners persistentes (role=status/alert), no toasts que se autodescartan", alternativas: ["Toasts de 5 s"], motivo: "WCAG 2.2.1 y acciones incluidas (Ver en el sitio, Deshacer, Reintentar)", riesgo: "Más elementos en pantalla", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-069", decision: "Toda reordenación con arrastre (CDK drag-drop) + botones Subir/Bajar + Mover a posición", alternativas: ["Solo arrastre", "Solo campo de orden numérico"], motivo: "WCAG 2.5.7 obligatorio", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-070", decision: "Panel desktop-first: barra lateral colapsable (cajón <1024), tablas → tarjetas <768; presupuesto JS del editor ≤350 KB gzip como excepción documentada", alternativas: ["Panel mobile-first completo", "Sin soporte móvil"], motivo: "ASM-009 y §47.2 (excepciones documentadas permitidas)", riesgo: "Experiencia móvil del panel solo operable", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-071", decision: "Sin Storybook; regresión visual con Playwright en 4 anchos", alternativas: ["Storybook + Chromatic (servicio externo de pago)", "Storybook local"], motivo: "Reduce cadena de herramientas; Chromatic violaría CON-003/CON-005", riesgo: "Menor documentación viva de componentes", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-072", decision: "Sistema de imagen: proporciones fijas por uso, sizes por plantilla, placeholder de color arena, recorte centrado", alternativas: ["Proporción libre", "Placeholder difuminado (LQIP)"], motivo: "CLS 0 y REQ-061 sin procesos extra", riesgo: "Recortes mejorables sin punto focal (NPD-UX-002)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-073", decision: "Cabecera pública fija compacta (64/72 px) siempre visible con scroll-padding", alternativas: ["Cabecera que se oculta al bajar", "Cabecera no fija"], motivo: "Búsqueda y Guardados siempre accesibles; 2.4.11 controlado", riesgo: "Ocupa altura en móviles pequeños", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-074", decision: "Código MFA en un único campo con autocomplete=one-time-code y pegado", alternativas: ["6 casillas separadas"], motivo: "WCAG 3.3.8 y compatibilidad con gestores", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-075", decision: "Secretos de un solo uso (contraseña temporal, códigos de recuperación) con Copiar y confirmación explícita antes de ocultarlos", alternativas: ["Mostrar en un diálogo que se cierra con Esc"], motivo: "Evita perder el secreto por un cierre accidental (AC-106)", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-076", decision: "Editor de contenido y fichas largas en una sola página con navegación de secciones (no pestañas)", alternativas: ["Pestañas por sección", "Asistente por pasos"], motivo: "El ErrorSummary puede enlazar a cualquier campo; búsqueda del navegador funciona; menos estado oculto", riesgo: "Página larga (mitigado con navegación y estado por sección)", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-077", decision: "Sin carruseles ni filas con scroll horizontal; siempre rejillas que se ajustan", alternativas: ["Carrusel de destacados en Inicio"], motivo: "REQ-060 (sin scroll horizontal), accesibilidad y descubribilidad", riesgo: "Inicio más largo en móvil", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-078", decision: "Enlaces externos del sitio público en la misma pestaña, con icono y texto oculto «(sitio externo)»; en el panel, «Ver en el sitio» y la política abren pestaña nueva avisada", alternativas: ["Todos los externos en pestaña nueva"], motivo: "Control del usuario (G201) en público; en el panel evita perder el formulario", riesgo: "Bajo", reversibilidad: "Alta"}
    - {id: "DEC-AUTO-079", decision: "Confirmación antes de «No autorizo» en SCR-033 (no cambia el resultado del FLOW-010)", alternativas: ["Cierre de sesión inmediato"], motivo: "Acción de consecuencia alta que puede pulsarse por error", riesgo: "Un clic más para quien realmente no autoriza", reversibilidad: "Alta"}

  NEEDS_PRODUCT_DECISION:
    - id: "NPD-UX-001"
      afecta: ["SCR-037", "SCR-036", "FLOW-011", "FEAT-035"]
      problema: "La ruta de SCR-037 requiere {id} (/panel/contenido/{tipo}/{id}/vista-previa), pero FEAT-035 pide previsualizar el estado actual del formulario sin persistir, lo que incluye contenido nuevo (/nuevo) que aún no tiene id."
      opciones: ["A) Añadir la variante /panel/contenido/{tipo}/nuevo/vista-previa usando el estado del formulario en memoria", "B) Deshabilitar «Vista previa» hasta el primer «Guardar borrador» con el motivo visible «Guarda el borrador para previsualizar»"]
      recomendacion: "A (no obliga a persistir borradores incompletos)."
      comportamiento_provisional: "Hasta decidir, el diseño contempla B (botón con aria-disabled y motivo), que no requiere cambiar rutas."
      severidad: "LOW"
      bloqueante: false
    - id: "NPD-UX-002"
      afecta: ["DATA de Medio (BLUEPRINT §18)", "SCR-040", "SCR-001", "SCR-004"]
      problema: "El bloque principal y las portadas cambian de proporción entre móvil (4:5 / 4:3) y escritorio (16:9). Sin un punto focal por medio, el recorte centrado puede cortar el sujeto de la foto."
      opciones: ["A) Añadir un atributo opcional «punto focal» (x,y en %) al Medio, editable en SCR-040 con un clic sobre la imagen (y alternativa por campos numéricos)", "B) Mantener el recorte centrado"]
      recomendacion: "A como COULD; no bloquea."
      comportamiento_provisional: "B (object-position: center)."
      severidad: "LOW"
      bloqueante: false

