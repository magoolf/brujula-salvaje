# HANDOFF_UI_UX — "Brújula Salvaje" (marca provisional DEC-AUTO-001)
# Productor: Skill_UI_UX (subagente ui-ux) · Ticket: TKT-F4-001 · Fase: F4 (paralelo con base-datos y backend-contrato)
# Input: docs/02_blueprint/BLUEPRINT.md v1.0 (44 SCR, 17 FLOW, GI-01..08, RULE-001..030) + docs/01_requerimientos/PRD.md
# Tokens: docs/03_diseno/tokens.json (W3C Design Tokens -> CSS Custom Properties --bs-*)
# Convención de origen (CLAUDE.md §0.2): [BP] = definido por el Blueprint; [UX] = refinamiento de diseño de este documento.
#   Toda decisión [UX] que implica elegir entre alternativas lleva DEC-AUTO-057..079 (ORIGEN: EXPANSIÓN_AUTÓNOMA, PROPOSED, reversible).
# Frontera (Skill_UI_UX §47.1A): este documento NO crea, elimina ni modifica SCR, FLOW, estados funcionales ni reglas.
#   Lo que requeriría cambiarlos está en NEEDS_PRODUCT_DECISION.
# Este documento no contiene código de aplicación (CLAUDE.md §0.3): los fragmentos CSS son valores de token, no implementación.

HANDOFF_UI_UX:
  ESTADO: "COMPLETADO"
  PROYECTO: "Brújula Salvaje (nombre provisional, DEC-AUTO-001)"
  VERSION: "1.0"
  FECHA: "2026-09-25"
  TICKET: "TKT-F4-001"

  CONTEXTO:
    PRB: "Portal editorial público, anónimo y de solo lectura sobre viajes de aventura, más un panel editorial interno para el staff (BLUEPRINT §1)."
    OBJ: ["OBJ-001 Inspirar a explorar", "OBJ-002 Contenido experto y creíble", "OBJ-003 Servir a todo tipo de visitantes (WCAG 2.2 AA)"]
    REQ: ["REQ-001", "REQ-010..033", "REQ-042", "REQ-043", "REQ-052", "REQ-055", "REQ-056", "REQ-058", "REQ-059", "REQ-060", "REQ-061", "REQ-070", "REQ-071"]
    STACK: "Angular"
    PLATAFORMAS: ["Mobile", "Tablet", "Desktop"]
    IDIOMA: "Solo español, lang=es, locale es-CO, sistema métrico (CON-004)"
    RESTRICCIONES_DE_DISENO:
      - "CON-003 / REQ-059: 0 recursos de terceros en ejecución. Fuentes, iconos, cartografía e imágenes se sirven desde el propio origen."
      - "CON-002: sin analítica, sin cookies en rutas públicas, sin formularios públicos que envíen datos."
      - "CON-007: el contenido principal de las rutas públicas llega en el HTML inicial; el diseño no depende de JS para mostrar contenido."
      - "CON-008 / REQ-056: WCAG 2.2 AA; 0 violaciones axe serious/critical."
      - "REQ-052: LCP ≤ 2,5 s, INP ≤ 200 ms, CLS ≤ 0,1 (p75 móvil). REQ-061: ≤ 1,5 MB de transferencia en la carga inicial de Inicio y Ficha."
      - "REQ-060 / CON-009: 320–1920 px sin scroll horizontal; 2 últimas versiones de Chrome, Firefox, Safari, Edge, Safari iOS y Chrome Android."
      - "ASM-001: sitio público mobile-first. ASM-009: panel orientado a escritorio, usable desde 768 px y operable a 320 px."

  UX_ANALYSIS:
    mode: "DESIGN_SYSTEM + UX_DESIGN + UI_DESIGN + RESPONSIVE + ACCESSIBILITY + MOTION + DESIGN_TO_CODE"
    status: "COMPLETED"
    objective: "Sistema de diseño y VIEW_SPEC de las 44 SCR para que Skill_Developer implemente en Angular sin decisiones visuales pendientes."
    user_goal: "Visitante: inspirarse, descubrir y planear sin cuenta, desde el móvil. Staff: mantener un catálogo de calidad sin tocar código y sin publicar contenido incompleto."
    product_goal: "Recorridos de ≥3 niveles de profundidad sin callejones sin salida (OBJ-001); credibilidad visible (OBJ-002); accesibilidad total (OBJ-003)."
    assumptions: ["ASM-UX-001", "ASM-UX-002", "ASM-UX-003"]
    needs_product_decision: ["NPD-UX-001", "NPD-UX-002"]
    needs_content: ["Fotografías semilla con licencia verificable (GAP-007)", "Textos de la escala de dificultad y presupuesto (DATA-020)", "Datos del Responsable del tratamiento (DEC-001)"]
    needs_data: ["Derivados responsivos de imagen con ancho y alto conocidos (DEC-AUTO-044)", "Coordenadas de cada destino (RULE-023)"]
    technical_dependencies:
      - "Renderizado del HTML inicial en servidor + hidratación (CON-007; forma técnica en F5, Skill_Frontend)."
      - "Angular CDK (a11y, overlay, dialog, drag-drop, listbox) y Tailwind CSS consumiendo --bs-* (DEC-AUTO-057)."
      - "Contrato OpenAPI (backend-contrato, F4) para los campos exactos de tarjetas y formularios."
    key_decisions: ["DEC-AUTO-057..079 (ver DECISIONES)"]
    rejected_options:
      - "Angular Material / PrimeNG como librería base: peso de bundle y estética genérica frente a una marca expresiva (DEC-AUTO-057)."
      - "Mapas con teselas (Leaflet/OpenStreetMap): violan CON-003 (DEC-AUTO-061)."
      - "Carruseles automáticos y filas con scroll horizontal (DEC-AUTO-077)."
      - "Toasts que desaparecen solos para resultados importantes (DEC-AUTO-068)."
      - "Slider doble para el rango de dificultad (DEC-AUTO-067)."
      - "Editor de contenido por pestañas (DEC-AUTO-076)."
    rationale:
      - "Fotografía protagonista + tipografía editorial expresiva materializan DEC-AUTO-004 sin coste de rendimiento (fuentes variables subconjuntadas, 0 librerías de animación)."
      - "Primitivas headless del CDK dan patrones ARIA probados sin imponer estética."

  UX_DIRECTION:
    Objetivo: "Que cada pantalla invite a dar el siguiente paso: toda vista pública termina con rutas de salida visibles (Sigue explorando, migas, estados vacíos con ≥2 salidas)."
    Usuario: "Visitante hispanohablante, mayoritariamente móvil (ASM-001), sin cuenta; staff de 1-5 personas en escritorio (ASM-009)."
    User_Journey: "Inspiración (Inicio, fotografía) → Descubrimiento (Explorar, mapa, meses, tipos, búsqueda) → Profundización (ficha, galería, datos clave, seguridad) → Planificación (itinerario día a día, checklist, guías, imprimir) → Continuación (Sigue explorando, guardar, compartir)."
    User_Flow: "FLOW-001 es el eje troncal; FLOW-002..009 y FLOW-017 lo alimentan; FLOW-010..016 cubren el panel. Validación en FLUJOS_VALIDADOS."
    Arquitectura_Informacion:
      - "Sitemap del BLUEPRINT §10 sin cambios. Navegación primaria GI-01: Destinos · Tipos de aventura · Itinerarios · Guías · Colecciones* · Cuándo ir* (* solo si está implementada, RULE-030)."
      - "Navegación secundaria GI-02 (pie): Acerca de / Metodología · Tratamiento de datos · Cookies · Aviso legal · Créditos · Mapa del sitio · Glosario*."
      - "Navegación contextual: migas (GI-03) en todo detalle, enlaces cruzados entre entidades, Sigue explorando (≥3, RULE-006), índice En esta página en fichas largas."
      - "Panel: barra lateral por tareas (Tablero · Contenido [7 tipos] · Medios · Destacados de inicio · Taxonomías · [Admin] Cuentas · Auditoría · Configuración) + menú de usuario (Mi cuenta · Cerrar sesión)."
    Riesgos_UX:
      - "Fichas de destino muy largas (≥600 palabras + 12 secciones): mitigado con índice En esta página, jerarquía h2 estricta y datos clave arriba."
      - "Superposición de marcadores en el mapa (varios destinos en Colombia): mitigado con agrupación y presets de región (DEC-AUTO-061)."
      - "Formularios editoriales extensos: mitigado con navegación por secciones, indicador de completitud y resumen de errores enlazado."
      - "Contenido semilla sin fotografía real (GAP-007): el sistema mantiene proporciones y placeholders de marca para que no se degrade la maquetación."

  DESIGN_SYSTEM:
    Framework_Vinculante: "Angular 22 — zoneless, Signals, httpResource, arquitectura por features (Skill_Frontend.md §2 y §4)"
    Component_Library: "Design System propio en shared/ui construido sobre Angular CDK (primitivas headless accesibles) + Tailwind CSS con tema generado desde tokens.json. Sin Angular Material ni PrimeNG (DEC-AUTO-057)."
    Visual_Language: "Aventura inspiradora (DEC-AUTO-004): fotografía de paisaje a sangre como protagonista, titulares grotescos expresivos, fondos arena cálidos, verde bosque como color de acción y naranja atardecer reservado para el único gran CTA inspiracional de cada vista. El panel usa el mismo sistema en densidad compacta y sin fotografía decorativa."
    Principios_Visuales:
      - "La foto inspira, el dato decide: cada imagen protagonista va acompañada de datos clave legibles (dificultad, época, duración)."
      - "Un solo acento por vista: el naranja atardecer solo aparece en un CTA, en marcadores del mapa y en resaltados."
      - "Credibilidad visible: autoría, fecha de revisión, fuentes y descargo tienen tratamiento tipográfico propio, no letra pequeña escondida."
      - "Nunca solo color: estados, dificultad, presupuesto, errores y selección llevan siempre texto o forma."
      - "Calma operativa en el panel: densidad compacta, estados editoriales como insignias con texto, acciones destructivas separadas y confirmadas."
    Anti_Copy_Note: "Los patrones de referencia (revistas de viaje, guías outdoor) inspiran estructura, no se copian marcas, ilustraciones ni maquetas."
    Tokens_Fuente: "docs/03_diseno/tokens.json"
    Convencion_CSS: "Cada token se expone como CSS Custom Property --bs-<ruta-con-guiones> en :root (p. ej. --bs-color-text-muted, --bs-space-4, --bs-motion-duration-base). Tailwind consume las variables en su tema; ningún componente usa HEX literales ni espaciados fuera de escala."
    Tokens:
      Primary: "#1F5C45"
      Primary_Hover: "#174A37"
      Secondary: "#1D5E7A"
      Accent: "#C2410C"
      Accent_Text: "#A93A0A"
      Background: "#FBF8F3"
      Background_Panel: "#F2EDE4"
      Surface: "#FFFFFF"
      Surface_Sunken: "#F2EDE4"
      Surface_Inverse: "#1B2421"
      Text: "#1B2421"
      Muted_Text: "#55615B"
      Border: "#E6DED1"
      Border_Control: "#7A857F"
      Success: "#276A2B"
      Warning: "#8A5A00"
      Error: "#B3261E"
      Info: "#1D5E7A"
      Focus: "#1D5E7A"
      Focus_On_Dark: "#F2A57C"
