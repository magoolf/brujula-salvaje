        - {par: "text.default / surface #FFFFFF", ratio: "15.9:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "text.muted #55615B / sand.50", ratio: "6.05:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "text.muted / sand.100 #F2EDE4", ratio: "5.55:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "blanco / primary #1F5C45", ratio: "7.85:1", uso: "botón primario", umbral: "4.5", resultado: "OK"}
        - {par: "primary / sand.50 (enlaces)", ratio: "7.34:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "primary / forest.100 #E3EFE8 (seleccionado)", ratio: "6.65:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "blanco / accent #C2410C", ratio: "5.18:1", uso: "CTA de acento", umbral: "4.5", resultado: "OK"}
