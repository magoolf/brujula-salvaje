  RESPONSIVE_SPEC:
    Strategy: "Fluid + Container Queries + Adaptive Breakpoints (mobile-first en público; panel desktop-first con adaptación descendente, DEC-AUTO-070)"
    Breakpoints: ["xs 320", "sm 480", "md 768", "lg 1024", "xl 1280", "2xl 1536", "prueba 1920"]
    Mobile: "320-767: una columna; cabecera compacta con cajón; filtros en hoja inferior; acciones del panel en barra inferior; objetivos táctiles de 44 px."
    Tablet: "768-1023: rejillas de 2-3 columnas; hojas y diálogos centrados con ancho máximo; el panel es usable (ASM-009)."
    Desktop: "1024-1535: barra lateral de filtros; índices fijos; panel con navegación lateral; tablas completas."
    Large_Desktop: "≥1536 y 1920: contenedor de contenido 1280 px (1440 para medios a sangre); nunca líneas de texto de más de 68ch; imágenes a sangre hasta 1920 px."
    Reglas:
      - "Qué colapsa: navegación principal (< xl) → cajón; filtros (< lg) → hoja inferior; PageToc (< lg) → desplegable; tablas (< md) → tarjetas; barra lateral del panel (< lg) → cajón."
      - "Qué se reordena: en la ficha, las acciones pasan bajo el h1 en móvil; en el editor, la StatusBar pasa a abajo."
      - "Qué nunca desaparece: búsqueda, Guardados*, acción principal, migas (versión compacta), descargo."
      - "Container queries en tarjetas: < 280 px ocultan tipos; ≥ 520 px (variante horizontal) muestran resumen."
    Input_Modes: ["Touch", "Mouse", "Keyboard"]
    Hover_Rule: "Nada depende del hover: toda información revelada al hover también está disponible con foco y con toque. Efectos de hover solo con (hover: hover) and (pointer: fine)."
    Orientation: ["Portrait", "Landscape (sin bloqueo de orientación; visor de galería y mapa aprovechan horizontal)"]
    Zoom: ["100%", "200% (sin pérdida de contenido)", "400% equivalente a 320 CSS px (reflow 1.4.10)", "Espaciado de texto 1.4.12 sin recortes"]
    Overflow_Check: "0 scroll horizontal a 320/768/1280/1920 (REQ-060). Palabras largas y URL con overflow-wrap: anywhere; tablas del panel con contenedor de scroll propio solo ≥ md y con región enfocable etiquetada."
    Safe_Areas: "Barras fijas inferiores respetan env(safe-area-inset-bottom)."

  ACCESSIBILITY_SPEC:
    Standard: "WCAG 2.2 AA (REQ-056, CON-008). Criterio de aceptación: 0 violaciones axe serious/critical en todas las plantillas + revisión manual por teclado y lector de pantalla (NVDA+Firefox, VoiceOver+Safari iOS)."
    Semantic_HTML: "Landmarks header/nav/main/aside/footer en cada vista; un h1 por vista; listas reales; tablas con th/caption; formularios con label/fieldset/legend; botones para acciones y enlaces para navegación; lang=es en html."
    Keyboard_Navigation: "Todo operable por teclado; orden de foco = orden visual; sin trampas salvo diálogos modales (con Esc); atajos solo con modificador (Ctrl/Cmd) y documentados; flechas en tabs, toolbar, listbox y galería."
    Focus_Management: "Anillo visible de 3 px (focus.ring) con separación de 2 px, contraste ≥3:1 (2.4.7, 2.4.13 como buena práctica); en fondos oscuros focus.ring-inverse. Al navegar de ruta, el foco va al h1 (tabindex=-1) y se anuncia el título. Diálogos devuelven el foco al disparador. 2.4.11: cabecera fija compensada con scroll-padding-top 80 px y barras inferiores con scroll-padding-bottom."
    Screen_Reader: "Anuncio de cambio de ruta en una región live única; recuentos y confirmaciones en role=status; errores en role=alert solo tras una acción; iconos decorativos aria-hidden; imágenes informativas con alt (100 %, REQ-056) y decorativas con alt vacío (imágenes de tarjeta)."
    Contrast: "Texto ≥4.5:1 (grande ≥3:1); componentes y gráficos ≥3:1; pares calculados en DESIGN_SYSTEM.Contraste_Calculado; texto sobre foto solo con scrim."
    Target_Size: "Mínimo 24×24 CSS px (2.5.8) en todo; objetivo 44×44 en todo el sitio público y en el panel con pointer: coarse."
    Reduced_Motion: "prefers-reduced-motion: reduce desactiva desplazamientos, escalas, zoom animado, scroll suave, morph de View Transitions y pulsos de esqueleto; quedan solo fundidos ≤100 ms."
    Color_Independence: "Estados, dificultad, presupuesto, selección, errores y enlaces llevan texto, forma o subrayado además del color (1.4.1)."
    WCAG_22_Nuevos:
      - "2.4.11 Focus Not Obscured: ver Focus_Management."
      - "2.5.7 Dragging Movements: toda reordenación con botones Subir/Bajar (DEC-AUTO-069); subida de archivos con botón; mapa con botones de zoom."
      - "2.5.8 Target Size (Minimum): ver Target_Size."
      - "3.2.6 Consistent Help: la ayuda del panel («Pide a un administrador…») aparece en el mismo lugar en SCR-030/031; el pie público mantiene los enlaces institucionales en el mismo orden."
      - "3.3.7 Redundant Entry: los formularios del panel conservan lo escrito ante expiración, conflicto u offline; no se pide dos veces el mismo dato salvo la confirmación de contraseña (excepción de seguridad)."
      - "3.3.8 Accessible Authentication (Minimum): sin pruebas cognitivas; pegar y gestores de contraseñas permitidos; OTP con autocomplete=one-time-code."
    Forced_Colors: "Soporte forced-colors: active (DEC-AUTO-059)."
    Idioma: "Términos en otro idioma dentro del contenido (p. ej., «trekking», «via ferrata») con lang cuando el editor lo marque; no bloqueante."
    Tiempo: "2.2.1: sesión con aviso y extensión; confirmaciones de éxito que no desaparecen solas si contienen acciones (DEC-AUTO-068)."

  MOTION_SPEC:
    Principles:
      - "El movimiento orienta (de dónde viene y a dónde va algo), no decora."
      - "Solo CSS (transiciones y @keyframes) + View Transitions API como mejora progresiva; 0 librerías de animación (DEC-AUTO-065)."
      - "Solo se animan transform y opacity (compositor) para no afectar INP ni CLS."
      - "Nada se anima en la carga inicial por encima del pliegue (protege LCP)."
    Microinteractions:
      - "Botón pressed: translateY(1px) 100 ms."
      - "Guardar: relleno del icono con escala 1→1.15→1 en 160 ms."
      - "Casillas y fichas: 100 ms."
      - "Hover de tarjeta: sombra 1→2 y escala de imagen 1.03 en 360 ms (solo puntero fino)."
      - "Marcador del mapa activo: escala 1.25 en 100 ms."
    Page_Transitions:
      - "Rutas públicas: View Transition de fundido 160 ms; imagen de tarjeta → portada con view-transition-name por slug (360 ms) cuando el navegador lo soporta."
      - "Panel: sin transiciones de página (prioriza rapidez percibida)."
    Overlays:
      - "Diálogo: fundido + escala 0.98→1 en 240 ms (enter); salida 180 ms (exit)."
      - "Hoja inferior y cajones: desplazamiento desde el borde 240 ms."
      - "Mini-tarjeta y menús: fundido + desplazamiento de 4 px en 160 ms."
    Feedback:
      - "Esqueleto: pulso de opacidad 1.6 s tras 300 ms de espera."
      - "Progreso de subida: barra determinada sin animación añadida."
    Durations: "instant 0 · fast 100 · base 160 · moderate 240 · slow 360 ms; easing standard (0.2,0,0,1), enter (0.05,0.7,0.1,1), exit (0.3,0,1,1)."
    Reduced_Motion: "Todo lo anterior pasa a instantáneo salvo fundidos ≤100 ms; sin morph, sin escalas, sin scroll suave, sin pulso."
    Prohibido: ["Parallax", "Vídeo o carrusel en reproducción automática", "Animaciones infinitas fuera de indicadores de carga", "Animaciones que bloqueen la interacción"]

  PERFORMANCE_SPEC:
    Umbrales: "LCP ≤ 2,5 s · INP ≤ 200 ms · CLS ≤ 0,1 (p75 móvil, REQ-052); Lighthouse móvil ≥ 90 y TBT ≤ 200 ms en Inicio, Explorar, Ficha, Itinerario y Guía."
    Presupuestos_Por_Ruta:
      - "JS inicial ≤ 200 KB gzip por ruta pública (§47.2)."
      - "Panel: JS inicial ≤ 200 KB gzip en SCR-030/031/033/034/035; excepción documentada para el editor (SCR-036/041) ≤ 350 KB gzip por el editor de texto enriquecido y drag-drop, cargados solo en esas rutas (DEC-AUTO-070)."
      - "CSS total ≤ 40 KB gzip; CSS crítico en línea ≤ 14 KB (ver RSK-UX-001 sobre CSP)."
      - "Fuentes: ≤ 2 archivos en la ruta crítica, ≤ 100 KB en total en la carga inicial."
      - "Transferencia total de la carga inicial ≤ 1,5 MB en Inicio y Ficha (REQ-061); objetivo de diseño ≤ 1,1 MB."
      - "Imagen LCP ≤ 200 KB en móvil y ≤ 350 KB en escritorio; imágenes de tarjeta ≤ 60 KB cada una."
      - "Cartografía del mapa ≤ 120 KB gzip, solo en SCR-003 (y en el editor, diferida)."
    Elementos_LCP: "SCR-001: imagen del bloque principal · SCR-004/007/009/012: portada · listados: primera fila de tarjetas (sin lazy en las 2-4 primeras)."
    Sizes_Recomendados:
      hero: "100vw"
      portada_ficha: "(min-width: 1280px) 1280px, 100vw"
      tarjeta_rejilla: "(min-width: 1536px) 25vw, (min-width: 1024px) 33vw, (min-width: 480px) 50vw, 100vw"
      tarjeta_horizontal: "(min-width: 768px) 200px, 88px"
      galeria_mosaico: "(min-width: 1024px) 50vw, 50vw"
      lightbox: "100vw"
      miniatura_panel: "160px"
    CLS: "width/height o aspect-ratio en todo medio; esqueletos con la altura final; fuentes con fallback métrico; OfflineBanner, SessionExpiryDialog y confirmaciones como capas que no empujan contenido; contador de Guardados con espacio reservado; nada se inserta encima de contenido ya pintado."
    INP: "Casillas de filtro responden visualmente en el mismo frame y la petición es asíncrona; sin trabajo síncrono >50 ms en manejadores; listas paginadas (24/50) sin virtualización necesaria; el recuento se actualiza al llegar la respuesta."
    Carga_Diferida: "Bajo el pliegue: Sigue explorando, guías relacionadas, galería completa y código del visor, mapa; se hidratan/cargan al entrar en viewport o al interactuar (mecanismo según Skill_Frontend)."
    Prefetch: "Prefetch de la ruta de ficha al hover/foco de una tarjeta (solo con conexión no ahorrada: navigator.connection.saveData = false)."

  PRINT_SPEC:
    Aplica: ["SCR-007 (itinerario)", "SCR-009 (checklist)"]
    Reglas:
      - "@media print: oculta cabecera, pie, migas, acciones, Sigue explorando, OfflineBanner e imágenes decorativas; mantiene título, KeyFacts, días completos, riesgos, descargo, fuentes, fecha de revisión y URL canónica al pie de la primera página."
      - "Tipografía en negro sobre blanco, tamaño base 11 pt, sin fondos; los enlaces muestran su URL entre paréntesis salvo los internos."
      - "Cada día evita cortes internos (break-inside: avoid) cuando cabe en una página; el checklist imprime casillas vacías."
      - "Imprimir llama al diálogo del navegador sobre la misma página (FEAT-022); no hay ruta de impresión."

  UX_NOTES:
    Tono_de_Voz: "Cercano y experto, en español neutro con referencias de Colombia (DEC-AUTO-031), tuteo en todo el sitio y el panel (DEC-AUTO-064); frases cortas; verbos de acción en botones; sin tecnicismos en errores; sin culpar al usuario."
    Microcopy:
      - "Botones: infinitivo o imperativo breve («Explorar destinos», «Guardar», «Publicar»)."
      - "Confirmaciones: pasado en primera persona del usuario («Guardaste…», «Quitaste…»)."
      - "Estados editoriales en texto natural: Borrador, Publicado, Retirado, Pendiente de datos."
      - "Plurales con ICU; nunca «destino(s)»."
    Empty_States: ["Siempre título + explicación + ≥2 salidas (ST-EMPTY); ver cada VISTA."]
    Error_Recovery:
      - "Formato de error: qué pasó + qué hacer («Escribe al menos 2 caracteres.»)."
      - "Nunca códigos, trazas ni identificadores técnicos (ST-ERROR, THREAT-028)."
      - "Mensajes de autenticación genéricos (THREAT-018)."
    Internationalization:
      - "Solo es-CO (CON-004): fechas con Intl es-CO largas («25 de septiembre de 2026»), zona America/Bogota en el panel; números «1.234,5»; unidades km, m, m s. n. m., °C; meses en minúscula en el cuerpo del texto."
      - "Coordenadas: «4,5709° N, 74,2973° O» (O = oeste)."
      - "Orden alfabético español sin tildes (RULE-019) también en listas del glosario, mapa del sitio y lista del mapa."
      - "Textos de interfaz centralizados para permitir corrección sin tocar plantillas (aunque no hay multi-idioma)."
    Data_Visualization: ["Solo medidores simples (dificultad, presupuesto, mejor época); siempre con equivalente textual. Sin gráficos en el panel más allá de tablas de conteo."]
    AI_Interface: ["NOT_APPLICABLE: el producto no tiene funcionalidades de IA."]
    Analytics: "NOT_APPLICABLE por restricción (CON-002, REQ-059): sin analítica. Gate J no aplica."

