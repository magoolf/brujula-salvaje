    - NombreVista: "Editor de contenido"
      SCR: "SCR-036"
      Ruta: "/panel/contenido/{tipo}/nuevo | /panel/contenido/{tipo}/{id}"
      Plantilla: "TPL-PANEL-SHELL (variante editor)"
      FLOW: ["FLOW-011", "FLOW-012", "FLOW-013", "FLOW-016"]
      Purpose: "Crear, editar y llevar a publicación cualquier tipo de contenido con calidad garantizada."
      Layout: "Una sola página con secciones (DEC-AUTO-076): ≥ xl 3 columnas = navegación de secciones (220 px, con icono Cumplido/Pendiente por sección) · formulario (máx. 760 px) · StatusBar lateral (300 px: estado, acciones, CompletenessPanel, «Guardado a las…», versión). lg-xl: navegación de secciones como select «Ir a sección» + StatusBar fija superior. < lg: StatusBar fija inferior."
      Secciones: "Las del BLUEPRINT §11.2 (SCR-036) por tipo, en el mismo orden, cada una section con h2 y fieldsets."
      Detalle_Campos:
        - "Slug: prefijo visible («/destinos/») + campo; se propone desde el nombre mientras no se edite a mano; tras la primera publicación, readonly con icono de candado y ayuda «El slug no se puede cambiar después de publicar.» (RULE-008, AC-101)."
        - "Tipos + principal: CheckboxGroup de tipos + RadioGroup «Tipo principal» limitado a los marcados."
        - "Meses: rejilla 3×4 de casillas."
        - "Duración: dos number «Mínimo» y «Máximo» (días) en fieldset."
        - "Dificultad y presupuesto: RadioGroup con etiqueta de la escala."
        - "Textos con límite: contador (resumen 300, título SEO 70, descripción SEO 160); descripción con contador de palabras (≥600)."
        - "Ubicación: latitud/longitud (6 decimales) + vista previa de marcador sobre WorldMap en solo lectura (carga diferida)."
        - "Medios: portada (MediaTile + «Elegir portada» → SCR-041 modo único) y galería (SortableList en rejilla + «Añadir imágenes» → SCR-041 múltiple; «{n} de 3 mínimo»)."
        - "Días (itinerario): SortableList de días; cada día en details (abierto el último añadido) con título, actividades (RichText corto), distancia, desnivel +/−, alojamiento, consejos; «Añadir día»; indicador «Días: 5 de 7 según la duración» en warning si no coincide (AC-118)."
        - "Checklist (tipo): SortableList de elementos con grupo, nombre y casilla «Esencial»; «{n} de 8 mínimo»."
        - "Relacionados: Combobox + SortableList; nota «Si hay menos de 3, se completarán automáticamente por afinidad al publicar.»"
        - "Glosario vinculado: Combobox múltiple."
        - "Fuentes: filas repetibles (título, URL) con «Añadir fuente»; alternativa casilla «Remite a la Metodología» (guías, RULE-004)."
        - "Revisión: date con máximo hoy; ayuda «Actualízala solo cuando revises el contenido.» (RULE-009)."
        - "Historial: lista de revisiones (fecha, acción, actor) con «Restaurar en el formulario»* (confirmación: «Se cargará la revisión del {fecha} en el formulario. No cambia nada público hasta que publiques o actualices.»)."
        - "Página institucional: clave fija como texto, versión y vigencia; sin Retirar ni Eliminar."
      Componentes: ["StatusBar", "CompletenessPanel", "ErrorSummary", "FormField", "CheckboxGroup", "RadioGroup", "RichTextEditor", "SortableList", "Combobox", "MediaTile", "WorldMap (solo lectura)", "ConflictBanner", "SessionExpiryDialog", "UnsavedChangesDialog", "OfflineBanner", "Badge editorial"]
      Estados_UI:
        default: "Formulario con datos."
        loading: "Carga inicial: esqueleto de secciones. Guardar: «Guardando…» en el botón; formulario editable."
        empty: "Alta: campos vacíos; CompletenessPanel con todos los requisitos pendientes."
        error: "Validación de formato al guardar: ErrorSummary + errores en línea. Error de red: banner error con Reintentar; datos intactos."
        success: "«Borrador guardado a las {hora}.» en la StatusBar (role=status); tras publicar: banner success «{título} está publicado.» + «Ver en el sitio»."
        conflict: "ConflictBanner (AC-110)."
        session_expiring: "SessionExpiryDialog 2 min antes."
        session_expired: "Datos conservados en la página; la siguiente acción lleva a SCR-030 (ALT-014)."
        offline: "Guardar/Publicar deshabilitados con «Sin conexión: tus cambios se conservan en esta página.»; edición permitida."
        unsaved_exit: "UnsavedChangesDialog."
        disabled: "RETIRADO: campos en solo lectura con banner info «Este contenido está retirado. Reactívalo como borrador para editarlo.» + acción principal «Reactivar como borrador»."
        permission_denied: "Páginas legales para Editor → SCR-048."
      Responsive:
        mobile: "Operable (ASM-009): una columna; StatusBar inferior con acción principal y «Más acciones»; secciones con encabezado fijo al hacer scroll."
        tablet: "Una columna de 720 px; StatusBar inferior."
        desktop: "Selector de secciones + formulario + StatusBar superior."
        large_desktop: "3 columnas descritas en Layout."
      Accessibility:
        semantics: ["form con aria-labelledby al h1 («Editar destino: {nombre}» / «Nuevo destino»)", "Cada sección section + h2; grupos en fieldset + legend"]
        focus_order: ["Navegación de secciones → formulario → StatusBar (en ≥ xl); en móvil la StatusBar inferior va al final del orden"]
        keyboard: ["Ctrl/Cmd+S = Guardar borrador (anunciado en la ayuda del botón)", "Enlaces de navegación de secciones mueven el foco al h2"]
        aria: ["Estado de guardado en role=status", "Campos obligatorios para publicar marcados «(obligatorio para publicar)» — distinto de obligatorio para guardar"]
      Motion: {enter: "Ninguna.", transition: "Reordenación de listas 160 ms.", feedback: "Punto de «Cambios sin guardar».", reduced_motion: "Reordenación instantánea."}
      UX_Copy: {guardar: "Guardar borrador", vista_previa: "Vista previa", publicar: "Publicar", actualizar: "Actualizar publicación", retirar: "Retirar", reactivar: "Reactivar como borrador", eliminar: "Eliminar borrador", guardado: "Guardado a las {hora}", sin_guardar: "Cambios sin guardar", completitud_ok: "Listo para publicar", completitud_pend: "Faltan {n} requisitos para publicar"}

