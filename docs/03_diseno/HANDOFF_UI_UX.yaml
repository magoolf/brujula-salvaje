  FLUJOS_VALIDADOS:
    # Validación de experiencia (Skill_UI_UX §8 USER FLOW CHECKER) sobre los FLOW del Blueprint. No redefine pasos.
    - FLOW: "FLOW-001 Descubrir e inspirarse"
      Resultado: "OK"
      Soporte_UX: "CTA de acento único en Inicio; KeyFacts arriba en la ficha; Sigue explorando al final de cada detalle; transición de imagen tarjeta→portada."
      Friccion: "Longitud de la ficha → PageToc."
