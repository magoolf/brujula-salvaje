  GLOBALES:
    GI-01: "SiteHeader (ver COMPONENTES)"
    GI-02: "SiteFooter"
    GI-03: "Breadcrumbs"
    GI-04: "OfflineBanner"
    GI-05: "DisclaimerBlock"
    GI-06: "ShareButton*"
    GI-07: "SaveButton*"
    GI-08: "SurpriseButton*"
    Regla_RULE_030: "Todo componente GI marcado * y todo enlace a SCR SHOULD/COULD se renderiza solo si su funcionalidad está implementada. El diseño de cada vista no deja huecos cuando se omiten (las rejillas se reajustan)."

  VISTAS_DISEÑADAS:
    # Estados abreviados: ST-LOADING / ST-EMPTY / ST-ERROR / ST-OFFLINE / ST-NOTFOUND / ST-GONE / ST-UNAUTHORIZED / ST-FORBIDDEN = estándar del BLUEPRINT §11
    # materializados con Skeleton / EmptyState / ErrorState / OfflineBanner / SCR-023 / SCR-024 / redirección a SCR-030 / SCR-048.
    # ------------------------------------------------------------------ SITIO PÚBLICO
    - NombreVista: "Inicio"
      SCR: "SCR-001"
      Ruta: "/"
      Plantilla: "TPL-PUB-HOME"
      FLOW: ["FLOW-001", "FLOW-006", "FLOW-007", "FLOW-008", "FLOW-003"]
      Purpose: "Inspirar y distribuir hacia todas las vías de exploración."
      Layout: "Bloque principal a sangre (alto: 4:5 < md, 16:9 limitado a 80vh ≥ md) con cabecera transparente encima; debajo, secciones apiladas en contenedor de 1280 px."
      Hierarquia_Visual:
        - "1. Bloque principal: imagen (LCP) + scrim inferior; overline con la marca; titular display (DATA-021, ≤80); subtítulo body-lg (≤160); CTA accent lg «Explorar destinos» → SCR-002; secundario ghost-inverse «Sorpréndeme»*; SearchField grande debajo de los CTA (≥ md) o como sección propia justo después del bloque (< md)."
        - "2. «Explora por tipo de aventura»: todos los tipos publicados como CardTipo compacta en rejilla 2 col < md, 3 col md, 6 col ≥ xl."
        - "3. «Destinos destacados» (6-12, RULE-016): rejilla CardDestino + enlace «Ver todos los destinos»."
        - "4. «Itinerarios para planear» (≥3): CardItinerario + «Ver todos los itinerarios»."
        - "5. «Guías expertas» (≥3): CardGuia + «Ver todas las guías»."
        - "6. «Otras formas de explorar»: mosaico de accesos Mapa* · Cuándo ir* · Colecciones* · Sorpréndeme* (tarjetas con icono, título y una línea)."
      Componentes: ["SiteHeader (variante sobre bloque principal)", "Button accent", "SurpriseButton*", "SearchField", "CardTipo", "CardDestino", "CardItinerario", "CardGuia", "SiteFooter", "OfflineBanner"]
      Estados_UI:
        default: "Secciones completas con mínimos garantizados por RULE-016 (el relleno automático es invisible al visitante)."
        loading: "No aplica en la carga inicial (CON-007). Sorpréndeme muestra loading en el botón."
        empty: "Entorno sin contenido publicado: bloque principal con texto «Contenido en preparación» + enlaces a Acerca de y Mapa del sitio; secciones vacías no se renderizan."
        error: "ST-ERROR por sección (una sección que falla muestra ErrorState local; el resto sigue)."
        offline: "ST-OFFLINE."
        success: "No aplica."
        disabled: "No aplica."
        permission_denied: "No aplica (público)."
      Responsive:
        mobile: "Bloque 4:5 con titular en la mitad inferior; CTA a ancho completo apilados; búsqueda como sección propia; rejillas de 1-2 columnas."
        tablet: "Bloque 16:9; CTA en línea; rejillas de 2-3 columnas."
        desktop: "Titular alineado a la izquierda en 7/12 columnas; búsqueda bajo los CTA; rejillas de 3-4 columnas."
        large_desktop: "Imagen hasta 1920 px de ancho, contenido centrado a 1440 px; titular hasta 4.5rem."
      Accessibility:
        semantics: ["h1 = titular del bloque principal", "Cada sección es section con h2", "La imagen del bloque principal lleva alt de DATA-021/medio (es informativa)"]
        focus_order: ["SkipLink → cabecera → CTA → búsqueda → secciones en orden visual"]
        contrast: ["Texto sobre imagen solo sobre scrim ≥0.78 (≈6.5:1 en el peor caso)"]
      Motion: {enter: "Sin animación de entrada del bloque principal (protege LCP).", transition: "View Transition por defecto (fundido 160 ms).", feedback: "Hover de tarjetas.", reduced_motion: "Sin escalado de imágenes; transiciones instantáneas."}
      UX_Copy: {cta: "Explorar destinos", secundario: "Sorpréndeme", busqueda_etiqueta: "Buscar destinos, itinerarios y guías", vacio: "Contenido en preparación. Mientras tanto, conoce cómo trabajamos."}

    - NombreVista: "Explorar destinos"
      SCR: "SCR-002"
      Ruta: "/destinos?tipo=&region=&pais=&dificultad_min=&dificultad_max=&mes=&duracion=&presupuesto=&orden=&pagina="
      Plantilla: "TPL-PUB-LIST (con barra lateral de filtros)"
      FLOW: ["FLOW-001", "FLOW-002", "FLOW-006", "FLOW-007", "FLOW-008", "FLOW-009"]
      Purpose: "Descubrir destinos combinando facetas; la URL es compartible."
      Layout: "Cabecera de página (h1 «Explorar destinos», recuento, orden, enlace «Ver en el mapa»*) · fila de filtros activos · barra lateral de filtros (≥ lg) + rejilla · paginación."
      Hierarquia_Visual:
        - "h1 + recuento «{n} destinos» (role=status)."
        - "Controles: Ordenar (select: A-Z · Dificultad: de menor a mayor · Dificultad: de mayor a menor) y «Ver en el mapa»*."
        - "Fichas de filtros activos + «Limpiar filtros»."
        - "Rejilla de CardDestino (24 por página) con Guardar*."
        - "Paginación."
      Filtros:
        - "Tipo de aventura: CheckboxGroup (6 visibles + «Ver los {n} tipos»)."
        - "Región: CheckboxGroup (7)."
        - "País: CheckboxGroup dependiente de las regiones marcadas (sin región: todos, agrupados por región con subtítulos); si una región se desmarca, se quitan sus países y se anuncia."
        - "Dificultad: fieldset «Dificultad» con dos select nativos «Desde» (1-5) y «Hasta» (1-5); si desde > hasta se intercambian al aplicar (DEC-AUTO-067)."
        - "Mes: rejilla de 12 fichas conmutables (checkbox) con abreviatura visible y nombre completo accesible."
        - "Duración: CheckboxGroup 1-3 días · 4-7 días · 8-14 días · 15 días o más."
        - "Presupuesto: CheckboxGroup 1-4 con BudgetMeter compacto + etiqueta de la escala."
      Componentes: ["Breadcrumbs (no aplica: es listado raíz; se omite)", "FilterPanel", "ActiveFilters (Chip)", "ResultCount", "select Ordenar", "CardDestino", "SaveButton*", "Pagination", "EmptyState", "Dialog bottom-sheet"]
      Estados_UI:
        default: "Resultados con recuento."
        loading: "Al cambiar filtros: se mantienen los resultados anteriores atenuados con aria-busy y el recuento muestra «Actualizando…»; si tarda >300 ms, esqueletos en la rejilla (misma altura)."
        empty: "«Ningún destino cumple estos filtros» + botón «Quitar el último filtro ({nombre})» + «Limpiar filtros» + lista de tipos de aventura como enlaces (AC-018)."
        error: "ErrorState en la zona de resultados con Reintentar; filtros siguen operativos."
        offline: "Controles de filtro, orden y paginación con aria-disabled y texto «Sin conexión: los filtros se aplicarán al reconectar»; resultados visibles se conservan."
        invalid_params: "Parámetros inválidos se ignoran sin mensaje de error (AC-113); la URL canónica del listado base se mantiene."
        success: "No aplica."
        disabled: "Ver offline."
        permission_denied: "No aplica."
      Responsive:
        mobile: "Botón fijo bajo la cabecera «Filtros ({n activos})» que abre la hoja inferior modal a pantalla casi completa; dentro, facetas plegables y botón fijo «Ver {n} destinos» que cierra la hoja y lleva el foco al recuento. Orden como select a ancho completo. Rejilla 1 col (< 480) / 2 col."
        tablet: "Igual que mobile con rejilla de 2 columnas; hoja inferior con ancho máximo 640 px centrada."
        desktop: "Barra lateral de 280 px fija con scroll propio (position: sticky, top = cabecera); rejilla de 2 col (lg) / 3 col (xl)."
        large_desktop: "Contenedor 1440 px; rejilla de 3 columnas (se prioriza tamaño de imagen sobre densidad)."
      Accessibility:
        semantics: ["La barra lateral es un form con aria-label «Filtros de destinos» (no role=search)", "Cada faceta fieldset + legend", "Resultados en ul/li"]
        keyboard: ["Tab recorre facetas; Espacio marca; los cambios no mueven el foco", "Quitar ficha → foco al chip siguiente o al recuento"]
        aria: ["Recuento role=status aria-live=polite con retraso de 500 ms", "Hoja inferior: Dialog con aria-labelledby «Filtros»"]
      Motion: {enter: "Hoja inferior sube 240 ms (enter).", transition: "Resultados: fundido de opacidad 160 ms.", feedback: "Casillas 100 ms.", reduced_motion: "Hoja aparece sin desplazamiento (solo opacidad ≤100 ms)."}
      UX_Copy: {h1: "Explorar destinos", recuento: "{n, plural, =0 {Ningún destino} =1 {1 destino} other {# destinos}}", limpiar: "Limpiar filtros", boton_movil: "Ver {n} destinos", vacio_titulo: "Ningún destino cumple estos filtros", vacio_accion: "Quitar el último filtro ({nombre})"}

    - NombreVista: "Mapa de destinos"
      SCR: "SCR-003"
      Ruta: "/destinos/mapa"
      Plantilla: "TPL-PUB-LIST (variante mapa)"
      FLOW: ["FLOW-007"]
      Purpose: "Descubrir destinos por ubicación, con lista alternativa equivalente siempre disponible."
      Layout: "h1 «Mapa de destinos» + barra de presets de región (Mundo · África · América del Norte y Central · América del Sur · Asia · Europa · Oceanía · … según las 7 regiones de DATA) + enlace «Ver como listado con filtros» → SCR-002. Debajo: mapa + lista."
      Cartografia: "Natural Earth 1:110m (dominio público), proyección Equal Earth, pre-simplificada y servida como SVG estático del propio origen (≤120 KB gzip), cargada solo en esta ruta. El SVG es decorativo (aria-hidden); los marcadores son botones HTML posicionados en porcentaje sobre él con coordenadas proyectadas (DEC-AUTO-061)."
      Hierarquia_Visual:
        - "Presets de región (grupo de botones con aria-pressed)."
        - "Mapa con marcadores (círculo 16 px sunset.600 con borde blanco 2 px; área activa 44 px)."
        - "Mini-tarjeta (popover no modal) al activar: nombre, país, DifficultyMeter compacto, «Ver destino»."
        - "Lista alternativa agrupada por región (h2 por región, ul de enlaces con país)."
      Interaccion_Mapa:
        - "Agrupación: marcadores a <32 px entre sí en el nivel de zoom actual se funden en un MapCluster (círculo con número, «5 destinos en América del Sur»); activarlo aplica el preset de su región."
