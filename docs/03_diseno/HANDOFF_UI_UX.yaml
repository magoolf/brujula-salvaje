        - {par: "focus_on_dark #F2A57C / ink.900", ratio: "7.9:1", uso: "indicador de foco", umbral: "3", resultado: "OK"}
        - {par: "sand.50 / ink.900 (pie, franja vista previa)", ratio: "14.87:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "ink.300 #B8C2BC / ink.900", ratio: "8.69:1", uso: "texto", umbral: "4.5", resultado: "OK"}
        - {par: "marcador #C2410C / tierra #E6DED1", ratio: "3.88:1", uso: "objeto gráfico", umbral: "3", resultado: "OK"}
        - {par: "marcador / océano #E1EEF4", ratio: "4.37:1", uso: "objeto gráfico", umbral: "3", resultado: "OK"}
        - {par: "blanco sobre scrim ≥0.78 de #0E1412 con foto blanca debajo (peor caso)", ratio: "≈6.5:1", uso: "texto sobre imagen", umbral: "4.5", resultado: "OK"}
    Temas: "Solo tema claro en el MVP. Soporte obligatorio de forced-colors (modo de alto contraste de Windows): bordes transparentes visibles, foco con outline del sistema, iconos con currentColor (DEC-AUTO-059)."
    Tipografia:
      Display: "Bricolage Grotesque 800, clamp(2.25rem → 4.5rem), interlineado 1.05, tracking -0.02em — solo titular del bloque principal de Inicio"
      Heading: "H1 Bricolage 700 clamp(2rem → 3rem) · H2 Bricolage 700 clamp(1.5rem → 2.125rem) · H3 Bricolage 600 clamp(1.25rem → 1.5rem) · H4 Source Sans 3 700 1.125rem"
      Body: "Source Sans 3 400 1rem/1.6 (UI) · body-lg 1.1875rem/1.65 para lectura larga, medida máxima 68ch"
      Label: "Source Sans 3 600 0.9375rem/1.4"
      Caption: "Source Sans 3 400 0.8125rem/1.45 (pies de foto, créditos); nunca en color deshabilitado"
      Button: "Source Sans 3 600 1rem"
      Overline: "Source Sans 3 700 0.8125rem, tracking 0.08em, mayúsculas por CSS"
      Mono: "Fuentes monoespaciadas del sistema (solo panel: slug, clave TOTP, códigos)"
      Reglas:
        - "Un solo h1 por vista. Sin saltos de nivel de encabezado."
        - "Texto escalable al 200 % sin pérdida (unidades rem; nunca px en font-size)."
        - "Truncado permitido solo en títulos de tarjeta (máx. 3 líneas con line-clamp) y siempre con el título completo en el enlace accesible."
        - "Números tabulares (font-variant-numeric: tabular-nums) en tablas del panel, contadores y datos de itinerario."
        - "Guiones y cortes: hyphens: auto con lang=es en texto corrido; nunca en titulares."
    Fuentes_Autoalojadas:
      decision: "DEC-AUTO-058"
      familias:
        - {familia: "Bricolage Grotesque", licencia: "SIL Open Font License 1.1", formato: "WOFF2 variable (eje wght limitado a 600-800 por instanciado)", subconjunto: "latin (cubre á é í ó ú ü ñ ¿ ¡ « » € y puntuación)", presupuesto: "≤ 45 KB", precarga: "No (font-display: swap con fallback métrico)"}
        - {familia: "Source Sans 3", licencia: "SIL Open Font License 1.1", formato: "WOFF2 variable roman (400-700) + italic (400-700)", subconjunto: "latin", presupuesto: "roman ≤ 55 KB, italic ≤ 50 KB", precarga: "Solo roman (rel=preload, crossorigin, mismo origen)"}
      reglas:
        - "Los archivos se vendorizan en el repositorio del frontend (assets de fuentes) desde el repositorio oficial del proyecto tipográfico, con su OFL.txt; se registra versión y hash. Prohibido Google Fonts u otro CDN en ejecución (CON-003)."
        - "@font-face con font-display: swap y familias de fallback métrico (size-adjust, ascent-override, descent-override calculados en build) para CLS por fuentes = 0."
        - "Máximo 2 archivos de fuente en la ruta crítica; la itálica se descarga solo si hay texto en cursiva visible."
    Spacing_System: "Base 4 px (tokens space.0..24) + space.section fluido clamp(3rem → 6rem). Márgenes de página 16/32/48 px (xs/md/lg); gutters 16/24/24 px; rejilla 4/8/12 columnas."
    Radius_System: "sm 4 (insignias, casillas) · md 8 (controles, tarjetas del panel) · lg 16 (tarjetas e imágenes públicas) · xl 24 (hoja inferior, bloque principal) · pill (fichas de filtro, CTA de acento)."
    Elevation_System: "shadow.1 tarjeta · shadow.2 hover y cabecera con scroll · shadow.3 popovers, menús, mini-tarjeta del mapa · shadow.4 diálogos y cajones. En forced-colors la elevación se sustituye por borde de 1 px."
    Border_System: "hairline 1 px decorativo (border.subtle) · control 1 px (border.control, 3:1) · strong 2 px (botón secundario, seleccionado) · foco 3 px + separación 2 px."
    Z_Index: "base 0 · raised 10 · sticky 100 · dropdown 200 · drawer 300 · modal 400 · banner-offline 450 · status 500 · tooltip 600 · skip-link 700."
    Icon_System: "Lucide (licencia ISC), vendorizado como SVG en línea importado por icono (tree-shaking), trazo 1.75, tamaños 16/20/24/32, color currentColor. Iconos decorativos con aria-hidden=true; iconos solitarios en botón siempre con nombre accesible. Sin fuentes de iconos (DEC-AUTO-066)."
    Imagen:
      decision: "DEC-AUTO-072"
      proporciones: "Bloque principal 16:9 (≥ md) / 4:5 (< md, Inicio) · portada de ficha 16:9 (≥ md) / 4:3 (< md) · tarjeta 4:3 · galería 3:2 · miniatura 1:1."
      recorte: "object-fit: cover con object-position: center (hasta que se resuelva NPD-UX-002, punto focal)."
      responsive: "srcset con los derivados de DEC-AUTO-044 (anchos objetivo 320, 480, 640, 960, 1280, 1600, 1920) en formato moderno (AVIF/WebP según los derivados que genere Backend) y sizes por plantilla (ver PERFORMANCE_SPEC)."
      carga: "La imagen LCP (bloque principal de Inicio, portada de fichas) sin loading=lazy, con fetchpriority=high y preload responsivo. Todo lo demás: loading=lazy + decoding=async."
      placeholder: "Fondo bg.sunken + width/height o aspect-ratio reservados. Sin blur-up generado por JS."
      fallo: "Si una imagen no carga (ALT-009): el contenedor conserva su tamaño, muestra el texto alternativo en caption sobre bg.sunken y el crédito sigue visible."
      credito: "Todo medio visible en el sitio público muestra el crédito (autor + licencia) en su pie o, en tarjetas, está disponible en la ficha y en SCR-021."

  PLANTILLAS:
    - id: "TPL-PUB-HOME"
      uso: ["SCR-001"]
      estructura: "GI-01 cabecera → main (bloque principal a sangre + secciones apiladas con space.section) → GI-02 pie."
    - id: "TPL-PUB-LIST"
      uso: ["SCR-002", "SCR-006", "SCR-008", "SCR-010", "SCR-011", "SCR-013", "SCR-015", "SCR-016", "SCR-017", "SCR-018", "SCR-019", "SCR-021", "SCR-022"]
      estructura: "Cabecera de página (migas si procede, h1, entradilla opcional, recuento role=status) → barra de herramientas (orden, vistas) → rejilla o lista → paginación → bloque de salida."
      rejilla: "Tarjetas: 1 col < 480 · 2 col 480-1023 · 3 col ≥ 1024 · 4 col ≥ 1536 (sin barra lateral). Con barra lateral de filtros: 2 col 1024-1279 · 3 col ≥ 1280."
    - id: "TPL-PUB-DETAIL"
      uso: ["SCR-004", "SCR-007", "SCR-009", "SCR-014"]
      estructura: "Migas → encabezado (h1, metadatos, acciones Guardar*/Compartir*/Imprimir*) → portada → datos clave → cuerpo en 8/12 col + columna lateral 4/12 fija (índice En esta página) desde lg → bloques de credibilidad (fuentes, autoría, descargo) → Sigue explorando."
    - id: "TPL-PUB-ARTICLE"
      uso: ["SCR-012", "SCR-020"]
      estructura: "Migas → h1 + metadatos → cuerpo de lectura (body-lg, medida 68ch, centrado) con índice lateral desde xl → fuentes/autoría/descargo → Sigue explorando (solo SCR-012)."
    - id: "TPL-PUB-ERROR"
      uso: ["SCR-023", "SCR-024", "SCR-025"]
      estructura: "Cabecera y pie completos (SCR-025: cabecera y pie estáticos, sin datos) → ilustración de brújula SVG decorativa en línea → h1 → explicación → acciones → rutas de salida."
    - id: "TPL-PANEL-AUTH"
      uso: ["SCR-030", "SCR-031", "SCR-033", "SCR-032 (modo cambio obligatorio)"]
      estructura: "Fondo bg.canvas-panel, tarjeta centrada size.auth-card (SCR-033: dialog-md), logotipo + etiqueta Panel editorial, sin navegación lateral. Solo acción Cerrar sesión cuando hay sesión."
    - id: "TPL-PANEL-SHELL"
      uso: ["SCR-034", "SCR-035", "SCR-036", "SCR-039", "SCR-040", "SCR-042", "SCR-043", "SCR-044", "SCR-045", "SCR-046", "SCR-047", "SCR-048", "SCR-032 (modo normal)"]
      estructura: "Barra superior (56 px: marca, título de sección, menú de usuario) + barra lateral (248 px, colapsable a iconos con etiqueta en tooltip desde lg; cajón modal < lg) + área principal (máx. 1280 px) con cabecera de página (h1, acciones primarias a la derecha) y contenido."
    - id: "TPL-PANEL-FULL"
      uso: ["SCR-037"]
      estructura: "Franja fija VISTA PREVIA – NO PUBLICADO + plantilla pública correspondiente a pantalla completa."

  COMPONENTES:
    # Nivel Primitive -> Component -> Pattern -> Feature (Skill_UI_UX §13). Estados según matriz §14.
    - Nombre: "Button"
      Tipo: "Primitive"
      Reutilizable: true
      Variantes: ["primary (verde bosque)", "accent (atardecer, pill; 1 por vista)", "secondary (contorno 2 px)", "ghost / tertiary", "danger", "ghost-inverse (sobre foto o fondo oscuro)"]
      Tamanos: ["sm 36 px (solo panel con pointer: fine)", "md 44 px (defecto)", "lg 52 px (CTA del bloque principal)"]
      Estados: ["default", "hover", "focus-visible (anillo 3 px + separación 2 px)", "pressed (translateY 1 px, sin animación con reduced-motion)", "disabled (bg/fg/border disabled; aria-disabled cuando debe seguir siendo enfocable para explicar el motivo)", "loading (spinner + etiqueta cambia a gerundio: Publicando…; aria-busy; no clicable)"]
      Interacciones: ["Nunca solo icono sin nombre accesible", "Etiqueta con verbo en infinitivo", "Doble clic protegido: se deshabilita durante la operación (ALT-017)"]
      Dependencias_Visuales: ["color.action.*", "typography.button", "radius.md / radius.pill", "size.control-*"]
    - Nombre: "IconButton"
      Tipo: "Primitive"
      Reutilizable: true
      Variantes: ["ghost", "secondary", "inverse"]
      Estados: ["default", "hover", "focus-visible", "pressed", "disabled", "toggled (aria-pressed)"]
      Interacciones: ["Área mínima 44×44 (24×24 absoluto en tablas del panel con pointer: fine)", "aria-label obligatorio", "Tooltip visual con el mismo texto al hover y al foco"]
