    - {id: "RSK-UX-002", riesgo: "Hidratación de estado solo del cliente (Guardados, offline) produce saltos de maquetación o desajustes de hidratación", severidad: "LOW", mitigacion: "Espacios reservados y renderizado de esos elementos solo tras hidratar"}
    - {id: "RSK-UX-003", riesgo: "El contraste se calculó sobre los HEX; composiciones reales (texto sobre fotografías, estados hover) podrían degradarlo", severidad: "LOW", mitigacion: "Scrim obligatorio y verificación axe + revisión visual en F8"}
    - {id: "RSK-UX-004", riesgo: "Sin fotografía real verificable (GAP-007) la dirección «fotografía protagonista» pierde fuerza", severidad: "MEDIUM", mitigacion: "Ilustración de marca de respaldo y revisión en VAL-001"}
    - {id: "RSK-UX-005", riesgo: "El editor de texto enriquecido supera el presupuesto del panel", severidad: "LOW", mitigacion: "Carga solo en SCR-036; excepción documentada ≤350 KB gzip"}

