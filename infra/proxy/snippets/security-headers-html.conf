# Cabeceras de seguridad para el HTML del SSR y sus assets (THREAT-014/015, HANDOFF_UI_UX RSK-UX-001).
# CSP para scripts ESTRICTA: sin 'unsafe-inline' ni 'unsafe-eval'; un script en línea solo se ejecuta
# con el nonce por petición ($request_id, 128 bits) que el proxy envía al SSR en X-CSP-Nonce
# (Skill_Frontend §27.4, RSK-UX-001, DEC-AUTO-146). Validado en F6 con un fixture Angular 22.2 SSR:
# con el inlining de CSS crítico desactivado, el HTML no contiene scripts en línea ejecutables.
# style-src admite 'unsafe-inline' (el estándar solo lo prohíbe para scripts): los estilos de componente
# que Angular inserta en el cliente tras la hidratación y los style="" de Angular CDK no llevan nonce;
# con un nonce en style-src los navegadores ignorarían 'unsafe-inline' y los bloquearían.
# Sin CDN ni terceros (CON-003): fuentes, imágenes y API en 'self'. blob:/data: en img-src para
# las previsualizaciones de subida del panel y los QR generados en cliente (ADR-API-001 §7).
# HSTS NO se emite en local (HTTP); en producción lo añade el borde TLS (DEC-004, Puerta Humana).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
