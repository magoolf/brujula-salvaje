# Cabeceras hacia los upstreams (backend y frontend). Incluir en cada location con proxy_pass.
# X-Forwarded-For se SOBRESCRIBE con la IP del cliente (nunca se concatena la cabecera recibida):
# Django confía en exactamente 1 proxy (NUM_PROXIES=1, ADR-API-002 §9, DEC-AUTO-111) y el SSR
# de Angular reenvía esta misma cabecera sin modificarla al llamar a la API.
proxy_set_header Connection        "";
# $http_host conserva el puerto publicado (localhost:8080) para CSRF/URLs absolutas; Django valida
# ALLOWED_HOSTS y el SSR valida NG_ALLOWED_HOSTS, así que un Host arbitrario se rechaza aguas abajo.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header traceparent       $traceparent_out;
