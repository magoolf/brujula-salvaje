# Cabeceras de las respuestas de error que genera el PROPIO proxy (Problem Details de /_errores_proxy/*),
# alineadas con las "Cabeceras globales" del contrato (THREAT-014/015) y con las que emite Django
# (API_CONTENT_SECURITY_POLICY, CabecerasSeguridadMiddleware). OBS-QA-OPS003-03, DEC-AUTO-212 (TKT-OPS-004).
# nginx no hereda add_header de niveles superiores si la location define alguno: incluir en CADA
# location /_errores_proxy/* (junto a sus cabeceras propias, p. ej. Retry-After).
add_header X-Trace-Id $trace_id_borde always;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
