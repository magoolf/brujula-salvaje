# =============================================================================
# Reverse proxy de MISMO ORIGEN — Brújula Salvaje (TKT-F6-001, Skill_devops F6)
#   /api/**          -> Django (backend:8000)          [ADR-API-001: sesión + CSRF, mismo origen]
#   /health/live|ready -> Django                       [contrato: fuera de la versión]
#   /media/publico/** -> volumen de medios (solo derivados de medios DISPONIBLES, DEC-AUTO-110/147)
#   /**              -> SSR de Angular (frontend:4000)
# Imagen: nginxinc/nginx-unprivileged (uid 101, puerto 8080, sin root).
# Privacidad (REQ-057, THREAT-020): los logs NO contienen IP completas ni query strings.
# CSP estricta sin 'unsafe-inline' con nonce por petición (RSK-UX-001, DEC-AUTO-146).
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
# Nivel "crit": los mensajes de nivel error/warn de nginx incluyen la IP completa del cliente y la
# línea de petición con query string (REQ-057, THREAT-020; DEC-AUTO-148). El diagnóstico de 4xx/5xx
# se hace con el access log JSON (estado, upstream_s). Para depurar en local: bajar a "error" temporalmente.
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Directorios temporales escribibles por uid 101 (raíz de solo lectura + tmpfs /tmp)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65s;
  charset utf-8;

  # text/javascript: tipo con el que el SSR (Express) sirve los bundles .js/.mjs (RFC 9239). Sin él el
  # JS viajaba sin comprimir (F-01 QA TKT-002, LCP móvil; TKT-OPS-003, DEC-AUTO-191).
  # gzip_proxied any: comprime también si un balanceador/CDN intermedio añade "Via" (producción).
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json application/problem+json application/manifest+json image/svg+xml text/plain application/xml;

  # --- IP truncada para logs (/24 IPv4, /48 IPv6; REQ-057) ---------------------
  # IPv6: no se registra ningún fragmento (más estricto que /48; evita errores con notación comprimida).
  map $remote_addr $ip_truncada {
    ~^(?<p4>\d+\.\d+\.\d+)\.\d+$  "${p4}.0/24";
    ~:                               "ipv6-omitida";
    default                          "desconocida";
  }

  # $uri (sin query string): el texto buscado no llega a los logs (THREAT-020).
  # $request_id = X-Trace-Id candidato cuando el cliente no envía traceparent.
  # ruta_pedida: ruta ORIGINAL sin query string. "ruta" ($uri) cambia tras una redirección interna
  # (un 429 se registra como /_errores_proxy/429) y no permite saber qué recurso se limitó
  # (TKT-OPS-016, ADR-OPS-001). Se corta en el primer "?": el texto buscado nunca llega al log.
  map $request_uri $ruta_pedida {
    "~^(?<p>[^?]*)" $p;
    default         "";
  }

  log_format brujula_json escape=json
    '{"ts":"$time_iso8601","ip":"$ip_truncada","metodo":"$request_method",'
    '"ruta":"$uri","ruta_pedida":"$ruta_pedida","estado":$status,"bytes":$body_bytes_sent,'
    '"duracion_s":$request_time,"upstream_s":"$upstream_response_time",'
    '"request_id":"$request_id","ua":"$http_user_agent"}';
  access_log /dev/stdout brujula_json;

  # traceparent W3C: se propaga el del cliente o se genera uno con $request_id (32 hex).
  # Solo se acepta un traceparent con formato W3C válido; cualquier otro valor se sustituye.
  map $http_traceparent $traceparent_out {
    "~^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$" $http_traceparent;
    default "00-${request_id}-${upstream_span}-01";
  }
  map $request_id $upstream_span {
    "~^(?<s>[0-9a-f]{16})" $s;
    default "0000000000000001";
  }
  # trace_id (32 hex) de la petición: el mismo que recibe el backend en traceparent y devuelve en
  # X-Trace-Id. Se usa en las respuestas que emite el propio proxy (429, DEC-AUTO-190).
  map $traceparent_out $trace_id_borde {
    "~^00-(?<t>[0-9a-f]{32})-" $t;
    default $request_id;
  }

  # Límite por IP en el borde (defensa en profundidad; el límite fino es DRF, DEC-AUTO-111).
  # El 429 se responde como Problem Details (location interna /_errores_proxy/429), no con la página HTML de nginx.
  #   por_ip: todo el servidor (20 r/s, burst 60) salvo /health/live|ready y los assets (zona estaticos).
  #   salud:  SOLO /health/live|ready, zona propia y holgada (50 r/s, burst 200) para que los sondeos
  #           de un balanceador nunca compitan con el cupo de /api ni reciban 429, pero una sola IP no
  #           pueda martillear /health/ready (consulta la BD) sin límite (RSK-OPS-016, DEC-AUTO-214;
  #           sustituye a la exclusión total de DEC-AUTO-193). Un limit_req en la location anula el
  #           heredado del servidor: /health solo cuenta contra "salud".
  # Cache-Control de lo que sirve el SSR (OBS-QA002-C2-04, TKT-OPS-005, DEC-AUTO-223): el HTML lleva
  # un nonce de CSP por petición y puede contener datos de sesión del panel -> "no-store" SIEMPRE
  # (también en las páginas de error HTML del SSR), sin importar lo que envíe el upstream. El resto
  # (JS/CSS con hash, fuentes, iconos) conserva el Cache-Control que fije el SSR.
  map $upstream_http_content_type $cache_control_ssr {
    "~*^text/html"  "no-store";
    default         $upstream_http_cache_control;
  }

  #   estaticos: SOLO assets del build en la raíz (/*.js, /*.mjs, /*.css), /fonts/*.woff2, /favicon.ico
  #           y /media/publico/** (TKT-OPS-016, ADR-OPS-001). 50 r/s, burst 300 por IP.
  #           Una carga en frío legítima son ~35 peticiones de assets: con por_ip (burst 60) 2-3
  #           visitantes tras la misma IP (NAT/CGNAT) agotaban el cupo y el 429 caía sobre los chunks
  #           lazy de Angular (navegación rota). /api/** y el HTML del SSR siguen en por_ip.
  #           Un asset inexistente NO llega a renderizarse en el SSR: ver la location de assets.
  # X-Robots-Tag del panel (RULE-029, DEC-AUTO-929): noindex por cabecera en /panel y /panel/**;
  # vacío (nginx no emite la cabecera) en el resto de rutas públicas.
  map $uri $x_robots_borde {
    "~^/panel(?:/|$)"  "noindex, nofollow";
    default            "";
  }

  limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=salud:1m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=estaticos:10m rate=50r/s;
  limit_req_status 429;

  upstream backend  { server backend:8000;  keepalive 16; }
  upstream frontend { server frontend:4000; keepalive 16; }

  # Healthcheck interno del contenedor (solo loopback; no se publica).
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health { default_type text/plain; return 200 "ok
"; }
    location / { return 404; }
  }

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Cuerpo por defecto: 2 MB (JSON del panel; texto enriquecido <= 100.000 caracteres)
    client_max_body_size 2m;
    # Línea de petición y cada cabecera <= 4 KB (total 16 KB, igual que el límite por defecto de
    # Node para el SSR): el borde rechaza ANTES que gunicorn (limit_request_line 4094, que responde
    # en text/html) y así el error sale como Problem Details (DEC-AUTO-195).
    large_client_header_buffers 4 4k;
    limit_req zone=por_ip burst=60 nodelay;
    error_page 429 =429 /_errores_proxy/429;

    # 429 del borde conforme al contrato (components.responses.LimiteTasa): application/problem+json,
    # code limite_tasa, X-Trace-Id y Retry-After (HALLAZGO-QA-OPS002-02, DEC-AUTO-190).
    # "type" usa el valor por defecto de PROBLEM_TYPE_BASE_URL (nginx.conf es estático): si en un
    # entorno se cambia esa variable, debe cambiarse también aquí (RSK-OPS-190).
    # Retry-After 1: las zonas reponen 20 (por_ip) y 50 (salud, estaticos) peticiones/s: en 1 s vuelve a haber cupo.
    # Cabeceras de seguridad en TODOS los errores del proxy: snippets/security-headers-error.conf
    # (OBS-QA-OPS003-03, DEC-AUTO-212).
    location = /_errores_proxy/429 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      add_header Retry-After "1" always;
      return 429 '{"type":"https://brujulasalvaje.example/errors/limite_tasa","title":"Demasiadas peticiones","status":429,"detail":"Has superado el límite de peticiones. Inténtalo más tarde.","code":"limite_tasa","trace_id":"$trace_id_borde"}';
    }

    # Resto de errores que genera el PROPIO proxy (no los del upstream: proxy_intercept_errors off),
    # también como Problem Details del catálogo (DEC-AUTO-194). Sin esto nginx responde text/html
    # (p. ej. 414 con una query muy larga) y schemathesis falla content_type_conformance.
    #   400/414/494 (petición, URI o cabeceras no procesables) -> 400 parametro_invalido (con
    #     "errors" porque varios 400 del contrato son ProblemaValidacion)
    #   413 (cuerpo > client_max_body_size)                     -> 413 carga_demasiado_grande
    #   502/503/504 (upstream caído o sin respuesta)            -> 503 servicio_no_disponible
    #   403 (limit_except ... deny all: método no admitido en SSR o medios) -> 403 permiso_denegado
    #   404 ("return 404" del proxy y medios inexistentes)      -> 404 no_encontrado
    #   405 (PUT/DELETE/PATCH/POST sobre un archivo de /media/publico: el módulo estático de nginx
    #     responde 405) -> 405 metodo_no_permitido con "Allow: GET, HEAD". Antes salía text/html con
    #     el Cache-Control immutable de la imagen (OBS-QA-OPS004-03, TKT-OPS-006, DEC-AUTO-253); la
    #     redirección interna cambia de location, así que ya no hereda las cabeceras de la imagen.
    # (OBS-QA-OPS003-04, DEC-AUTO-213). Los 403/404 del SSR o de Django NO pasan por aquí
    # (proxy_intercept_errors off): los emiten ellos mismos.
    error_page 400 414 494 =400 /_errores_proxy/400;
    error_page 403 =403 /_errores_proxy/403;
    error_page 404 =404 /_errores_proxy/404;
    error_page 405 =405 /_errores_proxy/405;
    error_page 413 =413 /_errores_proxy/413;
    error_page 502 503 504 =503 /_errores_proxy/503;

    location = /_errores_proxy/400 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      return 400 '{"type":"https://brujulasalvaje.example/errors/parametro_invalido","title":"Parámetro inválido","status":400,"detail":"Algún parámetro de la petición no es válido.","code":"parametro_invalido","errors":{"_general":["La petición es demasiado larga o no es válida."]},"trace_id":"$trace_id_borde"}';
    }
    location = /_errores_proxy/403 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      return 403 '{"type":"https://brujulasalvaje.example/errors/permiso_denegado","title":"Permiso denegado","status":403,"detail":"No tienes permiso para realizar esta acción.","code":"permiso_denegado","trace_id":"$trace_id_borde"}';
    }
    location = /_errores_proxy/404 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      return 404 '{"type":"https://brujulasalvaje.example/errors/no_encontrado","title":"No encontrado","status":404,"detail":"El recurso solicitado no existe.","code":"no_encontrado","trace_id":"$trace_id_borde"}';
    }
    location = /_errores_proxy/405 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      add_header Allow "GET, HEAD" always;
      return 405 '{"type":"https://brujulasalvaje.example/errors/metodo_no_permitido","title":"Método no permitido","status":405,"detail":"El método no está permitido en este recurso.","code":"metodo_no_permitido","trace_id":"$trace_id_borde"}';
    }
    location = /_errores_proxy/413 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      return 413 '{"type":"https://brujulasalvaje.example/errors/carga_demasiado_grande","title":"Carga demasiado grande","status":413,"detail":"La petición supera el tamaño permitido.","code":"carga_demasiado_grande","trace_id":"$trace_id_borde"}';
    }
    location = /_errores_proxy/503 {
      internal;
      default_type application/problem+json;
      include /etc/nginx/snippets/security-headers-error.conf;
      add_header Retry-After "5" always;
      return 503 '{"type":"https://brujulasalvaje.example/errors/servicio_no_disponible","title":"Servicio no disponible","status":503,"detail":"El servicio no está disponible en este momento.","code":"servicio_no_disponible","trace_id":"$trace_id_borde"}';
    }

    # Cabeceras hacia los upstreams: snippets/proxy-headers.conf se incluye en CADA location
    # que hace proxy_pass (nginx no hereda proxy_set_header si la location define alguno).
    proxy_http_version 1.1;

    # ---------- API Django (las cabeceras de seguridad las emite Django, contrato) ----------
    location /api/ {
      include /etc/nginx/snippets/proxy-headers.conf;
      proxy_set_header X-CSP-Nonce "";
      proxy_pass http://backend;
      proxy_read_timeout 30s;
    }

    # Subida de medios: 1-10 archivos, > 105 MB -> 413 (ADR-API-002 §8); proceso síncrono.
    location = /api/v1/panel/medios {
      client_max_body_size 105m;
      proxy_request_buffering on;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      include /etc/nginx/snippets/proxy-headers.conf;
      proxy_set_header X-CSP-Nonce "";
      proxy_pass http://backend;
    }

    # Zona propia "salud" (RSK-OPS-016, DEC-AUTO-214): 50 r/s + burst 200 sin retardo por IP.
    location = /health/live  { limit_req zone=salud burst=200 nodelay; include /etc/nginx/snippets/proxy-headers.conf; proxy_pass http://backend; access_log off; }
    location = /health/ready { limit_req zone=salud burst=200 nodelay; include /etc/nginx/snippets/proxy-headers.conf; proxy_pass http://backend; access_log off; }
    location /health/ { return 404; }

    # ---------- Medios públicos (derivados de medios DISPONIBLES) ----------
    # El volumen de medios se monta en /srv/media (solo lectura); solo se expone publico/.
    # Zona "estaticos" (ADR-OPS-001): nginx sirve el archivo o responde 404 él mismo (sin upstream).
    location /media/publico/ {
      limit_req zone=estaticos burst=300 nodelay;
      root /srv;
      limit_except GET HEAD { deny all; }
      autoindex off;
      disable_symlinks on;
      # Solo imágenes; cualquier otra extensión -> 404
      location ~* ^/media/publico/[A-Za-z0-9/_-]+\.(avif|webp|jpe?g)$ {
        include /etc/nginx/snippets/security-headers-static.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
      }
      return 404;
    }
    # Cualquier otra ruta de medios (originales, privados) nunca se sirve.
    location /media/ { return 404; }

    # ---------- Assets del build de Angular (zona "estaticos", ADR-OPS-001) ----------
    # Solo archivos de la RAÍZ con extensión de asset (main-*.js, chunk-*.js, polyfills-*.js,
    # styles-*.css), /fonts/*.woff2 y /favicon.ico. Los sirve express.static del SSR.
    # Defensa frente a la evasión (AC_OPS016_03): un asset INEXISTENTE cae en express.static al
    # motor de Angular, que renderizaría la página 404 (coste de SSR) con un cupo más holgado que
    # el de por_ip. Para impedirlo, esta location envía al SSR un Host fuera de NG_ALLOWED_HOSTS
    # (".invalid", RFC 2606): express.static ignora el Host y sirve el archivo si existe; si no
    # existe, AngularNodeAppEngine rechaza el Host con 400 SIN renderizar (medido: ~6 ms frente a
    # ~40-600 ms de un render) y el proxy lo convierte en 404 Problem Details.
    # REQUISITO OPERATIVO: NG_ALLOWED_HOSTS nunca debe admitir "*" ni "*.invalid" (RSK-OPS-040).
    # nginx no hereda error_page del servidor si la location define alguno: se redefinen todos los
    # que pueden darse aquí (403 limit_except, 429 zona, 400/404 y 5xx del upstream).
    location ~ "^/(?:[A-Za-z0-9_-]+\.(?:js|mjs|css)|fonts/[A-Za-z0-9_-]+\.woff2|favicon\.ico)$" {
      limit_req zone=estaticos burst=300 nodelay;
      limit_except GET HEAD { deny all; }
      # Sin snippets/proxy-headers.conf: fija Host $http_host y aquí el Host debe ser el inválido.
      # Ni X-Forwarded-For ni X-CSP-Nonce: un archivo estático no los usa.
      proxy_set_header Connection        "";
      proxy_set_header Host              "estaticos.invalid";
      proxy_set_header X-Forwarded-Host  "estaticos.invalid";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id      $request_id;
      proxy_set_header traceparent       $traceparent_out;
      proxy_pass http://frontend;
      proxy_read_timeout 30s;
      proxy_intercept_errors on;
      error_page 400 404 =404 /_errores_proxy/404;
      error_page 403 =403 /_errores_proxy/403;
      error_page 429 =429 /_errores_proxy/429;
      error_page 500 502 503 504 =503 /_errores_proxy/503;
      # Mismas cabeceras que antes recibían estos assets por la location "/" (sin regresión).
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Powered-By;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $cache_control_ssr always;
      include /etc/nginx/snippets/security-headers-html.conf;
    }

    # ---------- SSR de Angular (HTML y cualquier otra ruta; zona por_ip) ----------
    location / {
      limit_except GET HEAD { deny all; }
      include /etc/nginx/snippets/proxy-headers.conf;
      # Nonce de CSP por petición (16 bytes aleatorios): lo genera SOLO el proxy y el SSR
      # lo aplica con CSP_NONCE / ngCspNonce (RSK-UX-001, DEC-AUTO-146).
      proxy_set_header X-CSP-Nonce $request_id;
      proxy_pass http://frontend;
      proxy_read_timeout 30s;
      # Las cabeceras de seguridad del HTML se fijan aquí (el SSR no las emite).
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Powered-By;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $cache_control_ssr always;
      # Solo /panel y /panel/** (valor vacío = sin cabecera en las rutas públicas). DEC-AUTO-929.
      add_header X-Robots-Tag $x_robots_borde always;
      include /etc/nginx/snippets/security-headers-html.conf;
    }
  }
}
