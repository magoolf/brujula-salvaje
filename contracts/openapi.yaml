  /api/v1/publico/destinos:
    get:
      tags: [publico-destinos]
      operationId: publicoListarDestinos
      summary: Listar y filtrar destinos publicados (24 por página)
      description: >-
        OR dentro de una faceta y AND entre facetas; dificultad como rango; tramos de duración por
        solapamiento; orden por defecto A-Z según el alfabeto español sin tildes (RULE-019, DEC-AUTO-047).
        Valores contra dominios cerrados: slug inexistente, rango inválido (dificultad_min > dificultad_max)
        o parámetro desconocido devuelven 400 `parametro_invalido` (AC-113, THREAT-008). El Frontend
        descarta los parámetros inválidos antes de llamar (la UI los ignora).
      security: []
      x-trazabilidad: [FEAT-003, FEAT-004, FEAT-018, SCR-002, SCR-016, AP-02, RULE-001, RULE-011, RULE-019, AC-012, AC-017, AC-018, AC-113]
      x-amenazas: [THREAT-008, THREAT-009, THREAT-011, THREAT-023]
      x-limite-tasa: publico-lectura
      x-tamano-pagina: 24
      parameters:
        - name: tipo
          in: query
          description: Slugs de tipos de aventura (OR). Repetible `?tipo=a&tipo=b`.
          style: form
          explode: true
          schema: {type: array, maxItems: 12, uniqueItems: true, items: {$ref: '#/components/schemas/Slug'}}
        - name: region
          in: query
          schema: {$ref: '#/components/schemas/Slug'}
        - name: pais
          in: query
          schema: {$ref: '#/components/schemas/Slug'}
        - name: dificultad_min
          in: query
          schema: {$ref: '#/components/schemas/Dificultad'}
        - name: dificultad_max
          in: query
          schema: {$ref: '#/components/schemas/Dificultad'}
        - name: mes
          in: query
          schema: {$ref: '#/components/schemas/Mes'}
        - name: duracion
          in: query
          description: Tramos de duración (OR).
          style: form
          explode: true
          schema: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/TramoDuracion'}}
        - name: presupuesto
          in: query
          description: Niveles de presupuesto (OR).
          style: form
          explode: true
          schema: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/Presupuesto'}}
        - name: orden
          in: query
          schema: {type: string, enum: [nombre, dificultad_asc, dificultad_desc], default: nombre}
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de destinos con total de resultados.
          headers:
            Cache-Control: {$ref: '#/components/headers/Cache-Control-Publico'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaginaDestinoTarjeta'}
        '400': {$ref: '#/components/responses/Validacion'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteTasa'}
        '500': {$ref: '#/components/responses/ErrorInterno'}
  /api/v1/publico/destinos/mapa:
    get:
      tags: [publico-destinos]
      operationId: publicoListarDestinosMapa
      summary: Lista ligera de destinos con coordenadas (mapa y lista alternativa)
      security: []
      x-trazabilidad: [FEAT-005, SCR-003, AP-04, RULE-023, AC-023]
