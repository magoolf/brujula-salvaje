  # ---------------------------------------------------------------- PANEL: AUTENTICACIÓN (ADR-API-001)
  /api/v1/panel/auth/csrf:
    get:
      tags: [panel-auth]
      operationId: panelObtenerCsrf
      summary: Emite la cookie csrftoken antes del login
      description: Única operación sin sesión que fija cookie; solo la invoca el SPA del panel (RULE-029).
      security: []
      x-trazabilidad: [FEAT-029, RULE-029]
      x-amenazas: [THREAT-003]
      x-limite-tasa: panel-login
      responses:
        '204':
          description: Cookie `csrftoken` emitida (Secure, SameSite=Lax, Path=/, no HttpOnly para que Angular la lea).
          headers:
            Set-Cookie: {$ref: '#/components/headers/Set-Cookie-Csrf'}
        '429': {$ref: '#/components/responses/LimiteTasa'}
        '500': {$ref: '#/components/responses/ErrorInterno'}
  /api/v1/panel/auth/login:
    post:
      tags: [panel-auth]
      operationId: panelIniciarSesion
      summary: Iniciar sesión (usuario y contraseña)
      description: >-
        Mensaje y tiempo de respuesta equivalentes para usuario inexistente o contraseña errónea
        (THREAT-018). El contador de fallos se lleva por usuario normalizado exista o no la cuenta
        (DEC-AUTO-102): 5 fallos, bloqueo de 15 min progresivo, respuesta 429 `acceso_bloqueado_temporalmente`
        con Retry-After. En éxito rota el identificador de sesión (THREAT-002) y devuelve el paso pendiente
        (MFA, CONFIGURAR_MFA, CAMBIO_CREDENCIAL, AUTORIZACION o NINGUNO). `siguiente` solo se acepta si es
        una ruta relativa bajo `/panel/`; si no, `redireccion` = `/panel` (AC-115). Audita LOGIN_OK,
        LOGIN_FALLIDO, BLOQUEO. El cuerpo de la petición nunca se registra (THREAT-020).
      security:
        - csrfToken: []
      x-trazabilidad: [FEAT-029, SCR-030, FLOW-010, STATE-003, STATE-004, RULE-017, AC-029, AC-056, AC-115]
      x-amenazas: [THREAT-001, THREAT-002, THREAT-003, THREAT-017, THREAT-018, THREAT-020, THREAT-027]
      x-limite-tasa: panel-login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginEntrada'}
      responses:
        '200':
          description: Credenciales válidas. Sesión creada (completa o parcial según `paso_pendiente`).
          headers:
            Set-Cookie: {$ref: '#/components/headers/Set-Cookie-Sesion'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SesionEstado'}
        '400': {$ref: '#/components/responses/Validacion'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/PermisoDenegado'}
        '429': {$ref: '#/components/responses/LimiteTasa'}
        '500': {$ref: '#/components/responses/ErrorInterno'}
  /api/v1/panel/auth/mfa/verificar:
    post:
      tags: [panel-auth]
      operationId: panelVerificarMfa
      summary: Segundo factor (TOTP o código de recuperación)
      description: Solo en sesión parcial (paso MFA). Un código inválido cuenta como intento fallido (FEAT-030). En éxito rota la sesión.
      security:
