      operationId: panelSubirMedios
      summary: Subir 1..10 imágenes (resultado por archivo)
      description: >-
        Procesamiento síncrono (sin broker, ADR-DB-005). Por archivo: verificación del tipo por contenido
        (JPEG, PNG o WebP; nunca SVG), ≤10 MB, lado mayor ≥1200 px, ≤40 MP comprobados antes de decodificar
        por completo, re-codificación que elimina EXIF/XMP/IPTC, derivados responsivos (AVIF, WebP, JPEG),
        huella SHA-256 para duplicados y nombres de archivo generados por el sistema, almacenados fuera de
        rutas ejecutables. Un archivo rechazado no se almacena. Respuesta 200 aunque todos se rechacen
        (el detalle va en cada `resultado`). Petición con 0 o más de 10 archivos: 400. Petición >105 MB: 413.
        Audita SUBIR_MEDIO por archivo aceptado.
      security:
        - sesionPanel: []
          csrfToken: []
      x-roles: [EDITOR, ADMINISTRADOR]
      x-trazabilidad: [FEAT-041, SCR-039, SCR-041, FLOW-013, DEC-AUTO-044, AC-103]
