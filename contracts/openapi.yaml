      tags: [publico-destinos]
      operationId: publicoObtenerDestino
      summary: Ficha de destino por slug
      description: >-
        Solo PUBLICADO. Inexistente o borrador nunca publicado: 404. Retirado: 410 con alternativas y sin
        el cuerpo del contenido (DEC-AUTO-040, DEC-AUTO-113). Los slugs `mapa` y `aleatorio` están
        reservados (DEC-AUTO-117).
      security: []
      x-trazabilidad: [FEAT-006, FEAT-007, FEAT-013, FEAT-014, FEAT-015, SCR-004, SCR-005, AP-03, RULE-006, AC-014, AC-015, AC-100, AC-102]
      x-amenazas: [THREAT-011, THREAT-019, THREAT-023]
      x-limite-tasa: publico-lectura
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Ficha de destino.
          headers:
            Cache-Control: {$ref: '#/components/headers/Cache-Control-Publico'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DestinoDetalle'}
        '400': {$ref: '#/components/responses/Validacion'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '410': {$ref: '#/components/responses/Retirado'}
        '429': {$ref: '#/components/responses/LimiteTasa'}
        '500': {$ref: '#/components/responses/ErrorInterno'}
  /api/v1/publico/itinerarios:
    get:
      tags: [publico-itinerarios]
      operationId: publicoListarItinerarios
      summary: Listar itinerarios publicados (24 por página)
      security: []
