        '500': {$ref: '#/components/responses/ErrorInterno'}
  /api/v1/publico/meses:
    get:
      tags: [publico-general]
      operationId: publicoObtenerMeses
      summary: Doce meses con número de destinos y un destacado por mes
      description: Colección acotada por diseño (exactamente 12 elementos, DEC-AUTO-104). Los destinos de un mes se obtienen con `GET /api/v1/publico/destinos?mes=N` (RULE-011).
      security: []
      x-trazabilidad: [FEAT-018, SCR-015, SCR-016, AP-09, RULE-011, AC-036]
      x-prioridad: SHOULD
      x-limite-tasa: publico-lectura
