        '403': {$ref: '#/components/responses/PermisoDenegado'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteTasa'}
        '500': {$ref: '#/components/responses/ErrorInterno'}

components:
  securitySchemes:
    sesionPanel:
      type: apiKey
      in: cookie
      name: sessionid
      description: >-
        Cookie de sesión Django. HttpOnly; Secure; SameSite=Lax; Path=/api/v1/panel/. Solo la emiten
        operaciones del panel. Inactividad 30 min, máximo absoluto 12 h (ADR-API-001, DEC-AUTO-049/101).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: >-
        Token anti-CSRF obligatorio en toda operación de cambio (POST/PUT/PATCH/DELETE) del panel,
        incluido el login. Se lee de la cookie `csrftoken` (Secure; SameSite=Lax; Path=/; no HttpOnly) con
        `withXsrfConfiguration` de Angular. Fallo de CSRF → 403 `csrf_invalido` en problem+json.
  headers:
    X-Trace-Id:
      description: Identificador de traza W3C (32 hex). Igual al `trace_id` del cuerpo y del log.
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    Retry-After:
      description: Segundos hasta poder reintentar.
      schema: {type: integer, minimum: 1}
    Cache-Control-Publico:
      description: Lecturas públicas cacheables.
      schema: {type: string, examples: ['public, max-age=60, stale-while-revalidate=300']}
    Cache-Control-NoStore:
      description: Respuesta no cacheable.
      schema: {type: string, enum: [no-store]}
    Set-Cookie-Sesion:
      description: 'sessionid=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/panel/ (rotada al autenticarse o cambiar privilegios; expirada al cerrar sesión).'
      schema: {type: string}
    Set-Cookie-Csrf:
      description: 'csrftoken=...; Secure; SameSite=Lax; Path=/'
      schema: {type: string}
  parameters:
    Pagina:
      name: pagina
      in: query
      description: Número de página (base 1). Fuera de rango → 404 pagina_fuera_de_rango.
      schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
    SlugPath:
      name: slug
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Slug'}
    IdPath:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    NumeroRevisionPath:
      name: numero
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    TipoContenidoPath:
      name: tipo
      in: path
      required: true
      schema: {$ref: '#/components/schemas/TipoContenidoRuta'}
    Q:
      name: q
      in: query
      required: true
      description: Texto de búsqueda (2..100 caracteres tras recortar espacios).
      schema: {type: string, minLength: 2, maxLength: 100}
    TextoFiltro:
      name: q
      in: query
      description: Filtro de texto del panel (título, alt, crédito según el recurso).
      schema: {type: string, minLength: 1, maxLength: 100}
    EstadoEditorialFiltro:
      name: estado
      in: query
      schema: {$ref: '#/components/schemas/EstadoEditorial'}
    VersionQuery:
      name: version
      in: query
      required: true
      description: Versión conocida por el cliente (bloqueo optimista, DEC-AUTO-050).
      schema: {type: integer, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        UUID opcional (DEC-AUTO-107, CHG-API-001). Ámbito: (cuenta, clave), único en TODAS las
        operaciones del panel (DB_HANDOFF v1.1, UNIQUE(cuenta_id, clave)); cada petición debe usar una
        clave nueva. Solo se guardan respuestas 2xx confirmadas, durante 24 h. Repetir la misma clave en
        la misma operación con la misma huella (operación + parámetros de ruta + cuerpo canónico) devuelve
        el código y el cuerpo originales sin repetir el efecto (ALT-017). Misma clave con otra operación u
        otra huella → 422 idempotencia_conflicto. Si hay una petición concurrente con la misma clave aún en
        curso y la espera supera 3 s → 409 idempotencia_en_curso con Retry-After (reintentable con la misma
        clave). Excepción: panelCrearCuenta no persiste su respuesta (AC-106, la contraseña temporal nunca
        se guarda); repetirla con una clave ya completada → 409 idempotencia_respuesta_no_reproducible con
        Location de la cuenta creada (DEC-AUTO-129). Si la operación falla (4xx/5xx) no se guarda nada y el
        reintento con la misma clave la ejecuta de nuevo.
      schema: {type: string, format: uuid}
  responses:
    Validacion:
      description: 400 validacion / parametro_invalido / campo_no_permitido.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemaValidacion'}
          example:
            type: https://brujulasalvaje.example/errors/validacion
            title: Datos inválidos
            status: 400
            detail: Revisa los campos marcados.
            code: validacion
            errors: {resumen: ['Máximo 300 caracteres.']}
            trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    NoAutenticado:
      description: 401 no_autenticado / sesion_expirada / credenciales_invalidas / mfa_requerido / mfa_invalido.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PermisoDenegado:
      description: 403 permiso_denegado / csrf_invalido / cambio_credencial_requerido / autorizacion_requerida / configuracion_mfa_requerida.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NoEncontrado:
      description: 404 no_encontrado / pagina_fuera_de_rango.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflicto:
      description: >-
        409 conflicto_version / transicion_invalida / slug_inmutable / slug_en_uso / duplicado /
        dependencia_bloqueante / medio_en_uso / ultimo_administrador / operacion_sobre_si_mismo /
        mfa_obligatorio / idempotencia_en_curso (reintentable: incluye Retry-After) /
        idempotencia_respuesta_no_reproducible (solo panelCrearCuenta: incluye Location).
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
        Retry-After:
          description: Solo con code idempotencia_en_curso. Segundos antes de reintentar con la misma Idempotency-Key.
          required: false
          schema: {type: integer, minimum: 1}
        Location:
          description: Solo con code idempotencia_respuesta_no_reproducible. Ruta de la cuenta creada (/api/v1/panel/cuentas/{id}).
          required: false
          schema: {type: string, format: uri-reference, pattern: '^/api/v1/panel/cuentas/[1-9][0-9]*$'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemaConUsos'}
          examples:
            idempotencia_en_curso:
              value:
                type: https://brujulasalvaje.example/errors/idempotencia_en_curso
                title: Petición en curso
                status: 409
                detail: Otra petición con la misma clave de idempotencia aún se está procesando. Reintenta en unos segundos.
                code: idempotencia_en_curso
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
            idempotencia_respuesta_no_reproducible:
              value:
                type: https://brujulasalvaje.example/errors/idempotencia_respuesta_no_reproducible
                title: La cuenta ya se creó
                status: 409
                detail: La contraseña temporal no puede mostrarse otra vez. Usa Restablecer contraseña sobre la cuenta indicada.
                code: idempotencia_respuesta_no_reproducible
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    Retirado:
      description: 410 retirado. Sin el cuerpo del contenido; incluye alternativas publicadas (DEC-AUTO-113).
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
        Cache-Control: {$ref: '#/components/headers/Cache-Control-Publico'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemaRetirado'}
    CargaDemasiadoGrande:
      description: 413 carga_demasiado_grande.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TipoNoSoportado:
      description: 415 tipo_medio_no_soportado (Content-Type de la petición no admitido).
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ReglaNegocio:
      description: 422 publicacion_invalida / regla_negocio / idempotencia_conflicto, con `errors` por campo.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemaValidacion'}
          example:
            type: https://brujulasalvaje.example/errors/publicacion_invalida
            title: No se puede publicar
            status: 422
            detail: Faltan requisitos de publicación.
            code: publicacion_invalida
            errors:
              galeria_ids: ['Se necesitan al menos 3 medios DISPONIBLES.']
              descripcion_experta: ['Mínimo 600 palabras.']
            trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    LimiteTasa:
      description: 429 limite_tasa / acceso_bloqueado_temporalmente.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ErrorInterno:
      description: 500 error_interno. Sin trazas ni detalles técnicos (ALT-025).
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NoDisponible:
      description: 503 servicio_no_disponible. Sin topología ni versiones (THREAT-028).
      headers:
        X-Trace-Id: {$ref: '#/components/headers/X-Trace-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    # ------------------------------------------------------------ Errores (RFC 9457)
    Problem:
      type: object
      description: |
        Problem Details (RFC 9457). `type` = `{PROBLEM_TYPE_BASE_URL}/errors/{code}` (base configurable,
        DEC-AUTO-103). `title` y `detail` en español, sin datos técnicos. Catálogo de `code`:
        400 validacion, parametro_invalido, campo_no_permitido ·
        401 no_autenticado, sesion_expirada, credenciales_invalidas, mfa_requerido, mfa_invalido ·
        403 permiso_denegado, csrf_invalido, cambio_credencial_requerido, autorizacion_requerida, configuracion_mfa_requerida ·
        404 no_encontrado, pagina_fuera_de_rango · 405 metodo_no_permitido ·
        409 conflicto_version, transicion_invalida, slug_inmutable, slug_en_uso, duplicado, dependencia_bloqueante, medio_en_uso, ultimo_administrador, operacion_sobre_si_mismo, mfa_obligatorio, idempotencia_en_curso, idempotencia_respuesta_no_reproducible ·
        410 retirado · 413 carga_demasiado_grande · 415 tipo_medio_no_soportado ·
        422 publicacion_invalida, regla_negocio, idempotencia_conflicto ·
        429 limite_tasa, acceso_bloqueado_temporalmente · 500 error_interno · 503 servicio_no_disponible.
      required: [type, title, status, code, trace_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string, maxLength: 200}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 1000}
        instance: {type: string, format: uri-reference}
        code: {type: string, pattern: '^[a-z][a-z0-9_]{2,63}$'}
        errors:
          type: object
          description: Mensajes por campo. Campos anidados con notación de puntos (p. ej. `dias.2.titulo`); errores generales en `_general`.
          additionalProperties:
            type: array
            items: {type: string, maxLength: 500}
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
    ProblemaConUsos:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            usos:
              type: array
              maxItems: 100
              items: {$ref: '#/components/schemas/ReferenciaUso'}
            total_usos: {type: integer, minimum: 0}
    ProblemaRetirado:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [alternativas]
          properties:
            alternativas:
              type: array
              maxItems: 6
              items: {$ref: '#/components/schemas/ContenidoRelacionado'}
            listado_padre:
              type: string
              description: Ruta pública del listado padre (p. ej. /destinos).
              pattern: '^/[a-z0-9/-]*$'
    EstadoSalud:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
      additionalProperties: false

    # ------------------------------------------------------------ Primitivas
    Id:
      type: integer
      format: int64
      minimum: 1
      description: Identificador interno (bigint identity, DB_HANDOFF). Nunca aparece en la API pública.
    Slug:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    Dificultad: {type: integer, minimum: 1, maximum: 5}
    Presupuesto: {type: integer, minimum: 1, maximum: 4}
    Mes: {type: integer, minimum: 1, maximum: 12}
    TramoDuracion:
      type: string
      enum: ['1-3', '4-7', '8-14', '15+']
    TextoEnriquecido:
      type: string
      contentMediaType: text/html
      maxLength: 200000
      description: >-
        HTML de lista blanca saneado en el servidor al guardar (RULE-022, DEC-AUTO-043/109): p, h2-h4,
        ul, ol, li, strong, em, blockquote y a[href] con http, https o ruta interna (RULE-021); términos
        de glosario como `<a href="/glosario#{slug}" data-glosario="{slug}">`. Todo lo demás se elimina.
    UrlSegura:
      type: string
      format: uri
      maxLength: 2000
      pattern: '^https?://'
      description: Solo http/https (RULE-021). Nunca se descarga desde el servidor (THREAT-022).
    EstadoEditorial:
      type: string
      enum: [BORRADOR, PUBLICADO, RETIRADO]
    EstadoMedio:
      type: string
      enum: [PENDIENTE_METADATOS, DISPONIBLE, RETIRADO]
    FormatoDerivado:
      type: string
      enum: [AVIF, WEBP, JPEG]
    TipoContenidoPublico:
      type: string
      enum: [DESTINO, ITINERARIO, GUIA, TIPO, COLECCION]
    TipoEntidadContenido:
      type: string
      enum: [DESTINO, ITINERARIO, GUIA, TIPO, COLECCION, TERMINO, PAGINA]
    TipoContenidoRuta:
      type: string
      enum: [destinos, itinerarios, guias, tipos-aventura, colecciones, glosario, paginas]
    Rol:
      type: string
      enum: [EDITOR, ADMINISTRADOR]
    EstadoCuenta:
      type: string
      enum: [PENDIENTE_ACTIVACION, ACTIVA, BLOQUEADA_TEMPORAL, DESACTIVADA, ANONIMIZADA]
    Continente:
      type: string
      enum: [AMERICA, EUROPA, AFRICA, ASIA, OCEANIA, ANTARTIDA]
    AccionAuditoria:
      type: string
      enum: [LOGIN_OK, LOGIN_FALLIDO, BLOQUEO, LOGOUT, AUTORIZACION_ACEPTADA, CAMBIO_CREDENCIAL, MFA_ACTIVAR, MFA_DESACTIVAR, CREAR, EDITAR, PUBLICAR, ACTUALIZAR_PUBLICACION, RETIRAR, REACTIVAR, ELIMINAR_BORRADOR, RESTAURAR_REVISION, SUBIR_MEDIO, EDITAR_MEDIO, RETIRAR_MEDIO, CONFIG_INICIO, CONFIG_SITIO, TAXONOMIA, CUENTA_CREAR, CUENTA_ROL, CUENTA_RESTABLECER, CUENTA_DESACTIVAR, CUENTA_REACTIVAR, CUENTA_ANONIMIZAR]
    PaginaMeta:
      type: object
      required: [total, pagina, tamano_pagina, total_paginas, siguiente, anterior]
      properties:
        total: {type: integer, minimum: 0}
        pagina: {type: integer, minimum: 1}
        tamano_pagina: {type: integer, minimum: 1}
        total_paginas: {type: integer, minimum: 0}
        siguiente: {type: ['string', 'null'], format: uri-reference}
        anterior: {type: ['string', 'null'], format: uri-reference}

    # ------------------------------------------------------------ Público: piezas comunes
    LicenciaPublica:
      type: object
      required: [codigo, nombre, requiere_atribucion]
      properties:
        codigo: {type: string, maxLength: 40}
        nombre: {type: string, maxLength: 120}
        url_texto_legal: {type: ['string', 'null'], format: uri}
        requiere_atribucion: {type: boolean}
    DerivadoImagen:
      type: object
      required: [ancho, formato, url]
      properties:
        ancho: {type: integer, minimum: 1}
        alto: {type: integer, minimum: 1}
        formato: {$ref: '#/components/schemas/FormatoDerivado'}
        url:
          type: string
          format: uri-reference
          description: Ruta estática pública con nombre generado por el sistema (DEC-AUTO-110).
    ImagenPublica:
      type: object
      description: Solo medios DISPONIBLES (RULE-005). Sin datos del staff (THREAT-019).
      required: [texto_alternativo, autor_credito, licencia, derivados]
      properties:
        texto_alternativo: {type: string, maxLength: 250}
        pie_de_foto: {type: ['string', 'null'], maxLength: 300}
        autor_credito: {type: string, maxLength: 150}
        fuente_url: {type: ['string', 'null'], format: uri}
        licencia: {$ref: '#/components/schemas/LicenciaPublica'}
        ancho: {type: integer, minimum: 1}
        alto: {type: integer, minimum: 1}
        derivados:
          type: array
          minItems: 1
          maxItems: 24
          items: {$ref: '#/components/schemas/DerivadoImagen'}
    ImagenPublicaNula:
      oneOf:
        - $ref: '#/components/schemas/ImagenPublica'
        - type: 'null'
    RefTaxonomia:
      type: object
      required: [slug, nombre]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        nombre: {type: string, maxLength: 150}
    RegionPublica:
      type: object
      required: [slug, nombre, continente]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        nombre: {type: string, maxLength: 60}
        continente: {$ref: '#/components/schemas/Continente'}
    PaisPublico:
      type: object
      required: [slug, nombre, codigo_iso2, region]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        nombre: {type: string, maxLength: 80}
        codigo_iso2: {type: string, pattern: '^[A-Z]{2}$'}
        region: {$ref: '#/components/schemas/RegionPublica'}
    NivelEscala:
      type: object
      required: [escala, nivel, etiqueta, descripcion]
      properties:
        escala: {type: string, enum: [DIFICULTAD, PRESUPUESTO]}
        nivel: {type: integer, minimum: 1, maximum: 5}
        etiqueta: {type: string, maxLength: 40}
        descripcion: {type: string, maxLength: 400}
    MetadatosEditoriales:
      type: object
      description: Autoría como firma de equipo (DEC-AUTO-039); nunca creado_por ni nombres del staff.
      required: [autoria, fecha_ultima_revision, seo_titulo, seo_descripcion, publicado_actualizado_en]
      properties:
        autoria: {type: string, maxLength: 120, examples: ['Equipo editorial Brújula Salvaje']}
        fecha_ultima_revision: {type: string, format: date}
        primera_publicacion_en: {type: ['string', 'null'], format: date-time}
        publicado_actualizado_en: {type: string, format: date-time}
        seo_titulo: {type: string, maxLength: 70}
        seo_descripcion: {type: string, maxLength: 160}
    FuentePublica:
      type: object
      required: [titulo]
      properties:
        titulo: {type: string, maxLength: 200}
        entidad_editora: {type: ['string', 'null'], maxLength: 150}
        url: {type: ['string', 'null'], format: uri}
        fecha_consulta: {type: ['string', 'null'], format: date}
    TerminoRef:
      type: object
      required: [slug, termino]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        termino: {type: string, maxLength: 150}
    ContenidoRelacionado:
      type: object
      required: [tipo, slug, titulo, origen]
      properties:
        tipo: {$ref: '#/components/schemas/TipoContenidoPublico'}
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: ['string', 'null'], maxLength: 300}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
        origen: {type: string, enum: [CURADO, AUTOMATICO], description: 'Curados primero y en su orden; complemento automático por afinidad (DEC-AUTO-042).'}
    ContenidoRefPublico:
      type: object
      required: [tipo, slug, titulo]
      properties:
        tipo: {$ref: '#/components/schemas/TipoContenidoPublico'}
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}

    # ------------------------------------------------------------ Público: tarjetas
    DestinoTarjeta:
      type: object
      required: [slug, titulo, pais, region, tipos, dificultad, portada]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        pais: {$ref: '#/components/schemas/RefTaxonomia'}
        region: {$ref: '#/components/schemas/RefTaxonomia'}
        tipos:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/RefTaxonomia'}
        dificultad: {$ref: '#/components/schemas/Dificultad'}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
    ItinerarioTarjeta:
      type: object
      required: [slug, titulo, destino, duracion_dias, dificultad, portada]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        destino: {$ref: '#/components/schemas/RefTaxonomia'}
        duracion_dias: {type: integer, minimum: 1, maximum: 60}
        dificultad: {$ref: '#/components/schemas/Dificultad'}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
    GuiaTarjeta:
      type: object
      required: [slug, titulo, resumen, categoria, fecha_ultima_revision, portada]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: string, maxLength: 300}
        categoria: {$ref: '#/components/schemas/RefTaxonomia'}
        fecha_ultima_revision: {type: string, format: date}
        minutos_lectura: {type: ['integer', 'null'], minimum: 1, description: 'ceil(palabras/200) (EXP-004, COULD).'}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
    TipoAventuraTarjeta:
      type: object
      required: [slug, titulo, resumen, nivel_exigencia, numero_destinos, portada]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: string, maxLength: 300}
        nivel_exigencia: {$ref: '#/components/schemas/Dificultad'}
        numero_destinos: {type: integer, minimum: 0}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
    ColeccionTarjeta:
      type: object
      required: [slug, titulo, resumen, numero_elementos, portada]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: string, maxLength: 300}
        numero_elementos: {type: integer, minimum: 0}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
    DestinoMapaItem:
      type: object
      required: [slug, titulo, pais, region, latitud, longitud, dificultad]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        pais: {$ref: '#/components/schemas/RefTaxonomia'}
        region: {$ref: '#/components/schemas/RefTaxonomia'}
        latitud: {type: number, minimum: -90, maximum: 90}
        longitud: {type: number, minimum: -180, maximum: 180}
        dificultad: {$ref: '#/components/schemas/Dificultad'}
    DestinoAleatorio:
      type: object
      required: [slug]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}

    # ------------------------------------------------------------ Público: detalles
    DestinoDetalle:
      type: object
      required: [slug, titulo, pais, resumen, descripcion_experta, tipos, tipo_principal, dificultad, meses_mejor_epoca, duracion_min_dias, duracion_max_dias, nivel_presupuesto, clima, como_llegar, seguridad_riesgos, sostenibilidad, latitud, longitud, portada, galeria, fuentes, terminos, itinerarios, itinerarios_total, itinerarios_afines, guias_relacionadas, relacionados, metadatos]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        pais: {$ref: '#/components/schemas/PaisPublico'}
        resumen: {type: string, maxLength: 300}
        descripcion_experta: {$ref: '#/components/schemas/TextoEnriquecido'}
        tipos:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/RefTaxonomia'}
        tipo_principal: {$ref: '#/components/schemas/RefTaxonomia'}
        dificultad: {$ref: '#/components/schemas/Dificultad'}
        meses_mejor_epoca:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/Mes'}
        duracion_min_dias: {type: integer, minimum: 1, maximum: 90}
        duracion_max_dias: {type: integer, minimum: 1, maximum: 90}
        nivel_presupuesto: {$ref: '#/components/schemas/Presupuesto'}
        clima: {type: string, maxLength: 5000}
        altitud_max_m: {type: ['integer', 'null'], minimum: -500, maximum: 9000}
        como_llegar: {$ref: '#/components/schemas/TextoEnriquecido'}
        seguridad_riesgos: {$ref: '#/components/schemas/TextoEnriquecido'}
        sostenibilidad: {$ref: '#/components/schemas/TextoEnriquecido'}
        latitud: {type: number, minimum: -90, maximum: 90}
        longitud: {type: number, minimum: -180, maximum: 180}
        portada: {$ref: '#/components/schemas/ImagenPublica'}
        galeria:
          type: array
          minItems: 3
          maxItems: 30
          items: {$ref: '#/components/schemas/ImagenPublica'}
        fuentes:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/FuentePublica'}
        terminos:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/TerminoRef'}
        itinerarios:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/ItinerarioTarjeta'}
        itinerarios_total: {type: integer, minimum: 0}
        itinerarios_afines:
          type: array
          description: Solo si el destino no tiene itinerarios (SCR-004).
          maxItems: 6
          items: {$ref: '#/components/schemas/ItinerarioTarjeta'}
        guias_relacionadas:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/GuiaTarjeta'}
        relacionados:
          type: array
          minItems: 3
          maxItems: 6
          items: {$ref: '#/components/schemas/ContenidoRelacionado'}
        metadatos: {$ref: '#/components/schemas/MetadatosEditoriales'}
    DiaItinerario:
      type: object
      required: [numero_dia, titulo, actividades]
      properties:
        numero_dia: {type: integer, minimum: 1, maximum: 60}
        titulo: {type: string, maxLength: 150}
        actividades: {$ref: '#/components/schemas/TextoEnriquecido'}
        distancia_km: {type: ['number', 'null'], minimum: 0}
        desnivel_positivo_m: {type: ['integer', 'null'], minimum: 0}
        desnivel_negativo_m: {type: ['integer', 'null'], minimum: 0}
        alojamiento_orientativo: {type: ['string', 'null'], maxLength: 300}
        consejos: {type: ['string', 'null'], contentMediaType: text/html}
    ItinerarioDetalle:
      type: object
      required: [slug, titulo, destino, duracion_dias, dificultad, tipos, resumen, dias, riesgos_seguridad, portada, galeria, fuentes, terminos, relacionados, metadatos]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        destino: {$ref: '#/components/schemas/DestinoTarjeta'}
        duracion_dias: {type: integer, minimum: 1, maximum: 60}
        dificultad: {$ref: '#/components/schemas/Dificultad'}
        tipos:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/RefTaxonomia'}
        resumen: {type: string, maxLength: 300}
        distancia_total_km: {type: ['number', 'null'], minimum: 0}
        desnivel_acumulado_m: {type: ['integer', 'null'], minimum: 0}
        dias:
          type: array
          minItems: 1
          maxItems: 60
          items: {$ref: '#/components/schemas/DiaItinerario'}
        riesgos_seguridad: {$ref: '#/components/schemas/TextoEnriquecido'}
        portada: {$ref: '#/components/schemas/ImagenPublica'}
        galeria:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/ImagenPublica'}
        fuentes:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/FuentePublica'}
        terminos:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/TerminoRef'}
        relacionados:
          type: array
          minItems: 3
          maxItems: 6
          items: {$ref: '#/components/schemas/ContenidoRelacionado'}
        metadatos: {$ref: '#/components/schemas/MetadatosEditoriales'}
    ChecklistItem:
      type: object
      required: [texto, esencial, orden]
      properties:
        texto: {type: string, maxLength: 200}
        grupo: {type: ['string', 'null'], maxLength: 60}
        esencial: {type: boolean}
        orden: {type: integer, minimum: 0}
    TipoAventuraDetalle:
      type: object
      required: [slug, titulo, resumen, descripcion, nivel_exigencia, portada, destinos, destinos_total, checklist, guias_relacionadas, fuentes, terminos, relacionados, metadatos]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: string, maxLength: 300}
        descripcion: {$ref: '#/components/schemas/TextoEnriquecido'}
        nivel_exigencia: {$ref: '#/components/schemas/Dificultad'}
        portada: {$ref: '#/components/schemas/ImagenPublica'}
        destinos:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/DestinoTarjeta'}
        destinos_total: {type: integer, minimum: 0}
        checklist:
          type: array
          description: Vacío si el tipo no tiene checklist (la sección se oculta, FEAT-011).
          maxItems: 100
          items: {$ref: '#/components/schemas/ChecklistItem'}
        guias_relacionadas:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/GuiaTarjeta'}
        fuentes:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/FuentePublica'}
        terminos:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/TerminoRef'}
        relacionados:
          type: array
          minItems: 3
          maxItems: 6
          items: {$ref: '#/components/schemas/ContenidoRelacionado'}
        metadatos: {$ref: '#/components/schemas/MetadatosEditoriales'}
    CategoriaGuiaPublica:
      type: object
      required: [slug, nombre, descripcion]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        nombre: {type: string, maxLength: 80}
        descripcion: {type: string, maxLength: 400}
    CategoriaGuiaIndice:
      allOf:
        - $ref: '#/components/schemas/CategoriaGuiaPublica'
        - type: object
          required: [numero_guias, guias_recientes]
          properties:
            numero_guias: {type: integer, minimum: 1}
            guias_recientes:
              type: array
              maxItems: 4
              items: {$ref: '#/components/schemas/GuiaTarjeta'}
    GuiaDetalle:
      type: object
      required: [slug, titulo, categoria, resumen, cuerpo, portada, destinos_relacionados, tipos_relacionados, remite_a_metodologia, fuentes, terminos, relacionados, metadatos]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        categoria: {$ref: '#/components/schemas/CategoriaGuiaPublica'}
        resumen: {type: string, maxLength: 300}
        cuerpo: {$ref: '#/components/schemas/TextoEnriquecido'}
        minutos_lectura: {type: ['integer', 'null'], minimum: 1}
        portada: {$ref: '#/components/schemas/ImagenPublica'}
        destinos_relacionados:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/DestinoTarjeta'}
        tipos_relacionados:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/RefTaxonomia'}
        remite_a_metodologia: {type: boolean}
        fuentes:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/FuentePublica'}
        terminos:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/TerminoRef'}
        relacionados:
          type: array
          minItems: 3
          maxItems: 6
          items: {$ref: '#/components/schemas/ContenidoRelacionado'}
        metadatos: {$ref: '#/components/schemas/MetadatosEditoriales'}
    ElementoColeccion:
      type: object
      required: [tipo, orden]
      description: Exactamente uno de `destino` / `itinerario` según `tipo`. Solo elementos publicados (RULE-024).
      properties:
        tipo: {type: string, enum: [DESTINO, ITINERARIO]}
        orden: {type: integer, minimum: 0}
        nota_editorial: {type: ['string', 'null'], maxLength: 300}
        destino:
          oneOf:
            - $ref: '#/components/schemas/DestinoTarjeta'
            - type: 'null'
        itinerario:
          oneOf:
            - $ref: '#/components/schemas/ItinerarioTarjeta'
            - type: 'null'
    ColeccionDetalle:
      type: object
      required: [slug, titulo, resumen, descripcion, portada, elementos, metadatos]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: string, maxLength: 300}
        descripcion: {$ref: '#/components/schemas/TextoEnriquecido'}
        portada: {$ref: '#/components/schemas/ImagenPublica'}
        elementos:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ElementoColeccion'}
        metadatos: {$ref: '#/components/schemas/MetadatosEditoriales'}
    PaginaInstitucionalPublica:
      type: object
      required: [slug, titulo, cuerpo, version_documento, vigente_desde, metadatos]
      properties:
        slug: {type: string, enum: [acerca-de, politica-de-tratamiento-de-datos, politica-de-cookies, aviso-legal]}
        titulo: {type: string, maxLength: 150}
        cuerpo: {$ref: '#/components/schemas/TextoEnriquecido'}
        version_documento: {type: string, maxLength: 20}
        vigente_desde: {type: string, format: date}
        metadatos: {$ref: '#/components/schemas/MetadatosEditoriales'}

    # ------------------------------------------------------------ Público: agregados
    Inicio:
      type: object
      required: [hero, destinos, itinerarios, guias, tipos]
      properties:
        hero:
          type: ['object', 'null']
          required: [titular, subtitulo, imagen]
          properties:
            titular: {type: string, maxLength: 80}
            subtitulo: {type: string, maxLength: 160}
            imagen: {$ref: '#/components/schemas/ImagenPublica'}
        destinos:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/DestinoTarjeta'}
        itinerarios:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/ItinerarioTarjeta'}
        guias:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/GuiaTarjeta'}
        tipos:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/TipoAventuraTarjeta'}
    ConfiguracionPublica:
      type: object
      required: [nombre_marca, texto_descargo, responsable]
      properties:
        nombre_marca: {type: string, maxLength: 60}
        lema: {type: ['string', 'null'], maxLength: 120}
        texto_descargo: {type: string, maxLength: 5000}
        responsable:
          type: object
          description: Si `definido` es false, el Frontend muestra `[RESPONSABLE POR DEFINIR]` (GAP-004).
          required: [definido]
          properties:
            definido: {type: boolean}
            nombre: {type: ['string', 'null'], maxLength: 150}
            identificacion: {type: ['string', 'null'], maxLength: 40}
            domicilio: {type: ['string', 'null'], maxLength: 200}
            canal_atencion: {type: ['string', 'null'], maxLength: 200}
    Escalas:
      type: object
      required: [dificultad, presupuesto]
      properties:
        dificultad:
          type: array
          minItems: 5
          maxItems: 5
          items: {$ref: '#/components/schemas/NivelEscala'}
        presupuesto:
          type: array
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/NivelEscala'}
    Meses:
      type: object
      required: [meses]
      properties:
        meses:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required: [mes, nombre, slug, numero_destinos, destacado]
            properties:
              mes: {$ref: '#/components/schemas/Mes'}
              nombre: {type: string, maxLength: 12}
              slug: {type: string, enum: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]}
              numero_destinos: {type: integer, minimum: 0}
              destacado:
                oneOf:
                  - $ref: '#/components/schemas/DestinoTarjeta'
                  - type: 'null'
    FacetasDestinos:
      type: object
      required: [tipos, regiones, dificultad, presupuesto, tramos_duracion]
      properties:
        tipos:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/RefTaxonomia'}
        regiones:
          type: array
          maxItems: 20
          items:
            type: object
            required: [slug, nombre, continente, paises]
            properties:
              slug: {$ref: '#/components/schemas/Slug'}
              nombre: {type: string, maxLength: 60}
              continente: {$ref: '#/components/schemas/Continente'}
              paises:
                type: array
                maxItems: 250
                items: {$ref: '#/components/schemas/RefTaxonomia'}
        dificultad:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/NivelEscala'}
        presupuesto:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/NivelEscala'}
        tramos_duracion:
          type: array
          maxItems: 4
          items:
            type: object
            required: [codigo, etiqueta, min_dias]
            properties:
              codigo: {$ref: '#/components/schemas/TramoDuracion'}
              etiqueta: {type: string, maxLength: 40}
              min_dias: {type: integer, minimum: 1}
              max_dias: {type: ['integer', 'null'], minimum: 1}
    ResultadoBusqueda:
      type: object
      required: [tipo, slug, titulo]
      properties:
        tipo: {type: string, enum: [DESTINO, ITINERARIO, GUIA, TIPO]}
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        resumen: {type: ['string', 'null'], maxLength: 300}
        pais: {type: ['string', 'null'], maxLength: 80}
        portada: {$ref: '#/components/schemas/ImagenPublicaNula'}
    GrupoBusqueda:
      type: object
      required: [total, resultados]
      properties:
        total: {type: integer, minimum: 0}
        resultados:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/ResultadoBusqueda'}
    BusquedaAgrupada:
      type: object
      description: No incluye `q` (el cliente ya la conoce y la muestra como texto, THREAT-010).
      required: [total, grupos]
      properties:
        total: {type: integer, minimum: 0}
        grupos:
          type: object
          required: [destinos, itinerarios, guias, tipos]
          properties:
            destinos: {$ref: '#/components/schemas/GrupoBusqueda'}
            itinerarios: {$ref: '#/components/schemas/GrupoBusqueda'}
            guias: {$ref: '#/components/schemas/GrupoBusqueda'}
            tipos: {$ref: '#/components/schemas/GrupoBusqueda'}
    TerminoGlosarioPublico:
      type: object
      required: [slug, termino, definicion, usado_en]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        termino: {type: string, maxLength: 150}
        definicion: {type: string, maxLength: 600}
        usado_en:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/ContenidoRefPublico'}
    CreditoMedio:
      type: object
      required: [imagen, usado_en]
      properties:
        imagen: {$ref: '#/components/schemas/ImagenPublica'}
        usado_en:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/ContenidoRefPublico'}
    EntradaIndice:
      type: object
      required: [tipo, slug, titulo, publicado_actualizado_en]
      properties:
        tipo: {type: string, enum: [DESTINO, ITINERARIO, TIPO, GUIA, CATEGORIA_GUIA, COLECCION, PAGINA]}
        slug: {$ref: '#/components/schemas/Slug'}
        titulo: {type: string, maxLength: 150}
        agrupacion:
          description: Región (destinos) o categoría (guías) para agrupar en SCR-022.
          oneOf:
            - $ref: '#/components/schemas/RefTaxonomia'
            - type: 'null'
        publicado_actualizado_en: {type: string, format: date-time}

    # ------------------------------------------------------------ Páginas (PaginaMeta + resultados)
    PaginaDestinoTarjeta:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/DestinoTarjeta'}}}}
    PaginaDestinoMapa:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/DestinoMapaItem'}}}}
    PaginaItinerarioTarjeta:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/ItinerarioTarjeta'}}}}
    PaginaTipoAventuraTarjeta:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/TipoAventuraTarjeta'}}}}
    PaginaCategoriaGuiaIndice:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/CategoriaGuiaIndice'}}}}
    PaginaGuiaTarjeta:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/GuiaTarjeta'}}}}
    PaginaColeccionTarjeta:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/ColeccionTarjeta'}}}}
    PaginaResultadoBusqueda:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/ResultadoBusqueda'}}}}
    PaginaTerminoGlosarioPublico:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/TerminoGlosarioPublico'}}}}
    PaginaCreditoMedio:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/CreditoMedio'}}}}
    PaginaEntradaIndice:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/EntradaIndice'}}}}
    PaginaContenidoResumen:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/ContenidoResumenPanel'}}}}
    PaginaRevisionResumen:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/RevisionResumen'}}}}
    PaginaMedioPanel:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/MedioPanel'}}}}
    PaginaUsoMedio:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/UsoMedio'}}}}
    PaginaRegion:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/Region'}}}}
    PaginaPais:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/Pais'}}}}
    PaginaCategoriaGuiaPanel:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/CategoriaGuiaPanel'}}}}
    PaginaLicencia:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/Licencia'}}}}
    PaginaCuenta:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/Cuenta'}}}}
    PaginaEventoAuditoria:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - {type: object, required: [resultados], properties: {resultados: {type: array, items: {$ref: '#/components/schemas/EventoAuditoria'}}}}

    # ------------------------------------------------------------ Panel: autenticación
    LoginEntrada:
      type: object
      additionalProperties: false
      required: [usuario, contrasena]
      properties:
        usuario: {type: string, minLength: 1, maxLength: 40}
        contrasena: {type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true}
        siguiente: {type: ['string', 'null'], maxLength: 2000, description: 'Solo se honra si es ruta relativa bajo /panel/ (AC-115).'}
    SesionEstado:
      type: object
      required: [usuario, nombre_visible, rol, paso_pendiente, mfa_activo, mfa_obligatorio, expira_inactividad_en, expira_absoluta_en, redireccion]
      properties:
        usuario: {type: string, maxLength: 40}
        nombre_visible: {type: string, maxLength: 100}
        rol: {$ref: '#/components/schemas/Rol'}
        paso_pendiente:
          type: string
          enum: [NINGUNO, MFA, CAMBIO_CREDENCIAL, CONFIGURAR_MFA, AUTORIZACION]
          description: >-
            Mientras no sea NINGUNO, el resto del panel responde 401 mfa_requerido o 403
            cambio_credencial_requerido / configuracion_mfa_requerida / autorizacion_requerida
            (STATE-004, DEC-AUTO-102/119).
        mfa_activo: {type: boolean}
        mfa_obligatorio: {type: boolean}
        expira_inactividad_en: {type: string, format: date-time}
        expira_absoluta_en: {type: string, format: date-time}
        redireccion: {type: string, pattern: '^/panel(/[A-Za-z0-9._~%/-]*)?$'}
    MfaVerificacionEntrada:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: {type: string, pattern: '^([0-9]{6}|[A-Z0-9]{4}-[A-Z0-9]{4})$', writeOnly: true}
    MfaCodigoEntrada:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    MfaDesactivacionEntrada:
      type: object
      additionalProperties: false
      required: [contrasena, codigo]
      properties:
        contrasena: {type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true}
        codigo: {type: string, pattern: '^([0-9]{6}|[A-Z0-9]{4}-[A-Z0-9]{4})$', writeOnly: true}
    MfaActivacionInicio:
      type: object
      required: [otpauth_uri, clave_secreta]
      properties:
        otpauth_uri: {type: string, pattern: '^otpauth://totp/', maxLength: 500}
        clave_secreta: {type: string, pattern: '^[A-Z2-7]{16,64}$'}
    CodigosRecuperacion:
      type: object
      required: [codigos]
      properties:
        codigos:
          type: array
          minItems: 10
          maxItems: 10
          items: {type: string, pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'}
    CambioContrasenaEntrada:
      type: object
      additionalProperties: false
      required: [contrasena_actual, contrasena_nueva]
      properties:
        contrasena_actual: {type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true}
        contrasena_nueva: {type: string, minLength: 12, maxLength: 128, format: password, writeOnly: true}
    AutorizacionVigente:
      type: object
      required: [version_politica, vigente_desde, resumen_finalidad, url_politica]
      properties:
        version_politica: {type: string, maxLength: 20}
        vigente_desde: {type: string, format: date}
        resumen_finalidad: {type: string, maxLength: 2000}
        url_politica: {type: string, enum: [/politica-de-tratamiento-de-datos]}
        otorgada_en: {type: ['string', 'null'], format: date-time}
        version_otorgada: {type: ['string', 'null'], maxLength: 20}
    AutorizacionEntrada:
      type: object
      additionalProperties: false
      required: [decision, version_politica]
      properties:
        decision: {type: string, enum: [AUTORIZO, NO_AUTORIZO]}
        version_politica: {type: string, maxLength: 20, description: 'Debe coincidir con la vigente; si no, 409 conflicto_version.'}

    # ------------------------------------------------------------ Panel: referencias comunes
    ActorRef:
      type: object
      required: [id, etiqueta]
      properties:
        id: {type: ['integer', 'null'], format: int64}
        etiqueta: {type: string, maxLength: 60, description: 'Usuario o seudónimo si la cuenta está anonimizada; "sistema" para procesos.'}
    ContenidoRefPanel:
      type: object
      required: [tipo, id, titulo, estado_editorial]
      properties:
        tipo: {$ref: '#/components/schemas/TipoEntidadContenido'}
        id: {$ref: '#/components/schemas/Id'}
        titulo: {type: string, maxLength: 150}
        slug: {type: ['string', 'null'], maxLength: 120}
        estado_editorial: {$ref: '#/components/schemas/EstadoEditorial'}
    ReferenciaUso:
      type: object
      required: [tipo_entidad, id, titulo]
      properties:
        tipo_entidad: {type: string, maxLength: 40}
        id: {$ref: '#/components/schemas/Id'}
        titulo: {type: string, maxLength: 150}
        estado_editorial:
          oneOf:
            - $ref: '#/components/schemas/EstadoEditorial'
            - type: 'null'
    MedioMiniatura:
      type: object
      required: [id, estado, url_miniatura]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        estado: {$ref: '#/components/schemas/EstadoMedio'}
        texto_alternativo: {type: ['string', 'null'], maxLength: 250}
        licencia_codigo: {type: ['string', 'null'], maxLength: 40}
        url_miniatura: {type: string, format: uri-reference}
    RequisitosPublicacion:
      type: object
      required: [cumple, pendientes]
      properties:
        cumple: {type: boolean}
        pendientes:
          type: array
          maxItems: 200
          items:
            type: object
            required: [campo, code, mensaje]
            properties:
              campo: {type: string, maxLength: 100}
              code: {type: string, pattern: '^[a-z][a-z0-9_]{2,63}$'}
              mensaje: {type: string, maxLength: 300}

    # ------------------------------------------------------------ Panel: contenido (común)
    RelacionEntrada:
      type: object
      additionalProperties: false
      required: [tipo, id]
      properties:
        tipo: {$ref: '#/components/schemas/TipoContenidoPublico'}
        id: {$ref: '#/components/schemas/Id'}
    FuenteEntrada:
      type: object
      additionalProperties: false
      required: [titulo]
      properties:
        titulo: {type: string, minLength: 1, maxLength: 200}
        entidad_editora: {type: ['string', 'null'], maxLength: 150}
        url: {type: ['string', 'null'], format: uri, maxLength: 2000, pattern: '^https?://'}
        fecha_consulta: {type: ['string', 'null'], format: date}
    ContenidoComunCampos:
      type: object
      description: Campos editoriales comunes (ATR-COMUN). Nunca incluye estado, autoría ni version (THREAT-024).
      properties:
        titulo: {type: string, minLength: 1, maxLength: 150}
        slug: {type: ['string', 'null'], maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: 'Null → se propone desde el título. Inmutable tras la primera publicación (RULE-008).'}
        fecha_ultima_revision: {type: ['string', 'null'], format: date, description: 'No futura (RULE-009).'}
        seo_titulo: {type: ['string', 'null'], maxLength: 70}
        seo_descripcion: {type: ['string', 'null'], maxLength: 160}
        relaciones:
          type: array
          description: Relacionados curados en orden (FEAT-039). Sin autorrelación ni duplicados.
          maxItems: 12
          items: {$ref: '#/components/schemas/RelacionEntrada'}
        terminos_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        fuentes:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/FuenteEntrada'}
    VersionCampo:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    IdOpcionalCampo:
      type: object
      properties:
        id: {type: ['integer', 'null'], format: int64, minimum: 1, description: 'Contenido en edición (para excluirlo de sus relacionados).'}
    ContenidoPanelMeta:
      type: object
      required: [id, tipo, estado_editorial, version, slug_bloqueado, creado_en, actualizado_en, creado_por, actualizado_por, requisitos_publicacion, referencias]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        tipo: {$ref: '#/components/schemas/TipoEntidadContenido'}
        estado_editorial: {$ref: '#/components/schemas/EstadoEditorial'}
        version: {type: integer, minimum: 1}
        slug_bloqueado: {type: boolean}
        primera_publicacion_en: {type: ['string', 'null'], format: date-time}
        publicado_actualizado_en: {type: ['string', 'null'], format: date-time}
        retirado_en: {type: ['string', 'null'], format: date-time}
        motivo_retiro: {type: ['string', 'null'], maxLength: 300}
        creado_en: {type: string, format: date-time}
        actualizado_en: {type: string, format: date-time}
        creado_por: {$ref: '#/components/schemas/ActorRef'}
        actualizado_por: {$ref: '#/components/schemas/ActorRef'}
        url_publica: {type: ['string', 'null'], pattern: '^/[a-z0-9/-]*$'}
        requisitos_publicacion: {$ref: '#/components/schemas/RequisitosPublicacion'}
        referencias:
          type: object
          description: Datos de visualización de los ids referenciados (medios, contenidos, términos, taxonomías).
          properties:
            medios:
              type: array
              maxItems: 60
              items: {$ref: '#/components/schemas/MedioMiniatura'}
            contenidos:
              type: array
              maxItems: 200
              items: {$ref: '#/components/schemas/ContenidoRefPanel'}
            terminos:
              type: array
              maxItems: 50
              items: {type: object, required: [id, termino], properties: {id: {$ref: '#/components/schemas/Id'}, termino: {type: string, maxLength: 150}}}
            taxonomias:
              type: array
              maxItems: 100
              items: {type: object, required: [clase, id, nombre], properties: {clase: {type: string, enum: [PAIS, TIPO, CATEGORIA]}, id: {$ref: '#/components/schemas/Id'}, nombre: {type: string, maxLength: 150}}}
    ContenidoResumenPanel:
      type: object
      required: [id, tipo, titulo, estado_editorial, version, actualizado_en, actualizado_por, publicado]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        tipo: {$ref: '#/components/schemas/TipoEntidadContenido'}
        titulo: {type: string, maxLength: 150}
        slug: {type: ['string', 'null'], maxLength: 120}
        estado_editorial: {$ref: '#/components/schemas/EstadoEditorial'}
        version: {type: integer, minimum: 1}
        fecha_ultima_revision: {type: ['string', 'null'], format: date}
        actualizado_en: {type: string, format: date-time}
        actualizado_por: {$ref: '#/components/schemas/ActorRef'}
        publicado: {type: boolean}
        url_publica: {type: ['string', 'null'], pattern: '^/[a-z0-9/-]*$'}
    VistaPrevia:
      type: object
      description: Resultado de vista previa (no-store, noindex, sin persistencia, DEC-AUTO-114).
      required: [marca, forma, datos, requisitos_publicacion]
      properties:
        marca: {type: string, enum: ['VISTA PREVIA – NO PUBLICADO']}
        forma: {type: string, enum: [DestinoDetalle, ItinerarioDetalle, GuiaDetalle, TipoAventuraDetalle, ColeccionDetalle, PaginaInstitucionalPublica]}
        datos:
          type: object
          description: Misma forma que el esquema indicado en `forma`; los campos aún no completados pueden faltar o ser null.
        requisitos_publicacion: {$ref: '#/components/schemas/RequisitosPublicacion'}

    # ------------------------------------------------------------ Panel: Destino
    # Patrón por tipo (DEC-AUTO-108): {T}Campos (todo opcional/nullable: el BORRADOR puede estar
    # incompleto; los requisitos "P" se exigen al publicar) · {T}Entrada (POST) · {T}Actualizacion (PUT,
    # con version) · {T}Panel (respuesta) · {T}VistaPrevia. Entradas con unevaluatedProperties:false.
    DestinoCampos:
      type: object
      properties:
        pais_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        resumen: {type: ['string', 'null'], maxLength: 300}
        descripcion_experta: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        tipos_ids:
          type: array
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        tipo_principal_id: {type: ['integer', 'null'], format: int64, minimum: 1, description: 'Debe pertenecer a tipos_ids.'}
        dificultad: {type: ['integer', 'null'], minimum: 1, maximum: 5}
        meses_mejor_epoca:
          type: array
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/Mes'}
        duracion_min_dias: {type: ['integer', 'null'], minimum: 1, maximum: 90}
        duracion_max_dias: {type: ['integer', 'null'], minimum: 1, maximum: 90}
        nivel_presupuesto: {type: ['integer', 'null'], minimum: 1, maximum: 4}
        clima: {type: ['string', 'null'], maxLength: 5000}
        altitud_max_m: {type: ['integer', 'null'], minimum: -500, maximum: 9000}
        como_llegar: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        seguridad_riesgos: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        sostenibilidad: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        latitud: {type: ['number', 'null'], minimum: -90, maximum: 90}
        longitud: {type: ['number', 'null'], minimum: -180, maximum: 180}
        portada_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        galeria_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
    DestinoEntrada:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/DestinoCampos'
      required: [titulo]
      unevaluatedProperties: false
    DestinoActualizacion:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/DestinoCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, version]
      unevaluatedProperties: false
    DestinoVistaPrevia:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/DestinoCampos'
        - $ref: '#/components/schemas/IdOpcionalCampo'
      required: [titulo]
      unevaluatedProperties: false
    DestinoPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/DestinoCampos'

    # ------------------------------------------------------------ Panel: Itinerario
    DiaEntrada:
      type: object
      additionalProperties: false
      required: [numero_dia]
      properties:
        numero_dia: {type: integer, minimum: 1, maximum: 60}
        titulo: {type: ['string', 'null'], maxLength: 150}
        actividades: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 50000}
        distancia_km: {type: ['number', 'null'], minimum: 0, maximum: 99999.9}
        desnivel_positivo_m: {type: ['integer', 'null'], minimum: 0, maximum: 20000}
        desnivel_negativo_m: {type: ['integer', 'null'], minimum: 0, maximum: 20000}
        alojamiento_orientativo: {type: ['string', 'null'], maxLength: 300}
        consejos: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 50000}
    ItinerarioCampos:
      type: object
      properties:
        destino_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        resumen: {type: ['string', 'null'], maxLength: 300}
        duracion_dias: {type: ['integer', 'null'], minimum: 1, maximum: 60}
        dificultad: {type: ['integer', 'null'], minimum: 1, maximum: 5}
        tipos_ids:
          type: array
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        distancia_total_km: {type: ['number', 'null'], minimum: 0, maximum: 99999.9}
        desnivel_acumulado_m: {type: ['integer', 'null'], minimum: 0, maximum: 1000000}
        riesgos_seguridad: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        portada_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        galeria_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        dias:
          type: array
          description: Número de días = duracion_dias para publicar (RULE-003, AC-118). numero_dia único.
          maxItems: 60
          items: {$ref: '#/components/schemas/DiaEntrada'}
    ItinerarioEntrada:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ItinerarioCampos'
      required: [titulo]
      unevaluatedProperties: false
    ItinerarioActualizacion:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ItinerarioCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, version]
      unevaluatedProperties: false
    ItinerarioVistaPrevia:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ItinerarioCampos'
        - $ref: '#/components/schemas/IdOpcionalCampo'
      required: [titulo]
      unevaluatedProperties: false
    ItinerarioPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ItinerarioCampos'

    # ------------------------------------------------------------ Panel: Guía
    GuiaCampos:
      type: object
      properties:
        categoria_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        resumen: {type: ['string', 'null'], maxLength: 300}
        cuerpo: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        destinos_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        tipos_ids:
          type: array
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        remite_a_metodologia: {type: boolean, default: false}
        portada_id: {type: ['integer', 'null'], format: int64, minimum: 1}
    GuiaEntrada:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/GuiaCampos'
      required: [titulo]
      unevaluatedProperties: false
    GuiaActualizacion:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/GuiaCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, version]
      unevaluatedProperties: false
    GuiaVistaPrevia:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/GuiaCampos'
        - $ref: '#/components/schemas/IdOpcionalCampo'
      required: [titulo]
      unevaluatedProperties: false
    GuiaPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/GuiaCampos'
        - type: object
          properties:
            palabras: {type: ['integer', 'null'], minimum: 0, readOnly: true}

    # ------------------------------------------------------------ Panel: Tipo de aventura
    ChecklistEntrada:
      type: object
      additionalProperties: false
      required: [texto, esencial, orden]
      properties:
        texto: {type: string, minLength: 1, maxLength: 200}
        grupo: {type: ['string', 'null'], maxLength: 60}
        esencial: {type: boolean}
        orden: {type: integer, minimum: 0, maximum: 1000}
    TipoAventuraCampos:
      type: object
      properties:
        resumen: {type: ['string', 'null'], maxLength: 300}
        descripcion: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        nivel_exigencia: {type: ['integer', 'null'], minimum: 1, maximum: 5}
        portada_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        orden: {type: integer, minimum: 0, maximum: 1000, default: 0}
        checklist:
          type: array
          description: Si existe, ≥8 elementos para publicar (RULE-025). Texto único por tipo.
          maxItems: 100
          items: {$ref: '#/components/schemas/ChecklistEntrada'}
    TipoAventuraEntrada:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/TipoAventuraCampos'
      required: [titulo]
      unevaluatedProperties: false
    TipoAventuraActualizacion:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/TipoAventuraCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, version]
      unevaluatedProperties: false
    TipoAventuraVistaPrevia:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/TipoAventuraCampos'
        - $ref: '#/components/schemas/IdOpcionalCampo'
      required: [titulo]
      unevaluatedProperties: false
    TipoAventuraPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/TipoAventuraCampos'

    # ------------------------------------------------------------ Panel: Colección
    ElementoColeccionEntrada:
      type: object
      additionalProperties: false
      required: [tipo_contenido, contenido_id, orden]
      properties:
        tipo_contenido: {type: string, enum: [DESTINO, ITINERARIO]}
        contenido_id: {$ref: '#/components/schemas/Id'}
        orden: {type: integer, minimum: 0, maximum: 1000}
        nota_editorial: {type: ['string', 'null'], maxLength: 300}
    ColeccionCampos:
      type: object
      properties:
        resumen: {type: ['string', 'null'], maxLength: 300}
        descripcion: {type: ['string', 'null'], contentMediaType: text/html, maxLength: 200000}
        portada_id: {type: ['integer', 'null'], format: int64, minimum: 1}
        elementos:
          type: array
          description: ≥4 publicados para publicar (RULE-024). Sin duplicados.
          maxItems: 100
          items: {$ref: '#/components/schemas/ElementoColeccionEntrada'}
    ColeccionEntrada:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ColeccionCampos'
      required: [titulo]
      unevaluatedProperties: false
    ColeccionActualizacion:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ColeccionCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, version]
      unevaluatedProperties: false
    ColeccionVistaPrevia:
      allOf:
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ColeccionCampos'
        - $ref: '#/components/schemas/IdOpcionalCampo'
      required: [titulo]
      unevaluatedProperties: false
    ColeccionPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/ContenidoComunCampos'
        - $ref: '#/components/schemas/ColeccionCampos'

    # ------------------------------------------------------------ Panel: Término de glosario
    TerminoGlosarioCampos:
      type: object
      properties:
        titulo: {type: string, minLength: 1, maxLength: 150, description: 'El término; único sin distinguir mayúsculas ni tildes (RULE-026).'}
        slug: {type: ['string', 'null'], maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        definicion: {type: ['string', 'null'], maxLength: 600}
        fecha_ultima_revision: {type: ['string', 'null'], format: date}
    TerminoGlosarioEntrada:
      allOf:
        - $ref: '#/components/schemas/TerminoGlosarioCampos'
      required: [titulo]
      unevaluatedProperties: false
    TerminoGlosarioActualizacion:
      allOf:
        - $ref: '#/components/schemas/TerminoGlosarioCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, version]
      unevaluatedProperties: false
    TerminoGlosarioPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/TerminoGlosarioCampos'
        - type: object
          required: [vinculado_en]
          properties:
            vinculado_en:
              type: array
              readOnly: true
              maxItems: 200
              items: {$ref: '#/components/schemas/ContenidoRefPanel'}

    # ------------------------------------------------------------ Panel: Página institucional
    PaginaInstitucionalCampos:
      type: object
      properties:
        titulo: {type: string, minLength: 1, maxLength: 150}
        cuerpo: {type: string, contentMediaType: text/html, maxLength: 200000}
        version_documento: {type: string, minLength: 1, maxLength: 20}
        vigente_desde: {type: string, format: date}
        fecha_ultima_revision: {type: ['string', 'null'], format: date}
        seo_titulo: {type: ['string', 'null'], maxLength: 70}
        seo_descripcion: {type: ['string', 'null'], maxLength: 160}
    PaginaInstitucionalActualizacion:
      allOf:
        - $ref: '#/components/schemas/PaginaInstitucionalCampos'
        - $ref: '#/components/schemas/VersionCampo'
      required: [titulo, cuerpo, version_documento, vigente_desde, version]
      unevaluatedProperties: false
    PaginaInstitucionalVistaPrevia:
      allOf:
        - $ref: '#/components/schemas/PaginaInstitucionalCampos'
        - $ref: '#/components/schemas/IdOpcionalCampo'
      required: [titulo]
      unevaluatedProperties: false
    PaginaInstitucionalPanel:
      allOf:
        - $ref: '#/components/schemas/ContenidoPanelMeta'
        - $ref: '#/components/schemas/PaginaInstitucionalCampos'
        - type: object
          required: [clave, solo_administrador]
          properties:
            clave: {type: string, enum: [ACERCA_DE, POLITICA_DATOS, POLITICA_COOKIES, AVISO_LEGAL], readOnly: true}
            solo_administrador: {type: boolean, readOnly: true}

    # ------------------------------------------------------------ Panel: ciclo editorial
    TransicionEntrada:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    RetiroEntrada:
      type: object
      additionalProperties: false
      required: [version, motivo]
      properties:
        version: {type: integer, minimum: 1}
        motivo: {type: string, minLength: 1, maxLength: 300, description: 'Interno; nunca se publica.'}
        confirmar_cascada: {type: boolean, default: false}
    ResultadoTransicion:
      type: object
      required: [id, tipo, estado_editorial, version, afectados]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        tipo: {$ref: '#/components/schemas/TipoEntidadContenido'}
        estado_editorial: {$ref: '#/components/schemas/EstadoEditorial'}
        version: {type: integer, minimum: 1}
        numero_revision: {type: ['integer', 'null'], minimum: 1}
        url_publica: {type: ['string', 'null'], pattern: '^/[a-z0-9/-]*$'}
        afectados:
          type: array
          description: Entidades retiradas en cascada (destino → itinerarios).
          maxItems: 200
          items: {$ref: '#/components/schemas/ContenidoRefPanel'}
    ImpactoRetiro:
      type: object
      required: [retirable, itinerarios_en_cascada, colecciones, destacados, enlaces_entrantes, bloqueos]
      properties:
        retirable: {type: boolean}
        itinerarios_en_cascada:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/ContenidoRefPanel'}
        colecciones:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/ContenidoRefPanel'}
        destacados:
          type: array
          maxItems: 3
          items: {type: string, enum: [DESTINOS, ITINERARIOS, GUIAS]}
        enlaces_entrantes: {type: integer, minimum: 0}
        bloqueos:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ReferenciaUso'}
    RevisionResumen:
      type: object
      required: [numero_revision, motivo, creado_en, creado_por]
      properties:
        numero_revision: {type: integer, minimum: 1}
        motivo: {type: string, enum: [PUBLICACION, ACTUALIZACION, RETIRO, RESTAURACION]}
        creado_en: {type: string, format: date-time}
        creado_por: {$ref: '#/components/schemas/ActorRef'}
    RevisionDetalle:
      allOf:
        - $ref: '#/components/schemas/RevisionResumen'
        - type: object
          required: [instantanea]
          properties:
            instantanea:
              type: object
              description: Documento estructurado con todos los campos y relaciones del contenido (DATA-026).
    RestauracionRevision:
      type: object
      required: [numero_revision, version_actual, datos]
      properties:
        numero_revision: {type: integer, minimum: 1}
        version_actual: {type: integer, minimum: 1}
        datos:
          type: object
          description: Cuerpo compatible con el `{Tipo}Actualizacion` del tipo, sin `version`.

    # ------------------------------------------------------------ Panel: medios
    SubidaMediosEntrada:
      type: object
      required: [archivos]
      properties:
        archivos:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: binary}
    ResultadoSubida:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [nombre_archivo, resultado]
            properties:
              nombre_archivo: {type: string, maxLength: 255, description: 'Dato del cliente: mostrar siempre como texto.'}
              resultado: {type: string, enum: [ACEPTADO, RECHAZADO, DUPLICADO]}
              medio:
                oneOf:
                  - $ref: '#/components/schemas/MedioPanel'
                  - type: 'null'
              medio_existente_id: {type: ['integer', 'null'], format: int64, minimum: 1}
              motivo:
                type: ['object', 'null']
                required: [code, detalle]
                properties:
                  code: {type: string, enum: [formato_no_permitido, tamano_excedido, dimensiones_insuficientes, megapixeles_excedidos, archivo_corrupto]}
                  detalle: {type: string, maxLength: 300}
    MedioCatalogacionEntrada:
      type: object
      additionalProperties: false
      properties:
        titulo_interno: {type: ['string', 'null'], maxLength: 150}
        texto_alternativo: {type: ['string', 'null'], maxLength: 250}
        pie_de_foto: {type: ['string', 'null'], maxLength: 300}
        autor_credito: {type: ['string', 'null'], maxLength: 150}
        fuente_url: {type: ['string', 'null'], format: uri, maxLength: 2000, pattern: '^https?://'}
        licencia_id: {type: ['integer', 'null'], format: int64, minimum: 1}
    MedioPanel:
      type: object
      required: [id, estado, formato_origen, ancho_px, alto_px, peso_bytes, derivados, numero_usos, en_uso_publicado, subido_por, subido_en, actualizado_en, pendientes_catalogacion]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        estado: {$ref: '#/components/schemas/EstadoMedio'}
        titulo_interno: {type: ['string', 'null'], maxLength: 150}
        texto_alternativo: {type: ['string', 'null'], maxLength: 250}
        pie_de_foto: {type: ['string', 'null'], maxLength: 300}
        autor_credito: {type: ['string', 'null'], maxLength: 150}
        fuente_url: {type: ['string', 'null'], format: uri}
        licencia:
          type: ['object', 'null']
          required: [id, codigo, nombre, compatible_publicacion]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            codigo: {type: string, maxLength: 40}
            nombre: {type: string, maxLength: 120}
            compatible_publicacion: {type: boolean}
        formato_origen: {type: string, enum: [JPEG, PNG, WEBP]}
        ancho_px: {type: integer, minimum: 1}
        alto_px: {type: integer, minimum: 1}
        peso_bytes: {type: integer, minimum: 1}
        derivados:
          type: array
          description: URLs del endpoint autenticado /api/v1/panel/medios/{id}/archivo.
          maxItems: 24
          items: {$ref: '#/components/schemas/DerivadoImagen'}
        numero_usos: {type: integer, minimum: 0}
        en_uso_publicado: {type: boolean}
        subido_por: {$ref: '#/components/schemas/ActorRef'}
        subido_en: {type: string, format: date-time}
        actualizado_en: {type: string, format: date-time}
        pendientes_catalogacion:
          type: array
          maxItems: 5
          items: {type: string, enum: [texto_alternativo, autor_credito, licencia, licencia_incompatible]}
    UsoMedio:
      type: object
      required: [tipo_contenido, contenido_id, titulo, rol]
      properties:
        tipo_contenido: {type: string, enum: [DESTINO, ITINERARIO, GUIA, TIPO, COLECCION, CONFIG_INICIO]}
        contenido_id: {$ref: '#/components/schemas/Id'}
        titulo: {type: string, maxLength: 150}
        estado_editorial:
          oneOf:
            - $ref: '#/components/schemas/EstadoEditorial'
            - type: 'null'
        rol: {type: string, enum: [PORTADA, GALERIA, HERO]}

    # ------------------------------------------------------------ Panel: destacados y configuración
    ConfigInicioCampos:
      type: object
      properties:
        hero_titular: {type: string, minLength: 1, maxLength: 80}
        hero_subtitulo: {type: string, minLength: 1, maxLength: 160}
        hero_medio_id: {$ref: '#/components/schemas/Id'}
        destinos_ids:
          type: array
          minItems: 6
          maxItems: 12
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        itinerarios_ids:
          type: array
          minItems: 3
          maxItems: 6
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
        guias_ids:
          type: array
          minItems: 3
          maxItems: 6
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
    ConfigInicioEntrada:
      allOf:
        - $ref: '#/components/schemas/ConfigInicioCampos'
      required: [hero_titular, hero_subtitulo, hero_medio_id, destinos_ids, itinerarios_ids, guias_ids]
      unevaluatedProperties: false
    ConfigInicioPanel:
      allOf:
        - $ref: '#/components/schemas/ConfigInicioCampos'
        - type: object
          required: [actualizado_en, actualizado_por, referencias]
          properties:
            actualizado_en: {type: string, format: date-time}
            actualizado_por: {$ref: '#/components/schemas/ActorRef'}
            referencias:
              type: object
              properties:
                medios:
                  type: array
                  maxItems: 1
                  items: {$ref: '#/components/schemas/MedioMiniatura'}
                contenidos:
                  type: array
                  maxItems: 24
                  items: {$ref: '#/components/schemas/ContenidoRefPanel'}
    ConfiguracionSitioCampos:
      type: object
      properties:
        nombre_marca: {type: string, minLength: 1, maxLength: 60}
        lema: {type: ['string', 'null'], maxLength: 120}
        texto_descargo: {type: string, minLength: 1, maxLength: 5000}
        responsable_nombre: {type: ['string', 'null'], maxLength: 150}
        responsable_identificacion: {type: ['string', 'null'], maxLength: 40}
        responsable_domicilio: {type: ['string', 'null'], maxLength: 200}
        responsable_canal_atencion: {type: ['string', 'null'], maxLength: 200}
    ConfiguracionSitioEntrada:
      allOf:
        - $ref: '#/components/schemas/ConfiguracionSitioCampos'
      required: [nombre_marca, texto_descargo]
      unevaluatedProperties: false
    ConfiguracionSitio:
      allOf:
        - $ref: '#/components/schemas/ConfiguracionSitioCampos'
        - type: object
          required: [actualizado_en]
          properties:
            actualizado_en: {type: string, format: date-time}

    # ------------------------------------------------------------ Panel: taxonomías y catálogos
    RegionCampos:
      type: object
      properties:
        nombre: {type: string, minLength: 1, maxLength: 60}
        slug: {$ref: '#/components/schemas/Slug'}
        continente: {$ref: '#/components/schemas/Continente'}
        orden: {type: integer, minimum: 0, maximum: 1000}
        activo: {type: boolean}
    RegionEntrada:
      allOf:
        - $ref: '#/components/schemas/RegionCampos'
      required: [nombre, slug, continente, orden, activo]
      unevaluatedProperties: false
    Region:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/Id'}
        - $ref: '#/components/schemas/RegionCampos'
    PaisCampos:
      type: object
      properties:
        nombre: {type: string, minLength: 1, maxLength: 80}
        slug: {$ref: '#/components/schemas/Slug'}
        codigo_iso2: {type: string, pattern: '^[A-Z]{2}$'}
        region_id: {$ref: '#/components/schemas/Id'}
        activo: {type: boolean}
    PaisEntrada:
      allOf:
        - $ref: '#/components/schemas/PaisCampos'
      required: [nombre, slug, codigo_iso2, region_id, activo]
      unevaluatedProperties: false
    Pais:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/Id'}
        - $ref: '#/components/schemas/PaisCampos'
    CategoriaGuiaCampos:
      type: object
      properties:
        nombre: {type: string, minLength: 1, maxLength: 80}
        slug: {$ref: '#/components/schemas/Slug'}
        descripcion: {type: string, minLength: 1, maxLength: 400}
        orden: {type: integer, minimum: 0, maximum: 1000}
        activo: {type: boolean}
    CategoriaGuiaEntrada:
      allOf:
        - $ref: '#/components/schemas/CategoriaGuiaCampos'
      required: [nombre, slug, descripcion, orden, activo]
      unevaluatedProperties: false
    CategoriaGuiaPanel:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/Id'}
        - $ref: '#/components/schemas/CategoriaGuiaCampos'
    LicenciaCampos:
      type: object
      properties:
        codigo: {type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9.-]+$'}
        nombre: {type: string, minLength: 1, maxLength: 120}
        url_texto_legal: {type: ['string', 'null'], format: uri, maxLength: 2000, pattern: '^https?://'}
        requiere_atribucion: {type: boolean}
        compatible_publicacion: {type: boolean}
        activo: {type: boolean}
    LicenciaEntrada:
      allOf:
        - $ref: '#/components/schemas/LicenciaCampos'
      required: [codigo, nombre, requiere_atribucion, compatible_publicacion, activo]
      unevaluatedProperties: false
    Licencia:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/Id'}
        - $ref: '#/components/schemas/LicenciaCampos'
    NivelEscalaEntrada:
      type: object
      additionalProperties: false
      required: [etiqueta, descripcion]
      properties:
        etiqueta: {type: string, minLength: 1, maxLength: 40}
        descripcion: {type: string, minLength: 1, maxLength: 400}
    NivelEscalaPanel:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/Id'}
        - $ref: '#/components/schemas/NivelEscala'
    EscalasPanel:
      type: object
      required: [dificultad, presupuesto]
      properties:
        dificultad:
          type: array
          minItems: 5
          maxItems: 5
          items: {$ref: '#/components/schemas/NivelEscalaPanel'}
        presupuesto:
          type: array
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/NivelEscalaPanel'}

    # ------------------------------------------------------------ Panel: cuentas y auditoría
    Cuenta:
      type: object
      required: [id, etiqueta, rol, estado, mfa_activo, debe_cambiar_credencial, creado_en]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        usuario: {type: ['string', 'null'], maxLength: 40, description: 'Null si ANONIMIZADA.'}
        nombre_visible: {type: ['string', 'null'], maxLength: 100}
        etiqueta: {type: string, maxLength: 60}
        rol: {$ref: '#/components/schemas/Rol'}
        estado: {$ref: '#/components/schemas/EstadoCuenta'}
        mfa_activo: {type: boolean}
        debe_cambiar_credencial: {type: boolean}
        ultimo_acceso_en: {type: ['string', 'null'], format: date-time}
        autorizacion_otorgada_en: {type: ['string', 'null'], format: date-time}
        autorizacion_version_politica: {type: ['string', 'null'], maxLength: 20}
        creado_en: {type: string, format: date-time}
        desactivado_en: {type: ['string', 'null'], format: date-time}
        anonimizado_en: {type: ['string', 'null'], format: date-time}
    CuentaCreacionEntrada:
      type: object
      additionalProperties: false
      required: [usuario, nombre_visible, rol]
      properties:
        usuario: {type: string, pattern: '^[a-z0-9._-]{3,40}$'}
        nombre_visible: {type: string, minLength: 1, maxLength: 100}
        rol: {$ref: '#/components/schemas/Rol'}
    CuentaActualizacionEntrada:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre_visible: {type: string, minLength: 1, maxLength: 100}
        rol: {$ref: '#/components/schemas/Rol'}
    CuentaConCredencialTemporal:
      type: object
      description: La contraseña temporal solo aparece en esta respuesta (no-store) y nunca se registra (AC-106).
      required: [cuenta, contrasena_temporal]
      properties:
        cuenta: {$ref: '#/components/schemas/Cuenta'}
        contrasena_temporal: {type: string, minLength: 16, maxLength: 64, format: password}
    EventoAuditoria:
      type: object
      required: [id, ocurrido_en, actor, accion, resultado]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        ocurrido_en: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/ActorRef'}
        accion: {$ref: '#/components/schemas/AccionAuditoria'}
        resultado: {type: string, enum: [EXITO, FALLO]}
        tipo_entidad: {type: ['string', 'null'], maxLength: 40}
        entidad_id: {type: ['integer', 'null'], format: int64}
        entidad_titulo: {type: ['string', 'null'], maxLength: 150}
        campos_cambiados:
          type: array
          description: Solo nombres de campos, nunca valores de secretos.
          maxItems: 100
          items: {type: string, maxLength: 100}
        ip_truncada: {type: ['string', 'null'], maxLength: 45, description: 'IPv4 /24 o IPv6 /48; solo eventos de autenticación.'}

    # ------------------------------------------------------------ Panel: tablero
    Tablero:
      type: object
      required: [conteos, recientes, alertas]
      properties:
        conteos:
          type: array
          maxItems: 7
          items:
            type: object
            required: [tipo, borrador, publicado, retirado]
            properties:
              tipo: {$ref: '#/components/schemas/TipoEntidadContenido'}
              borrador: {type: integer, minimum: 0}
              publicado: {type: integer, minimum: 0}
              retirado: {type: integer, minimum: 0}
        recientes:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/ContenidoResumenPanel'}
        alertas:
          type: array
          maxItems: 20
          items:
            type: object
            required: [code, mensaje]
            properties:
              code: {type: string, enum: [responsable_sin_definir, destacado_retirado, coleccion_bajo_minimo]}
              mensaje: {type: string, maxLength: 300}
              enlace: {type: ['string', 'null'], pattern: '^/panel(/[a-z0-9/-]*)?$'}
        salud_editorial:
          description: EXP-001 (COULD). Null si no está implementado.
          type: ['object', 'null']
          properties:
            revisiones_antiguas:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/ContenidoRefPanel'}
            medios_pendientes_metadatos: {type: integer, minimum: 0}
            medios_sin_uso: {type: integer, minimum: 0}
            colecciones_bajo_minimo:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/ContenidoRefPanel'}
            destacados_bajo_minimo:
              type: array
              maxItems: 3
              items: {type: string, enum: [DESTINOS, ITINERARIOS, GUIAS]}
            contenidos_con_pocos_relacionados:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/ContenidoRefPanel'}
