  # ---------------------------------------------------------------- PANEL: CICLO EDITORIAL (STATE-001)
  /api/v1/panel/contenidos/{tipo}/{id}/publicar:
    parameters:
      - $ref: '#/components/parameters/TipoContenidoPath'
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [panel-ciclo-editorial]
      operationId: panelPublicarContenido
      summary: BORRADOR → PUBLICADO con validación completa
      description: >-
        Valida RULE-002..006, 009, 023..027 según el tipo; si falla, 422 publicacion_invalida con `errors`
        por campo (lista enlazable a los campos, ALT-018). Si pasa: fija el slug, crea la instantánea
        (DATA-026) en la misma transacción y audita PUBLICAR. Estado distinto de BORRADOR: 409
        transicion_invalida. Páginas legales: solo Administrador.
      security:
        - sesionPanel: []
