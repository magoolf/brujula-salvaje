    get:
      tags: [publico-destinos]
      operationId: publicoObtenerFacetasDestinos
      summary: Opciones de los filtros de destinos (solo valores con contenido publicado)
      security: []
      x-trazabilidad: [FEAT-004, SCR-002, RULE-019]
      x-limite-tasa: publico-lectura
      responses:
