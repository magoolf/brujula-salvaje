openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Brújula Salvaje API
  version: 1.0.0
  summary: Contrato de diseño (API-first) v1 del portal editorial de aventura Brújula Salvaje.
  description: |
    Contrato de DISEÑO producido en F4 (TKT-F4-003) según Skill_Backend §12.0. El Developer implementa
    contra este documento con Django 5+ / DRF por capas y drf-spectacular; el pipeline compara el
    esquema generado con este contrato de forma semántica (openapi-diff, ver ADR-API-002) y ejecuta
    schemathesis (Skill_Backend §12.5). Cualquier diferencia se resuelve mediante CHG, nunca en silencio.

    Fuente: docs/02_blueprint/BLUEPRINT.md (§9 FEAT, §12 permisos, §15 STATE, §16 RULE, §18 modelo lógico,
    §38 handoff, §39 patrones de acceso, §40 THREAT-001..028). Decisiones: ADR-API-001 (autenticación) y
    ADR-API-002 (convenciones). DEC-AUTO-100..119 (ORIGEN: EXPANSIÓN_AUTÓNOMA, PROPOSED, reversibles).

    ## Superficies (DEC-AUTO-100)
    - `/api/v1/publico/**`: anónima, solo lectura (GET), solo contenido PUBLICADO (RULE-001), nunca fija
      cookies (RULE-029), nunca expone ids internos ni datos del staff (THREAT-011, THREAT-019).
    - `/api/v1/panel/**`: sesión Django + CSRF (ADR-API-001), autorización por acción en el servidor
      (deny-by-default, Blueprint §12), toda acción auditada (FEAT-046).
    - `/health/live`, `/health/ready`: fuera de la versión, respuesta mínima (THREAT-028).

    ## Cabeceras globales (todas las respuestas)
    - `X-Trace-Id`: 32 hex (W3C trace-id); coincide con `trace_id` de los errores y con logs/trazas.
    - Seguridad (THREAT-014/015): `Content-Security-Policy` (default-src 'self'; frame-ancestors 'none';
      object-src 'none'; base-uri 'self'; form-action 'self'), `X-Content-Type-Options: nosniff`,
      `Referrer-Policy: strict-origin-when-cross-origin`, `Permissions-Policy` restrictiva, HSTS solo en
      producción (DEC-004).
    - Panel: `Cache-Control: no-store` y `X-Robots-Tag: noindex, nofollow` en TODA respuesta (AC-119).
    - Público: `Cache-Control: public, max-age=60, stale-while-revalidate=300` salvo búsqueda y destino
      aleatorio (`no-store`). Nunca `Set-Cookie` (AC-060, AC-119).

    ## Errores (Skill_Backend §12.1, RFC 9457)
    Todas las respuestas de error usan `application/problem+json` con `type`, `title`, `status`, `detail`,
    `code`, `errors` (por campo) y `trace_id` (obligatorio). Catálogo de `code` en el esquema `Problem`.

    ## Paginación (DEC-AUTO-104)
    Paginación por número (`pagina`, base 1) con tamaño FIJO por recurso (sin parámetro de tamaño,
    THREAT-009). Página fuera de rango: 404 `pagina_fuera_de_rango`. Parámetros desconocidos o inválidos:
    400 `parametro_invalido` (AC-113), nunca 500.

    ## Límites de tasa (DEC-AUTO-111), clave = IP cliente (proxy de confianza) o cuenta
    | Perfil (`x-limite-tasa`) | Límite |
    |---|---|
    | publico-lectura | 120/min por IP |
    | publico-busqueda | 30/min por IP |
    | publico-aleatorio | 30/min por IP |
    | panel-login | 10/min por IP + bloqueo por usuario: 5 fallos, 15 min progresivo (RULE-017) |
    | panel-mfa | 10/min por sesión parcial (los fallos cuentan para el bloqueo) |
    | panel-lectura | 600/min por cuenta |
    | panel-escritura | 120/min por cuenta |
    | panel-subida | 20/min por cuenta |
    | panel-vista-previa | 60/min por cuenta |
  x-ticket: TKT-F4-003
  x-estado: PROPOSED
  x-adr: [ADR-API-001, ADR-API-002]
servers:
  - url: /
    description: Mismo origen (reverse proxy delante del SSR de Angular y de Django). Sin CORS (lista de orígenes vacía).
tags:
  - name: salud
    description: Liveness y readiness (FEAT-048).
  - name: publico-general
    description: Inicio, configuración pública, escalas, meses, índice y páginas institucionales.
  - name: publico-destinos
  - name: publico-itinerarios
  - name: publico-tipos
  - name: publico-guias
  - name: publico-colecciones
  - name: publico-busqueda
  - name: publico-glosario-creditos
  - name: panel-auth
    description: Sesión, MFA, credenciales propias y autorización de tratamiento (MOD-009).
  - name: panel-tablero
  - name: panel-contenidos
    description: CRUD editorial por tipo y vista previa (MOD-010).
  - name: panel-ciclo-editorial
    description: Publicar, retirar, reactivar y revisiones (STATE-001).
  - name: panel-medios
    description: Subida y catalogación de medios (MOD-011, DEC-AUTO-044).
  - name: panel-configuracion
    description: Destacados de inicio, taxonomías, catálogos y configuración del sitio (MOD-012).
  - name: panel-cuentas
    description: Cuentas del staff (solo Administrador, MOD-013).
  - name: panel-auditoria
    description: Consulta de auditoría (solo Administrador, solo lectura).
paths:
  /health/live:
    get:
      tags: [salud]
      operationId: saludLive
      summary: Proceso vivo
      security: []
      x-trazabilidad: [FEAT-048, AC-064]
      x-amenazas: [THREAT-028]
      responses:
        '200':
          description: El proceso responde. Sin versiones ni configuración.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EstadoSalud'}
              example: {status: ok}
  /health/ready:
    get:
      tags: [salud]
      operationId: saludReady
      summary: Dependencias alcanzables (BD y, si existe, broker)
      security: []
      x-trazabilidad: [FEAT-048, AC-064]
      x-amenazas: [THREAT-028]
      responses:
        '200':
          description: Listo para servir.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EstadoSalud'}
              example: {status: ok}
        '503': {$ref: '#/components/responses/NoDisponible'}

  # ---------------------------------------------------------------- PÚBLICO
  /api/v1/publico/inicio:
    get:
      tags: [publico-general]
      operationId: publicoObtenerInicio
      summary: Datos del inicio (destacados con relleno automático)
      description: >-
        Bloque principal, 6-12 destinos, 3-6 itinerarios, 3-6 guías y todos los tipos publicados. Si los
        destacados configurados no alcanzan los mínimos, el servidor completa con el contenido publicado de
        revisión más reciente (RULE-016). En un entorno sin contenido las listas pueden venir vacías.
      security: []
      x-trazabilidad: [FEAT-001, SCR-001, AP-01, RULE-016, AC-010, AC-011]
      x-limite-tasa: publico-lectura
      responses:
        '200':
          description: Inicio.
          headers:
            Cache-Control: {$ref: '#/components/headers/Cache-Control-Publico'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Inicio'}
        '400': {$ref: '#/components/responses/Validacion'}
        '429': {$ref: '#/components/responses/LimiteTasa'}
        '500': {$ref: '#/components/responses/ErrorInterno'}
  /api/v1/publico/configuracion:
    get:
      tags: [publico-general]
      operationId: publicoObtenerConfiguracion
      summary: Marca, lema, descargo y datos del Responsable del tratamiento
      security: []
      x-trazabilidad: [FEAT-015, FEAT-023, FEAT-047, RULE-010, DATA-023]
      x-limite-tasa: publico-lectura
      responses:
        '200':
          description: Configuración pública.
          headers:
            Cache-Control: {$ref: '#/components/headers/Cache-Control-Publico'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfiguracionPublica'}
