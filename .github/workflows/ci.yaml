# =============================================================================
# CI base — Brújula Salvaje (TKT-F6-001, Skill_devops §23.2, fail-fast en este orden):
#   checkout -> install (lockfile) -> lint/format -> typecheck -> unit tests + cobertura
#   -> contract tests (oasdiff + schemathesis) -> SAST (semgrep, bandit) -> SCA (pip-audit, npm audit)
#   -> secret scan (gitleaks) -> build imagen -> image scan (trivy CRITICAL/HIGH = fail)
#   -> SBOM (syft, CycloneDX) -> firma (cosign keyless, DESACTIVADA por defecto)
# NO IMPLEMENTADO (Puerta Humana, CLAUDE.md §0.5 / DEC-AUTO-002): deploy staging, E2E en staging,
# aprobación humana y deploy prod. Solo local; sin push a registros; sin secretos reales.
# Acciones fijadas por SHA de commit; herramientas con versión exacta + sha256 (VERSIONS.md).
# Los jobs de backend/frontend se saltan (con aviso) mientras no exista el código (F7).
# =============================================================================
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  PYTHON_VERSION: "3.13.15"
  UV_VERSION: "0.12.19"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  SYFT_VERSION: "1.51.0"
  SYFT_SHA256: "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f"
  COSIGN_VERSION: "3.1.3"
  COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
  OASDIFF_VERSION: "1.32.1"
  OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"
  SEMGREP_VERSION: "1.178.0"
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"
  SCHEMATHESIS_VERSION: "4.28.0"
  PYYAML_VERSION: "6.0.3"
  DB_CI_HOST_PORT: "5432"

jobs:
  # ---------------------------------------------------------------------------
  detect:
    name: detectar código
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: d
        run: |
          if [ -f backend/uv.lock ] && [ -f backend/manage.py ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; echo "::warning::backend/ sin uv.lock o manage.py: jobs de backend NOT_RUN"; fi
          if [ -f frontend/package-lock.json ] && [ -f frontend/angular.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; echo "::warning::frontend/ sin package-lock.json o angular.json: jobs de frontend NOT_RUN"; fi

  # ---------------------------------------------------------------------------
  infra:
    name: infraestructura (compose + secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: .env efímero (valores aleatorios por ejecución, no secretos reales)
        run: bash scripts/ops/init-env.sh .env
      - name: docker compose config (todas las variantes)
        run: |
          docker compose config --quiet
          docker compose --profile ops config --quiet
          docker compose -f compose.yaml -f compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f compose.debug.yaml config --quiet
      # RSK-OPS-025 (TKT-OPS-006, DEC-AUTO-254): todo Dockerfile del repositorio está en el ecosistema
      # "docker" de .github/dependabot.yml y sus FROM de imágenes externas son literales (Dependabot
      # no resuelve ARG en FROM: con "FROM ${X}" la imagen base quedaría sin vigilar).
      - name: "Dependabot: controles de cobertura (FROM con variable, minúsculas, Containerfile)"
        timeout-minutes: 5
        run: bash infra/ci/dependabot_cobertura_controles.sh infra/ci/dependabot_cobertura.sh
      - name: "Dependabot cubre todos los Dockerfile/Containerfile (directorio listado, FROM sin ARG)"
        timeout-minutes: 5
        run: bash infra/ci/dependabot_cobertura.sh .
      # RSK-OPS-001 / QA-OPS005-04 / QA-OPS006-01/02/03 (TKT-OPS-006, DEC-AUTO-252/256/258, DEC-AUTO-915):
      # política de trivy por LISTA BLANCA (infra/ci/politica_trivy.py; lista en DEVOPS_HANDOFF §19.14).
      # Carga los workflows con PyYAML (valores run: resueltos), analiza cada run: y cada *.sh como shell
      # (continuaciones, comentarios, comillas, expansiones) y exige que TODA aparición de trivy sea
      # 'trivy image' con solo flags y valores permitidos. Primero sus controles (positivos y negativos).
      - name: "política de trivy: PyYAML aislado (venv efímero)"
        run: |
          python3 -m venv "${RUNNER_TEMP}/politica"
          "${RUNNER_TEMP}/politica/bin/pip" install --disable-pip-version-check -q "pyyaml==${PYYAML_VERSION}"
          echo "PYTHON=${RUNNER_TEMP}/politica/bin/python" >> "$GITHUB_ENV"
      - name: "política de trivy: controles (una línea, multilínea, comentarios, YAML, trivy-action)"
        timeout-minutes: 5
        run: bash infra/ci/politica_trivy_controles.sh infra/ci/politica_trivy.sh
      - name: "política de trivy y de .trivyignore (formato, caducidad, sin vías paralelas)"
        timeout-minutes: 5
        run: bash infra/ci/politica_trivy.sh .
      # OBS-QA-OPS002-04 / DEC-AUTO-192: las reglas p/docker-compose de semgrep solo se aplican a YAML
      # con clave "version:" y no resuelven anclas/merge keys (<<: *hardening). Se escanea la salida
      # RESUELTA de "docker compose config" (con version: prepended) en $RUNNER_TEMP: contiene los
      # valores efímeros del .env de este job, nunca se publica como artefacto.
      - name: "SAST compose (semgrep p/docker-compose sobre la config resuelta)"
        run: |
          d="${RUNNER_TEMP}/compose-resuelto"; mkdir -p "$d"
          for extra in "" compose.ci.yaml compose.debug.yaml; do
            args=(-f compose.yaml); [ -n "$extra" ] && args+=(-f "$extra")
            { echo 'version: "3.9"'; docker compose "${args[@]}" --profile ops config; } > "$d/compose-${extra:-base}.yaml"
          done
          pipx run "semgrep==${SEMGREP_VERSION}" scan --metrics=off --error --config p/docker-compose "$d"
      - name: INFRA-DB-000 (init de PostgreSQL 18.6 en modo CI)
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait db
          # datlocprovider es de tipo "char": sin ::text, "char" || unknown es ambiguo en PostgreSQL 18
          # (ERROR: operator is not unique; TKT-OPS-003).
          loc="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T db psql -U postgres -d brujula -XAtc \
            "select datlocprovider::text||':'||datlocale from pg_database where datname='brujula'")"
          echo "brujula locale: ${loc}"
          test "${loc}" = 'b:C.UTF-8'
      - name: parar BD de INFRA-DB-000
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
      - name: gitleaks (secret scan del historial)
        run: |
          curl -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          # DEC-AUTO-207: se escanea TODO el historial alcanzable desde el commit probado (HEAD: en un
          # PR, el merge de prueba base+rama; en push a main, main), no "--all": fetch-depth 0 trae
          # todas las ramas publicadas y una rama ajena en curso no debe romper este pipeline (su
          # propio PR la escanea al integrarse). Excepciones: solo huellas exactas en .gitleaksignore.
          gitleaks git --redact --no-banner --exit-code 1 --log-opts="--full-history HEAD" .

  # ---------------------------------------------------------------------------
  backend:
    name: backend (lint, tipos, tests, SAST, SCA)
    needs: [detect, infra]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: {run: {working-directory: backend}}
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: brujula
      DB_USER: app_migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: "backend/uv.lock"}
      # TKT-OPS-003: el .env efímero y las variables se preparan ANTES del typecheck. El plugin de
      # django-stubs de mypy carga los settings, que fallan cerrados (ImproperlyConfigured) si falta
      # DB_PASSWORD; y "parar BD" necesita el .env para interpolar compose.yaml aunque falle antes.
      - name: entorno efímero (.env + variables, valores aleatorios por ejecución)
        working-directory: .
        run: |
          bash scripts/ops/init-env.sh .env
          {
            grep -E '^(DJANGO_SECRET_KEY|THROTTLE_HMAC_KEY|MFA_FERNET_KEY)=' .env
            echo "DB_PASSWORD=$(grep '^APP_MIGRATOR_PASSWORD=' .env | cut -d= -f2-)"
          } >> "$GITHUB_ENV"
      - name: install (lockfile)
        run: uv sync --frozen
      - name: lint / format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: typecheck
        run: uv run --frozen mypy .
      - name: PostgreSQL efímero (INFRA-DB-000 + plantilla de test)
        working-directory: .
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --wait db
      - name: migraciones (makemigrations --check + migrate)
        run: |
          uv run --frozen python manage.py makemigrations --check --dry-run
          uv run --frozen python manage.py migrate --noinput
      - name: unit tests + cobertura (umbral en la config de pytest del Developer)
        run: uv run --frozen pytest
      - name: check --deploy
        env: {DJANGO_DEBUG: "false", DJANGO_SECURE_SSL_REDIRECT: "true", DJANGO_SECURE_HSTS_SECONDS: "31536000"}
        run: uv run --frozen python manage.py check --deploy --fail-level WARNING
      # DEC-AUTO-196 (TKT-OPS-003) revisado por DEC-AUTO-211 (TKT-OPS-004): gate de contrato INCREMENTAL
      # por OPERACIÓN (método + ruta). Un "oasdiff diff --fail-on-diff" literal nunca pasa: el contrato
      # (API-first) tiene todas las operaciones escritas a mano y drf-spectacular solo genera lo implementado.
      #   1) infra/ci/gate_contrato.py: operaciones generadas ⊆ contrato; por operación, códigos de estado,
      #      media types y propiedades de respuesta (recursivo) ⊆ contrato; escribe el contrato FILTRADO
      #      a las operaciones implementadas (una ruta implementada en parte no cuenta como eliminada).
      #   2) "oasdiff breaking" contrato filtrado -> implementación con --fail-on ERR (antes WARN;
      #      relajado por decisión del usuario 2026-09-29, TKT-OPS-010: solo bloquean los cambios de
      #      severidad "error" -posibles rupturas reales de compatibilidad-, no los "warning" de
      #      fidelidad de formato/patrón/límites -deuda técnica, seguimiento en TKT-012-. Los valores
      #      válidos del flag son ERR/WARN/INFO, no "ERROR" (corregido tras el primer intento fallido
      #      del CI del PR, run 36561133019). Detalle: §20).
      #   3) --err-ignore infra/ci/oasdiff_err_ignore.txt (TKT-OPS-011, DEC-AUTO-920, decisión del
      #      usuario 2026-09-29): excepción PUNTUAL y NOMBRADA de un único hallazgo "error" restante
      #      tras TKT-OPS-010 (request-body-type-changed en POST /api/v1/panel/medios: multipart real
      #      -string/binary- vs contrato abstracto -object-), análoga en espíritu a .trivyignore
      #      (RSK-OPS-001). Formato y alcance exacto documentados en el propio archivo. Detalle: §21.
      # Controles N1..N12 + positivos: docs/05_operacion/DEVOPS_HANDOFF.md (TKT-OPS-004); N13 (objeto
      # abierto vs cerrado), N14 (esquema sin tipo vs tipado) y A1..A7 (autorreferenciados, recorrido
      # memoizado): §19 (TKT-OPS-006, DEC-AUTO-250/251). timeout-minutes acota cualquier regresión.
      - name: "contrato: controles del gate (sintéticos: N1..N14, autorreferenciados A1..A7)"
        timeout-minutes: 5
        run: uv run --frozen python ../infra/ci/gate_contrato_controles.py ../infra/ci/gate_contrato.py
      - name: "contrato: gate por operación + oasdiff (implementado vs contracts/openapi.yaml)"
        timeout-minutes: 5
        run: |
          curl -fsSLo /tmp/oasdiff.tgz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tgz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tgz -C /usr/local/bin oasdiff
          uv run --frozen python manage.py spectacular --validate --file /tmp/generado.yaml
          uv run --frozen python ../infra/ci/gate_contrato.py ../contracts/openapi.yaml /tmp/generado.yaml /tmp/contrato-filtrado.yaml
          if ! grep -qE '^  /' /tmp/generado.yaml; then echo "::warning::el esquema generado no tiene operaciones"; exit 0; fi
          oasdiff breaking /tmp/contrato-filtrado.yaml /tmp/generado.yaml --fail-on ERR --err-ignore ../infra/ci/oasdiff_err_ignore.txt
      - name: SAST (bandit + semgrep)
        run: |
          uvx --from "bandit==${BANDIT_VERSION}" bandit -r . -x ./.venv,./tests -ll
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan --metrics=off --error --config p/django --config p/python .
      - name: SCA (pip-audit sobre el lock)
        run: |
          uv export --frozen --no-hashes --format requirements-txt > /tmp/req.txt
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict --requirement /tmp/req.txt
      - name: parar BD
        if: always()
        working-directory: .
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v

  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (lint, tipos, tests, cliente generado, SCA)
    needs: [detect, infra]
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: install (lockfile)
        run: npm ci --no-audit --no-fund
      - name: lint / format
        run: npx --no-install eslint . --max-warnings=0
      - name: typecheck
        run: npx --no-install tsc --noEmit -p tsconfig.app.json
      - name: unit tests + cobertura (umbrales en la config de Vitest del Developer)
        run: npx --no-install ng test --watch=false --coverage
      - name: "contrato: cliente generado == contracts/openapi.yaml"
        run: |
          npm run api:generate
          git diff --exit-code -- src/app
      - name: SAST (semgrep)
        run: pipx run "semgrep==${SEMGREP_VERSION}" scan --metrics=off --error --config p/typescript --config p/javascript .
      - name: SCA (npm audit)
        run: npm audit --audit-level=high
      - name: build SSR
        run: npx --no-install ng build --configuration production

  # ---------------------------------------------------------------------------
  images:
    name: build + trivy + SBOM (+ smoke y schemathesis)
    needs: [detect, backend, frontend]
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: .env efímero
        run: bash scripts/ops/init-env.sh .env
      - name: build imágenes (sin push)
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: docker compose --profile ops build --pull
      - name: herramientas (trivy, syft) con sha256
        run: |
          curl -fsSLo /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          curl -fsSLo /tmp/syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
      # RSK-OPS-001 (decisión humana 2026-09-26, TKT-OPS-005, DEC-AUTO-225): las únicas excepciones son
      # las de .trivyignore (CVE Debian 13.7 SIN parche, una por línea, cada una con exp:AAAA-MM-DD).
      # Una entrada caducada deja de suprimir -> el job vuelve a fallar. Prohibidos --ignore-unfixed,
      # comodines, --ignore-policy y la supresión por paquete.
      # La POLÍTICA de .trivyignore y sus controles se ejecutan en el job "infra" (siempre, fail-fast;
      # TKT-OPS-006 ciclo 2, DEC-AUTO-256).
      - name: image scan (trivy CRITICAL/HIGH = fail; excepciones solo en .trivyignore con aprobación humana)
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: |
          mkdir -p reports
          rc=0
          # Objetivo SIEMPRE "brujula/…" entre comillas dobles: la política (lista blanca, DEC-AUTO-258)
          # solo admite expansiones en el objetivo si empieza por "brujula/" literal.
          for s in backend frontend proxy scheduler backup db; do
            # JSON completo (sin .trivyignore) como evidencia; el gate aplica .trivyignore y muestra lo suprimido
            trivy image --scanners vuln --severity CRITICAL,HIGH --format json --output "reports/trivy-${s}.json" "brujula/${s}:${APP_VERSION}"
            trivy image --scanners vuln --severity CRITICAL,HIGH --ignorefile .trivyignore --show-suppressed --exit-code 1 "brujula/${s}:${APP_VERSION}" || rc=1
          done
          exit $rc
      # Control negativo: con TODAS las caducidades en el pasado, el gate debe fallar (prueba de que la
      # caducidad funciona y de que las imágenes aún tienen hallazgos solo cubiertos por excepciones).
      # Si no queda ninguna excepción, el control no aplica y se informa.
      - name: "control negativo: .trivyignore caducado -> el gate falla"
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: |
          # Única excepción de la política (DEC-AUTO-258): --ignorefile /tmp/trivyignore-caducado solo
          # como condición de "if …; then … exit 1" y con este mismo generador sed en este run.
          sed -E 's/exp:[0-9]{4}-[0-9]{2}-[0-9]{2}/exp:2000-01-01/' .trivyignore > /tmp/trivyignore-caducado
          if ! grep -qE '^(CVE|GHSA)-' /tmp/trivyignore-caducado; then echo "sin excepciones: control no aplicable"; exit 0; fi
          # backend (excepciones Debian comunes) y db (además libxml2, 2.ª decisión humana)
          for s in backend db; do
            if trivy image -q --scanners vuln --severity CRITICAL,HIGH --ignorefile /tmp/trivyignore-caducado --exit-code 1 --format json --output "/tmp/neg-${s}.json" "brujula/${s}:${APP_VERSION}"; then
              echo "::error::el gate NO falló con excepciones caducadas (${s})"; exit 1
            fi
            echo "OK (${s}): con las excepciones caducadas el escáner falla (exit 1)"
          done
      - name: SBOM (syft, CycloneDX JSON)
        if: always()
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: |
          mkdir -p reports
          for s in backend frontend proxy scheduler backup db; do
            syft "brujula/${s}:${APP_VERSION}" -o "cyclonedx-json=reports/sbom-${s}.cdx.json"
          done
      # DEC-AUTO-196: schemathesis solo sobre las rutas públicas YA IMPLEMENTADAS (esquema generado por
      # el backend en ejecución); lo no implementado respondería 404 y no es un fallo de este cambio.
      # El gate "sin operaciones no documentadas" está en el job backend (oasdiff).
      - name: smoke (stack completo local en el runner) + schemathesis (superficie pública implementada)
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: |
          docker compose up -d --no-build --wait
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker compose exec -T backend sh -c 'python manage.py spectacular --file /tmp/generado.yaml >/dev/null'
          rutas="$(docker compose exec -T backend python - <<'PY'
          import re, yaml
          with open("/tmp/generado.yaml", encoding="utf-8") as f:
              paths = sorted(yaml.safe_load(f).get("paths") or {})
          sel = [p for p in paths if re.match(r"^/(api/v1/publico|health)/", p)]
          print("^(" + "|".join(re.sub(r"\\\{[^}]+\\\}", r"\\{[^}]+\\}", re.escape(p)) for p in sel) + ")$" if sel else "")
          PY
          )"
          test -n "$rutas" || { echo "::error::el backend no expone ninguna ruta pública ni de health"; exit 1; }
          echo "rutas: $rutas"
          pipx run "schemathesis==${SCHEMATHESIS_VERSION}" run contracts/openapi.yaml \
            --url http://127.0.0.1:8080 \
            --include-path-regex "$rutas" \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
      # HALLAZGO-QA-OPS002-02 / DEC-AUTO-190/194/195: los errores que genera el propio proxy salen
      # como application/problem+json (no text/html) y el JS del SSR sale comprimido (F-01, DEC-AUTO-191).
      - name: "smoke: errores del proxy como Problem Details + gzip del JS"
        run: |
          B=http://127.0.0.1:8080
          sleep 2
          seq 1 250 | xargs -P 50 -I{} curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "$B/api/v1/publico/inicio" > /tmp/rafaga.txt
          sort /tmp/rafaga.txt | uniq -c
          grep -q '^429 ' /tmp/rafaga.txt || { echo "::error::la ráfaga no produjo ningún 429"; exit 1; }
          if grep '^429 ' /tmp/rafaga.txt | grep -qv 'application/problem+json'; then echo "::error::429 sin application/problem+json"; exit 1; fi
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/health/live")" = 200
          q="$(head -c 9000 /dev/zero | tr '\0' a)"
          r="$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$B/api/v1/publico/inicio?q=$q")"
          echo "URI larga: $r"; test "$r" = "400 application/problem+json"
          js="$(curl -fsS "$B/" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/^src="//; s/"$//')"
          test -n "$js" || { echo "::error::el HTML del SSR no referencia ningún .js"; exit 1; }
          enc="$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip' "$B/${js#/}" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2}')"
          echo "/${js#/}: Content-Encoding=${enc:-ninguno}"; test "$enc" = gzip
          # TKT-OPS-004 (DEC-AUTO-212/213/214): 403/404 del proxy como Problem Details, cabeceras de
          # seguridad en los errores del proxy y zona "salud" propia para /health (RSK-OPS-016).
          problema() {  # uso: problema <estado esperado> <curl args...>
            esperado="$1"; shift
            curl -s -o /tmp/cuerpo.json -D /tmp/cab.txt -w '%{http_code} %{content_type}' "$@" > /tmp/res.txt
            echo "$(echo "$*" | cut -c1-80) -> $(cat /tmp/res.txt)"
            test "$(cat /tmp/res.txt)" = "$esperado application/problem+json"
            python3 -c 'import json,sys; d=json.load(open("/tmp/cuerpo.json")); assert d["status"]==int(sys.argv[1]) and len(d["trace_id"])==32, d' "$esperado"
            for h in x-content-type-options content-security-policy x-frame-options referrer-policy x-trace-id cache-control; do
              grep -qi "^$h:" /tmp/cab.txt || { echo "::error::falta la cabecera $h en el $esperado del proxy"; exit 1; }
            done
          }
          problema 404 "$B/health/otra"
          problema 404 "$B/media/privado/x.jpg"
          problema 403 -X POST "$B/"
          problema 400 "$B/api/v1/publico/inicio?q=$q"
          # OBS-QA-OPS004-03 (TKT-OPS-006, DEC-AUTO-253): método no admitido sobre una imagen pública ->
          # 405 metodo_no_permitido con Allow y SIN el Cache-Control immutable de las imágenes.
          for m in PUT DELETE PATCH; do
            problema 405 -X "$m" "$B/media/publico/x/y.jpg"
            grep -qi '^allow: GET, HEAD' /tmp/cab.txt || { echo "::error::405 sin Allow: GET, HEAD"; exit 1; }
            grep -qi '^cache-control: no-store' /tmp/cab.txt || { echo "::error::405 sin Cache-Control no-store"; exit 1; }
            if grep -qi 'immutable' /tmp/cab.txt; then echo "::error::405 con caché inmutable"; exit 1; fi
            grep -q '"code":"metodo_no_permitido"' /tmp/cuerpo.json || { echo "::error::405 sin code metodo_no_permitido"; exit 1; }
          done
          seq 1 120 | xargs -P 1 -I{} curl -s -o /dev/null -w '%{http_code}\n' "$B/health/live" > /tmp/salud_normal.txt
          sort /tmp/salud_normal.txt | uniq -c
          test "$(grep -vc '^200$' /tmp/salud_normal.txt)" = 0 || { echo "::error::/health recibe no-200 a ritmo de sondeo"; exit 1; }
          # Ráfaga con conexiones keep-alive (20 x 50 peticiones): supera 50 r/s + burst 200 en cualquier runner.
          python3 - "$B" <<'PY'
          import collections, concurrent.futures as cf, http.client, sys, urllib.parse
          u = urllib.parse.urlsplit(sys.argv[1])
          def rafaga(n):
              c, r = http.client.HTTPConnection(u.hostname, u.port, timeout=10), []
              for _ in range(n):
                  c.request("GET", "/health/live")
                  resp = c.getresponse(); resp.read()
                  r.append((resp.status, resp.getheader("Content-Type")))
              return r
          with cf.ThreadPoolExecutor(20) as ex:
              res = [x for f in [ex.submit(rafaga, 50) for _ in range(20)] for x in f.result()]
          cuenta = collections.Counter(res); print(dict(cuenta))
          if not cuenta.get((429, "application/problem+json")):
              print("::error::la ráfaga a /health no produjo 429 Problem Details"); sys.exit(1)
          if set(cuenta) - {(200, "application/json"), (429, "application/problem+json")}:
              print("::error::respuestas inesperadas en la ráfaga a /health"); sys.exit(1)
          PY
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/health/ready")" = 200
      # TKT-OPS-018 (condición de F9; ADR-OPS-001, RSK-OPS-040, TKT-OPS-019, DEC-AUTO-932): la zona
      # "estaticos" y la defensa anti-evasión dependen de NG_ALLOWED_HOSTS y de que Angular valide el
      # Host ANTES de renderizar; una regresión pasaría en silencio (el proxy convierte también un 404
      # renderizado en 404 Problem Details). El script comprueba: C1 asset inexistente -> 404
      # problem+json y rechazo de Host en el log del SSR (0 renders, 0 error_ssr); C2 ráfaga de 120
      # assets reales sin 429; C3 /api en por_ip: con por_ip saturada por POST / (403 sin upstream),
      # las sondas a /api reciben 429 del propio limitador (no depende de DRF ni del orden de pasos,
      # QA TKT-OPS-018 F-018-01); C4 la query de un asset inexistente no llega a los logs; C5
      # NG_ALLOWED_HOSTS sin "*" ni hosts ".invalid"; C6 "/x.js%0A" no entra en la location de
      # assets (ancla \z, DEC-AUTO-935).
      # TKT-OPS-020 (DEC-AUTO-939): C3 analiza el log del proxy como JSON y filtra por campos (ruta,
      # ruta_pedida, upstream_s, estado), así que no depende del orden del log_format. AVISO: tras C3,
      # por_ip queda saturada ~3 s. El script termina C3 con una espera explícita
      # (SMOKE_ESPERA_TRAS_C3, por defecto 4 s). Si se añade un paso HTTP justo después y se reduce esa
      # espera, ese paso recibirá 429 del borde.
      - name: "smoke: anti-evasión del limitador de borde (assets estáticos)"
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: bash scripts/ops/smoke-anti-evasion.sh http://127.0.0.1:8080
      # RSK-OPS-009 / DEC-AUTO-158: gunicorn vuelve en silencio al formato texto si no puede leer
      # --log-config-json. Se para el backend (para capturar también el apagado) y se exige que
      # TODAS las líneas no vacías de su log sean objetos JSON (y que haya al menos una).
      - name: "smoke: logs del backend 100 % JSON (arranque + parada)"
        env: {APP_VERSION: "ci-${{ github.sha }}"}
        run: |
          mkdir -p reports
          docker compose stop backend
          docker compose logs --no-color --no-log-prefix backend > reports/backend.log 2>&1
          python3 - reports/backend.log <<'PY'
          import json, sys
          total, malas = 0, []
          with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
              for n, linea in enumerate(f, 1):
                  linea = linea.strip()
                  if not linea:
                      continue
                  total += 1
                  try:
                      ok = isinstance(json.loads(linea), dict)
                  except ValueError:
                      ok = False
                  if not ok:
                      malas.append(n)
          print(f"backend: {total} líneas, {len(malas)} no JSON")
          for n in malas[:20]:
              print(f"::error::línea {n} del log del backend no es JSON")
          sys.exit(1 if malas or total == 0 else 0)
          PY
      - name: logs del stack
        if: always()
        run: docker compose logs --no-color > reports/compose.log 2>&1 || true
      - name: parar stack
        if: always()
        run: docker compose --profile ops down -v
      - name: publicar evidencias (SBOM, trivy, logs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Firma cosign KEYLESS (OIDC de GitHub + Sigstore público, sin secretos). DESACTIVADA por defecto:
  # publica la identidad del repositorio en el log de transparencia Rekor. Se activa con la variable
  # de repositorio COSIGN_KEYLESS_ENABLED=true tras decisión humana. Firma los SBOM (sign-blob);
  # la firma de imágenes requiere un registro (push = Puerta Humana, DEC-AUTO-002).
  sign:
    name: firma keyless de SBOM (opcional)
    needs: [images]
    if: vars.COSIGN_KEYLESS_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: cosign con sha256
        run: |
          curl -fsSLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign
      - name: descargar SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "supply-chain-${{ github.sha }}", path: reports}
      - name: firmar
        run: |
          for f in reports/sbom-*.cdx.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

  # ---------------------------------------------------------------------------
  # deploy-staging / e2e-staging / deploy-prod: NO IMPLEMENTADOS.
  # Requieren: ADR de plataforma (Skill_devops §23.5), entornos y secretos separados, registro de
  # imágenes y aprobación humana (CLAUDE.md §0.5). El mismo digest se promociona sin reconstruir (§23.3).
