# =============================================================================
# Dependabot — Brújula Salvaje (DEC-AUTO-180, TKT-OPS-003)
# Actualizaciones semanales (lunes 06:00 Europe/Madrid) con pocos PR abiertos a la vez.
# Cada PR de Dependabot pasa por el pipeline completo (main protegida: PR + CI verde) y por QA
# como cualquier otro cambio: un PR de Dependabot NO se integra sin revisión (Skill_devops §5).
# DEC-AUTO-210 (TKT-OPS-004): se ignoran las actualizaciones de versión semver-major en TODOS los
# ecosistemas (una mayor es un cambio de stack: la fija el Contrato Técnico / ticket, no un bot);
# se mantienen parches y menores. El "ignore" por update-types solo afecta a las actualizaciones de
# versión, no a las de SEGURIDAD.
# "Dependabot security updates" está ACTIVADO en el repositorio desde el 2026-09-26 (DEC-AUTO-230,
# RSK-OPS-021; verificable con: gh api repos/magoolf/brujula-salvaje/automated-security-fixes).
# Es un ajuste del repositorio, no de este fichero: si se desactiva, este comentario deja de ser
# cierto. Los PR de seguridad pasan por el mismo CI obligatorio y triage que el resto.
# Los cambios de manifest (package.json, pyproject.toml) siguen siendo competencia del Developer
# (CLAUDE.md §0.3): el Orquestador los asigna como ticket; Dependabot solo los propone.
# =============================================================================
version: 2

updates:
  # Frontend Angular (npm + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Madrid"}
    open-pull-requests-limit: 3
    versioning-strategy: "increase"
    commit-message: {prefix: "chore(deps-frontend)"}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
        update-types: ["minor", "patch"]
      # TKT-OPS-026 (DEC-AUTO-956): vitest y sus plugins (@vitest/coverage-v8 exige la MISMA versión
      # exacta de vitest como peer): por separado el PR falla en npm ci con ERESOLVE (PR #58).
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]

  # Backend Django (uv + uv.lock)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Madrid"}
    open-pull-requests-limit: 3
    commit-message: {prefix: "chore(deps-backend)"}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imágenes base de TODOS los Dockerfile del repositorio (RSK-OPS-025, TKT-OPS-006, DEC-AUTO-254):
  # /infra/db contiene ahora el digest de postgres (ya no está en compose.yaml). Dependabot no
  # resuelve ARG en FROM: los Dockerfile llevan la imagen LITERAL en FROM. Un Dockerfile nuevo debe
  # añadirse aquí (lo comprueba el paso "Dependabot cubre todos los Dockerfile" del CI).
  # Grupo "postgres": el servidor (infra/db) y el cliente de copias (infra/backup) deben llevar el
  # MISMO digest (ADR-DB-004): se actualizan juntos en un único PR.
  - package-ecosystem: "docker"
    directories: ["/infra/db", "/infra/docker", "/infra/proxy", "/infra/backup"]
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Madrid"}
    open-pull-requests-limit: 2
    commit-message: {prefix: "chore(deps-docker)"}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      postgres:
        patterns: ["postgres"]

  # compose*.yaml: hoy no fija imágenes de terceros (todas son brujula/*, construidas desde los
  # Dockerfile de arriba; postgres pasó a infra/db/Dockerfile, TKT-OPS-005). Se mantiene para que una
  # imagen de terceros que se añada a compose quede vigilada.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Madrid"}
    open-pull-requests-limit: 1
    commit-message: {prefix: "chore(deps-compose)"}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones de GitHub (fijadas por SHA; Dependabot actualiza SHA + comentario de versión)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Madrid"}
    open-pull-requests-limit: 2
    commit-message: {prefix: "chore(deps-ci)"}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      acciones:
        patterns: ["*"]
